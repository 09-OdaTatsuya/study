<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platform Data アーキテクト 過去問</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
<style>
:root{
  --bg:#F7F8FA; --fg:#14181F; --muted:#5A6472; --rule:#DEE3EA; --card:#FFFFFF;
  --accent:#225098; --accent-soft:#DCEFFB; --accent-ink:#1A3F78;
  --ok:#0F7A4D; --ok-soft:#E3F5EC; --ok-rule:#B9E2CD;
  --ng:#B3261E; --ng-soft:#FCEBEA; --ng-rule:#F0C5C2;
  --note:#8E4410; --note-soft:#FBEEE3; --note-rule:#E9CFB6;
  --serif:"Noto Serif JP",'Hiragino Mincho ProN',serif;
  --sans:"Noto Sans JP",'Hiragino Sans','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151B; --fg:#E6EAF0; --muted:#95A1B1; --rule:#273141; --card:#171D25;
  --accent:#74B8EF; --accent-soft:#16293C; --accent-ink:#A7D3F6;
  --ok:#5FC79A; --ok-soft:#10261D; --ok-rule:#2B4A3B;
  --ng:#F2938C; --ng-soft:#2A1514; --ng-rule:#4D2A27;
  --note:#E8A972; --note-soft:#2C1F14; --note-rule:#4A382A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --fg:#E6EAF0; --muted:#95A1B1; --rule:#273141; --card:#171D25;
  --accent:#74B8EF; --accent-soft:#16293C; --accent-ink:#A7D3F6;
  --ok:#5FC79A; --ok-soft:#10261D; --ok-rule:#2B4A3B;
  --ng:#F2938C; --ng-soft:#2A1514; --ng-rule:#4D2A27;
  --note:#E8A972; --note-soft:#2C1F14; --note-rule:#4A382A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.8;
  -webkit-text-size-adjust:100%;letter-spacing:.01em}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

.wrap{max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--rule)}
#bar .in{padding-block:9px;display:flex;align-items:center;gap:10px;min-width:0}
#qnum{font-family:var(--mono);font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
#qmode{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 9px;border-radius:999px;flex:none}
#barsp{flex:1}
.bbtn{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--fg);font-family:var(--sans);
  font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer;flex:none;line-height:1.5}
.bbtn:hover{border-color:var(--accent)}
#progBar{height:2px;background:var(--accent);width:0}

/* home */
header.top{padding-block:34px 14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(25px,7vw,34px);line-height:1.35;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 4px}
.sub b{color:var(--fg);font-weight:700}
.modes{display:grid;gap:10px;padding-block:18px 8px}
.mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;cursor:pointer;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:15px 16px;
  font-family:var(--sans);font-size:15px;color:var(--fg);line-height:1.5}
.mode:hover{border-color:var(--accent);background:var(--accent-soft)}
.mode .nm{font-weight:700;flex:none}
.mode .ds{color:var(--muted);font-size:12.5px}
.mode:disabled{opacity:.45;cursor:default}
.resume{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-block:16px 4px;font-size:14px}
.resume button{margin-top:9px}
.btn{appearance:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;
  background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;line-height:1.5}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--accent)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}

/* quiz */
#quiz{padding-block:22px 40px}
.qtext{font-size:16.5px;line-height:1.95;margin:0 0 6px;white-space:pre-wrap}
.multi{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  padding:3px 10px;border-radius:999px;margin:10px 0 0}
#choices{display:grid;gap:9px;padding-block:16px 4px}
.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;appearance:none;cursor:pointer;
  background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:13px 15px;
  font-family:var(--sans);font-size:15px;color:var(--fg);line-height:1.7}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .lab{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);flex:none;
  min-width:1.5em;padding-top:.25em}
.choice.sel{background:var(--accent-soft);border-color:var(--accent)}
.choice.sel .lab{color:var(--accent-ink)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--ok-soft);border-color:var(--ok-rule)}
.choice.correct .lab{color:var(--ok)}
.choice.wrong{background:var(--ng-soft);border-color:var(--ng-rule)}
.choice.wrong .lab{color:var(--ng)}

.expl{margin-top:18px;border-top:1px solid var(--rule);padding-top:18px}
.verdict{display:inline-block;font-size:13px;font-weight:700;padding:4px 14px;border-radius:999px;margin-bottom:14px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng)}
.expl h4{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.row{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;margin-bottom:7px;
  font-size:14px;line-height:1.85;background:var(--card);border:1px solid var(--rule)}
.row .lab{font-family:var(--mono);font-size:12px;font-weight:700;flex:none;min-width:1.5em;padding-top:.15em;color:var(--muted)}
.row.ok{background:var(--ok-soft);border-color:var(--ok-rule)}
.row.ok .lab{color:var(--ok)}

.note{margin-top:18px;background:var(--note-soft);border:1px solid var(--note-rule);border-radius:11px;padding:14px 16px}
.note .lab{display:block;font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--note);margin-bottom:7px}
.note p{margin:0 0 11px;font-size:14.5px;line-height:1.9}
.note p:last-child{margin-bottom:0}

.nav{display:flex;gap:10px;padding-block:22px 0;align-items:center}
.nav .btn{flex:1}
#commitWrap{padding-top:14px}

/* result */
#result{padding-block:30px 44px;text-align:center}
.score{font-family:var(--serif);font-size:clamp(40px,14vw,64px);font-weight:700;line-height:1.1;margin:10px 0 2px;
  font-variant-numeric:tabular-nums}
.score.pass{color:var(--ok)} .score.fail{color:var(--ng)}
.scorelab{font-size:13px;color:var(--muted);margin:0 0 6px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 18px;border-radius:999px;margin-bottom:22px}
.badge.pass{background:var(--ok-soft);color:var(--ok)} .badge.fail{background:var(--ng-soft);color:var(--ng)}
.rbtns{display:grid;gap:10px;max-width:380px;margin:0 auto}

code{font-family:var(--mono);font-size:.87em;background:var(--accent-soft);color:var(--accent-ink);padding:2px 5px;
  border-radius:4px;word-break:break-word}
footer{border-top:1px solid var(--rule);margin-top:26px;padding-block:24px 40px;color:var(--muted);font-size:12.5px;line-height:1.8}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="bar" hidden><div class="wrap in">
  <span id="qnum"></span><span id="qmode"></span><span id="barsp"></span>
  <button class="bbtn" id="quitBtn">中断</button>
</div><div id="progBar"></div></div>

<div id="home" class="wrap">
  <header class="top">
    <p class="eyebrow">SALESFORCE 認定 PLATFORM DATA アーキテクト</p>
    <h1>過去問100問</h1>
    <p class="sub">解答すると、選択肢ごとの解説に続けて<b>補足</b>が出ます。補足は元の解説とは別に付けたもので、<b>解答が疑わしい問題・古くなっている機能名・紛らわしい組み合わせの分かれ目</b>を書いています。</p>
    <p class="sub"><b>選択肢は毎回並べ替わります。</b>位置で覚えないためです。解説の中で他の選択肢に触れるときは記号ではなく内容で書いてあります。</p>
  </header>

  <div class="resume" id="resumeBox" hidden>
    <div id="resumeTxt"></div>
    <button class="btn" id="resumeBtn">続きから</button>
  </div>

  <div class="modes">
    <button class="mode" id="m1"><span class="nm">模試1</span><span class="ds">Q1〜Q50</span></button>
    <button class="mode" id="m2"><span class="nm">模試2</span><span class="ds">Q51〜Q100</span></button>
    <button class="mode" id="mall"><span class="nm">全100問</span><span class="ds">通しで解く</span></button>
    <button class="mode" id="mr20"><span class="nm">ランダム20問</span><span class="ds">すき間時間に</span></button>
    <button class="mode" id="homeReview"><span class="nm">復習</span><span class="ds"></span></button>
  </div>

  <footer>
    <p>解答の途中経過と間違いの記録は、この端末のブラウザにだけ保存されます。別の端末には引き継がれません。</p>
    <p><button class="bbtn" id="resetBtn">記録を消す</button></p>
  </footer>
</div>

<div id="quiz" class="wrap" hidden>
  <p class="qtext" id="qtext"></p>
  <div id="multiTag"></div>
  <div id="choices"></div>
  <div id="commitWrap"></div>
  <div id="expl"></div>
  <div class="nav">
    <button class="btn ghost" id="prevBtn">前へ</button>
    <button class="btn" id="nextBtn">次へ</button>
  </div>
</div>

<div id="result" class="wrap" hidden>
  <p class="scorelab">得点</p>
  <div class="score" id="scoreVal"></div>
  <p class="scorelab" id="scoreLab"></p>
  <div><span class="badge" id="badge"></span></div>
  <div class="rbtns">
    <button class="btn" id="reviewBtn"></button>
    <button class="btn ghost" id="homeBtn">最初の画面へ</button>
  </div>
</div>

<script>
var ALL_QUESTIONS = [{"n": 1, "t": "UCは、Heroku Postgresデータベースと顧客データおよび注文データを共有するB2C eコマースサイトをHeroku上に構築する必要があります。UCは現在、顧客と注文の両方の信頼できる唯一の情報源としてPostgresを利用しています。UCはデータアーキテクトに、Salesforceが記録システムとして機能できるように、データをSalesforceに複製するよう依頼しました。この要件を実装する前に、データアーキテクトが検討すべき3つの考慮事項は何ですか？3つ選択してください。", "c": ["データが営業レポート、ダッシュボード、KPIに必要かどうかを検討する。", "データがSalesforce内に実装された主要プロセスの推進要因であるかどうかを判断する。", "注文データとエンタープライズリソースプランニング(ERP)アプリケーションの間に緊密な関係があることを確認する。", "データがCRM中心であり、標準オブジェクトまたはカスタムオブジェクトにデータを入力できることを確認する。", "データを複製するために必要なツールを選択する。", "Heroku Connectが必要だが、これは混乱を招く。"], "a": [1, 2, 4], "e": ["データをSalesforceに複製する一般的な理由の1つとしてレポートやダッシュボードでの利用がありますが、今回は他の選択肢が優先されるべきシステム全体の考慮事項とされています。", "正解です。Salesforceを記録システムとして機能させるには、そのデータがSalesforce内の自動化やビジネスプロセスのトリガーとして必要不可欠であるかを事前に確認することが、アーキテクチャ設計上の重要な考慮事項となります。", "正解です。注文データをSalesforceに取り込む際、バックオフィスシステムであるERPとの連携やデータの一貫性を保つための関係性を、システム全体のデータフローの中で考慮する必要があります。", "データの特性を理解してSalesforceのデータモデルにマッピング可能か確認することは重要ですが、今回は正解に含まれていません。", "正解です。Heroku PostgresからSalesforceへデータを複製するためには、要件を満たすためにどのデータ統合ツールや複製ツールを使用するべきかを適切に選択および評価することが不可欠なステップです。", "Heroku ConnectはPostgresとSalesforceを同期する標準的なツールの1つですが、要件の検討前に特定のツールのみが必要であると断定することは、アーキテクチャの評価プロセスとして適切ではありません。"], "note": "この問題は出題が壊れている。最後の選択肢「Heroku Connectが必要だが、これは混乱を招く」は選択肢の体をなしておらず、原文からの移植に失敗している。さらに「CRM中心のデータか、標準／カスタムオブジェクトに載るか」は、Salesforceを記録システムにする際に一般に挙げられる考慮事項そのものなのに不正解扱いになっている。正誤を暗記しないこと。拾うべきは「複製の前に、そのデータがSalesforce内の処理を動かすのか、どのツールで複製するのかを決める」という考え方まで。"}, {"n": 2, "t": "アーキテクトは、過去4か月間に特定の項目を作成、変更、または削除したユーザーに関する情報を必要としています。アーキテクトはどのようにしてこの情報にアクセスできますか？", "c": ["該当する項目の項目履歴レポートを作成する。", "設定変更履歴をエクスポートした後、該当する項目を見つける。", "メタデータをエクスポートした後、該当する項目を検索する。", "他のすべてのユーザーから「アプリケーションのカスタマイズ」権限を削除する。"], "a": [1], "e": ["項目履歴レポートはレコードの項目の値が変更された履歴を追跡するためのものであり、項目自体の作成、変更、または削除といったメタデータの変更を追跡するものではありません。", "正解です。設定変更履歴は、組織の設定やメタデータの変更履歴を追跡する機能です。過去6か月分の履歴をCSVファイルとしてエクスポートできるため、過去4か月間に誰が項目を作成、変更、または削除したかを確認するのに最適な方法です。", "メタデータをエクスポートすると現在の項目の設定状態は確認できますが、過去に誰がいつ変更したかという履歴情報は含まれていないため、要件を満たしません。", "このアクションは今後他のユーザーが設定を変更できないようにするための予防策であり、過去4か月に誰が項目を変更したかという過去の情報を特定する方法ではありません。"], "note": "「項目履歴管理」と「設定変更履歴」の違いが問われている。項目履歴管理＝レコードの中の値が変わった履歴。設定変更履歴＝項目や設定そのものを誰がいじったかの履歴。問題文が「項目を作成・変更・削除した」と言っているので後者。設定変更履歴の保持は6か月なので、4か月前なら間に合う。期間が6か月を超えていたら、この答えは使えない。"}, {"n": 3, "t": "Universal Containers (UC) は、世界中の出荷を追跡するのに役立つカスタムアプリケーションをSalesforce上に構築しました。出荷レコードの大部分は、オンプレミスの外部データソースに保存されています。UCは出荷の詳細をカスタムアプリケーションに公開する必要があり、データにはリアルタイムでアクセスできる必要があります。外部データソースはODataに対応しておらず、UCはミドルウェアツールを所有していません。UCの要件を満たすために、データアーキテクトはどのSalesforce Connectの手順を使用するべきでしょうか？", "c": ["外部APIへのRESTコールアウトを行うApexクラスを記述する。", "呼び出し可能なWebサービスメソッドを呼び出すプロセスを開発する。", "データをHerokuに移行し、Postgresをデータソースとして登録する。", "Apexコネクタフレームワークを使用してカスタムアダプタを記述する。"], "a": [3], "e": ["設問ではSalesforce Connectの手順について尋ねています。ApexでのRESTコールアウトはデータを取得する手段の1つですが、Salesforce Connectの機能を使用するものではなく、外部オブジェクトとしてシームレスに統合できるわけではないため要件を満たしません。", "これもSalesforce Connectを使用するアプローチではありません。プロセスやフローから外部サービスを呼び出す手段ですが、外部システムからのデータをリアルタイムでSalesforceアプリケーション内に統合・公開するという要件には適していません。", "データを別のデータベースに移行することは、オンプレミスの既存データソースを直接リアルタイムで参照するという要件から逸脱します。また、大規模なデータ移行が必要になるため、現在の環境と制約の中での最適な解決策ではありません。", "正解です。外部データソースがODataをサポートしておらず、ミドルウェアも利用できない場合、Apexコネクタフレームワークを使用してカスタムアダプタを作成することで、Salesforce Connectを介して外部システムとリアルタイムに連携し、データを外部オブジェクトとして公開することができます。"], "note": "外部データの問題群の中で、この問題だけ条件が2つ重なっている。「ODataに対応していない」＋「ミドルウェアがない」。この2つが揃ったらApexコネクタフレームワーク、と覚えてよい。相手がODataに対応していれば設定だけで済み、ミドルウェアがあればそちらで変換できる。どちらも無いから自分で書く、という順番で考える。"}, {"n": 4, "t": "UCは個人顧客(B2C)データをレガシーシステムからSalesforce(SF)に移行しています。レガシーデータベースには、数百万の顧客が取引先および取引先責任者として保存されています。データアーキテクトはSalesforce内でどのオブジェクトモデルを構成するべきですか？", "c": ["Salesforceで個人取引先オブジェクトを活用する", "Salesforceでカスタムの個人取引先オブジェクトを活用する", "Salesforceでカスタムの取引先および取引先責任者オブジェクトを活用する", "Salesforceで標準の取引先および取引先責任者オブジェクトを活用する"], "a": [0], "e": ["正解です。B2C(企業対消費者)のビジネスモデルでは、顧客は個人です。Salesforceの個人取引先(Person Account)機能は、標準の取引先と取引先責任者の項目を1つのレコードに結合して表示するため、B2Cデータの管理に最適に設計されています。したがって、個人顧客のデータを移行する際のベストプラクティスとなります。", "個人取引先はSalesforceにすでに用意されている標準機能(有効化して使用)であるため、カスタムオブジェクトとして新たに構築する必要はありません。カスタムで作成すると、標準機能が持つ多くの利点や他機能との連携を失うことになります。", "Salesforceには取引先と取引先責任者という強力な標準オブジェクトがすでに存在するため、これらをカスタムオブジェクトで代用することはベストプラクティスに反します。標準のCRM機能を活用できなくなります。", "標準の取引先と取引先責任者を分けて使用するモデルは、主にB2B(企業対企業)のビジネスモデルに適しています。今回の要件である個人顧客(B2C)を管理する場合、個人取引先を使用する方がはるかに効率的で適切です。"], "note": "試験では「B2C／個人顧客」と書いてあれば個人取引先、で機械的に取れる。ただし実務で効く注意が2つある。①個人取引先は一度有効にすると戻せない。②1件の個人取引先は内部的に取引先と取引先責任者の2レコードを消費するので、数百万件なら件数の見積もりが倍になる。ストレージの計算を問う問題と組み合わさったときに効く。"}, {"n": 5, "t": "Universal Containers (UC) は、アメリカ合衆国でのビジネスを表す数百万件の取引先レコードのコレクションを維持しています。物流会社として、このリストはUCのビジネスにおいて最も価値があり重要なコンポーネントの一つであり、配送先住所の正確性が最も重要です。最近、これらの企業の住所が不正確である、または企業が存在しないケースが多すぎることが指摘されています。取引先の住所の質を向上させるために、UCはどの2つのスケーラブルな戦略を検討するべきでしょうか？", "c": ["リスト上の各企業に連絡し、住所情報を確認して更新するように依頼する。", "ウェブで検索したり電話をかけたりして取引先を検証する従業員のチームを構築する。", "住所の検証と強化のために、サードパーティのデータベースまたはサービスと統合する。", "Data.com Cleanを活用して、D&Bデータベースで取引先の住所項目をクリーンアップする。"], "a": [2, 3], "e": ["数百万件の取引先レコードに対して一件ずつ連絡を取ることは、非常に時間がかかり人的リソースも大量に消費するため、現実的ではなくスケーラブルなアプローチとは言えません。", "これも手作業によるデータ検証であり、数百万件のレコードに対して行うにはコストと時間がかかりすぎるため、スケーラブルな解決策ではありません。", "正解です。外部の信頼できる住所検証APIやデータプロバイダーとシステムを連携させることで、大量のデータを自動的かつ継続的に検証・更新することが可能になり、非常にスケーラブルな方法となります。", "正解です。Data.com Cleanのようなツール（現在はサードパーティのAppExchange製品やLightning Dataパッケージなどで提供されています）を使用して、Dun & Bradstreet (D&B) などの外部データベースと照合することで、大規模な取引先データの住所を効率的にクリーンアップできます。"], "note": "Data.com Clean は提供終了している。この問題は現行のSalesforceでは成立しない。拾うべきは「数百万件に手作業は選ばない。外部のデータサービスと連携する」という考え方だけ。同じことが後の問題にも出てくる。選択肢に手作業（電話する・担当者に直させる・インターンを雇う）が並んでいたら、それらは全部不正解と考えてよい。"}, {"n": 6, "t": "アーキテクトは、Universal ContainersのレガシーCRMシステムからSalesforceへの大規模なデータ移行を計画しています。データ移行のパフォーマンスを最適化するために、アーキテクトが考慮すべき3つのことは何ですか？3つ選択してください。", "c": ["データをロードするユーザーのタイムゾーンを確認する。", "ロードされるデータのカスタムインデックスを削除する。", "レガシーシステムがまだ使用されているかどうかを判断する。", "Salesforce組織の共有の計算を延期する。", "承認プロセスとワークフロールールを無効化する。"], "a": [1, 3, 4], "e": ["タイムゾーンは日付や時間項目の正確なインポートには重要ですが、データ移行の処理パフォーマンスや速度の最適化には直接影響しません。", "正解です。データのロード時にインデックスが有効な場合、レコードが挿入されるたびにインデックスの更新処理が発生し、ロード速度が低下します。移行前に不要なカスタムインデックスを削除し、ロード完了後に再作成することで、パフォーマンスを最適化できます。", "レガシーシステムの稼働状況の確認は、プロジェクト管理やデータ移行計画のタイミングを決定する上では重要ですが、Salesforceへのデータロード時のシステムパフォーマンス自体を向上させる技術的な手段ではありません。", "正解です。大量のレコードを挿入すると、その都度共有ルールの再計算が発生し、システムリソースを大量に消費して処理が遅延します。共有の計算を延期（一時停止）し、すべてのデータロードが完了した後に一括して再計算を行うことで、ロード時間を大幅に短縮できます。", "正解です。レコードの挿入時にワークフロールールや承認プロセス（および入力規則やApexトリガーなど）が実行されると、処理のオーバーヘッドが大幅に増加します。データ移行中はこれらを一時的に無効化することが、データロードのパフォーマンスを最大化するための標準的なベストプラクティスです。"], "note": "ワークフロールールは現在は新規作成できず、レコードトリガーフローに置き換わっている。ただし「移行中は自動処理を止める」という判断そのものは変わらない。大量ロードの前に止めるものは、トリガー・入力規則・フロー（旧ワークフロー）・承認プロセス・共有計算・不要なインデックス、と並べて覚える。"}, {"n": 7, "t": "Cloud Kicksは現在、会社の取引先責任者に対して公開/更新の共有モデルを使用しています。Cloud Kicksの管理チームは、取引先責任者レコードの所有者のみがその取引先責任者を削除できるように要求しています。この要件を満たすために、アーキテクトは何をすべきでしょうか？", "c": ["取引先責任者オブジェクトから削除権限を削除するようにユーザーのプロファイルを設定する。", "「before delete」トリガーを作成して、現在のユーザーが所有者ではないかどうかを確認する。", "取引先責任者オブジェクトの共有設定を公開/参照のみに設定する。", "取引先責任者オブジェクトに入力規則を作成して、現在のユーザーが所有者ではないかどうかを確認する。"], "a": [1], "e": ["プロファイルから取引先責任者の削除権限を外してしまうと、他のユーザーだけでなく、レコードの所有者自身も削除ができなくなってしまいます。そのため、この方法では要件を満たすことができません。", "正解です。Salesforceの標準機能（プロファイルや共有設定）だけでは、他のユーザーに編集権限を与えたまま削除権限のみを所有者に限定するという細かい制御を行うことが困難です。Apexのbefore deleteトリガーを使用すれば、削除アクションが発生する前に現在のユーザーがレコードの所有者であるかを判定し、所有者でなければエラーを出して削除をブロックすることができます。", "共有設定を公開/参照のみに変更すると、所有者以外のユーザーはレコードの削除だけでなく、編集（更新）もできなくなります。現在の共有モデルである公開/更新による編集権限を維持できないため、不適切な対応となります。", "Salesforceの入力規則は、レコードが作成または更新されて保存される際にデータの整合性をチェックするための機能です。レコードの削除時には入力規則は評価されないため、削除を制限する目的には使用できません。"], "note": "覚えるべき事実は1つ。入力規則は削除時に評価されない。これを知っていれば一発で選択肢が1つ消える。もう1つ、Salesforceの標準の権限モデルには「編集はできるが削除はできない」という段階がない（参照のみ／参照・更新しかない）。だから削除だけを止めたいならコードになる。"}, {"n": 8, "t": "住宅とビジネスの両方にインターネットサービスを提供する大規模な電気通信プロバイダーには、次の属性があります。\n・自宅用にサービスを購入する顧客は、Salesforceで取引先として作成されます。\n・同じ家の住所にいる個人は、Salesforceで取引先責任者として作成されます。\n・ビジネスはSalesforceで取引先として作成されます。\n・一部の顧客は、自宅とビジネスの両方でサービスを利用しています。\n複数の顧客レコードを作成せずにこれらの顧客の単一ビューを実現するために、データアーキテクトは何を推奨するべきでしょうか？", "c": ["顧客を取引先責任者として作成し、取引先と取引先責任者のリレーションを使用してビジネス用および住宅用の取引先に関連付ける。", "顧客を個人取引先として作成し、取引先と取引先責任者のリレーションを使用してビジネス用および住宅用の取引先に関連付ける。", "顧客を個人オブジェクトとして作成し、ビジネス用および住宅用の取引先と関連付ける。", "顧客を住宅用取引先として作成し、親取引先を使用してビジネス用取引先に関連付ける。"], "a": [1], "e": ["自宅用にサービスを購入する顧客は「取引先」として作成するという前提条件があるため、顧客を取引先責任者としてのみ作成するとその要件を満たすことができません。", "正解です。個人取引先（Person Account）を使用すると、個人の顧客を取引先兼取引先責任者として1つのレコードで管理できます。さらに、取引先と取引先責任者のリレーション（Account Contact Relationship）機能を使用することで、その個人取引先をビジネス用の取引先にも紐付けることができるため、レコードを重複させることなく単一の顧客ビューを実現できます。", "個人（Individual）オブジェクトは、データプライバシー設定や同意管理（GDPR対応など）の目的で使用されるものであり、取引先や取引先責任者の代替として顧客のデータモデルを構築するために使用するものではありません。", "親取引先の機能は、通常、企業間の階層構造（親会社と子会社など）を表現するために使用されます。B2Cの顧客とB2Bの企業の関連付けや、同じ家に住む個人の管理といった要件には適していません。"], "note": "個人取引先と、もう1つの機能の組み合わせを問う問題。取引先と取引先責任者のリレーション（Account Contact Relationship）は、1人の取引先責任者を複数の取引先に紐付けられる標準機能で、この手の「個人が会社にも属している」要件で繰り返し出る。個人（Individual）オブジェクトは同意管理の器であって顧客モデルではない、という区別もあわせて覚える。"}, {"n": 9, "t": "Northern Trail Outfitters (NTO) は、営業ユーザー向けにSalesforceを導入しました。Salesforceでの商談管理は次のように実装されています。\n1. 営業ユーザーは、売上予測とレポート作成の目的で、商談をSalesforceに入力します。\n2. NTOには製品価格設定システム (PPS) があり、商談の金額項目を毎日更新するために使用されます。\n3. PPSは、NTO内での商談金額に関する信頼できる唯一の情報源です。\n4. NTOは、販売計画と管理に商談の売上予測を使用しています。\n営業ユーザーは、PPSが商談を更新すると、商談の金額項目に対する自分たちの更新が上書きされることに気づきました。データアーキテクトは、この上書きの問題にどのように対処するべきですか？", "c": ["PPSが更新する商談金額用のカスタム項目を作成し、営業ユーザーが更新する項目と分ける。", "金額項目がnullの場合にのみ更新するように、PPSの統合を変更する。", "項目レベルセキュリティで、営業ユーザーに対する商談の金額項目のアクセス権を参照のみに変更する。", "営業ユーザーが更新する商談金額用のカスタム項目を作成し、PPSが更新する項目と分ける。"], "a": [2], "e": ["PPSは商談金額に関する信頼できる唯一の情報源です。また、NTOは標準の売上予測機能を使用しているため、売上予測の計算には標準の金額項目を使用する必要があります。PPSの更新先をカスタム項目にしてしまうと、正確なデータが売上予測に反映されなくなります。", "PPSは毎日商談の金額項目を更新する信頼できる情報源です。値がnullの場合にのみ更新するように制限してしまうと、システム内の価格変更が正しく商談に反映されなくなり、ビジネス上の要件を満たすことができなくなります。", "正解です。PPSが商談金額の信頼できる唯一の情報源であるため、営業ユーザーが手動でこの項目を更新できないようにする必要があります。項目レベルセキュリティを使用して営業ユーザーのアクセス権を参照のみに設定することで、ユーザーによる不要な更新（およびそれに伴う上書きの混乱）を防ぎ、データの完全性を保つことができます。", "PPSが商談金額に関する信頼できる唯一の情報源であるため、そもそも営業ユーザーが独自の金額を入力・保持する必要はありません。不要なカスタム項目を作成することはデータモデルを複雑にし、ユーザーの混乱を招くだけでなく、売上予測の正確性にも寄与しません。"], "note": "この問題の鍵は「信頼できる唯一の情報源（システム・オブ・レコード）はどちらか」が問題文に明記されていること。明記されている側が正で、もう一方には触らせない。これは設計の問題で繰り返し出る型で、迷ったら「正本はどちらか」を問題文から探す。標準の売上予測を使うと書いてあるので、金額はカスタム項目に逃がせない、という2段目の縛りも効いている。"}, {"n": 10, "t": "Cloud Kicksはパートナーコミュニティを立ち上げており、ユーザーが登録した出荷リクエストをCloud Kicksの従業員が処理できるようにします。出荷リクエストにはヘッダー情報が含まれ、その後に出荷される最大5つのアイテムのリストが含まれます。最初に、Cloud Kicksは北米の6,000人の顧客にコミュニティを導入し、その後2年以内に世界中の24,000人の顧客に導入します。Cloud Kicksは、顧客1人あたり平均して週に12件の出荷リクエストを予想しており、顧客が最大3年分の出荷リクエストを表示し、Salesforceのレポートを使用できるようにしたいと考えています。Cloud Kicksのデータアーキテクトが要件に対処するために推奨するソリューションは何ですか？", "c": ["出荷リクエストを追跡する外部カスタムオブジェクトと、出荷アイテムを追跡する子外部オブジェクトを作成する。外部オブジェクトはプラットフォーム外のHerokuのPostgresデータベースに保存される。", "出荷される各アイテム用に5つの参照カスタム項目を持つ、出荷リクエストを追跡する外部カスタムオブジェクトを作成する。外部オブジェクトはプラットフォーム外のHerokuのPostgresデータベースに保存される。", "出荷リクエストを追跡するカスタムオブジェクトと、出荷アイテムを追跡する子カスタムオブジェクトを作成する。3年後にデータをプラットフォーム外に移動するアーカイブプロセスを実装する。", "出荷される各アイテム用に5つの参照カスタム項目を持つ、出荷リクエストを追跡するカスタムオブジェクトを作成する。3年後にデータをプラットフォーム外に移動するアーカイブプロセスを実装する。"], "a": [2], "e": ["外部オブジェクトはSalesforceの標準レポート機能において制限があり、コミュニティユーザーへのアクセスや高度なレポート要件を完全に満たすのが難しくなります。ネイティブなレポートを最大限に活用するにはカスタムオブジェクトが適しています。", "外部オブジェクトのレポート制限に加えて、1つのレコードに5つの参照項目を持たせる非正規化のデータモデルは、将来的にアイテム数の上限が変更された際の拡張性に欠け、ベストプラクティスではありません。", "正解です。出荷リクエスト（親）と出荷アイテム（子）をSalesforceのカスタムオブジェクトとして作成することで、正規化された拡張性の高いデータモデルとなります。これにより、要件であるSalesforceの標準レポート機能を完全にサポートできます。また、大量に発生するレコードに対して、3年経過後にプラットフォーム外へデータを移行するアーカイブプロセスを実装することで、大規模データによるパフォーマンスの低下を防ぐことができます。", "カスタムオブジェクトとアーカイブプロセスの組み合わせは正しいアプローチですが、1つのオブジェクトに5つの参照項目を持たせるフラットな設計は、データの正規化の観点から推奨されません。将来的なアイテム数の増減に対応できず、レポートでの集計も非常に複雑になります。"], "note": "自分で件数を出すと腹に落ちる。24,000人 × 12件/週 × 52週 × 3年 ＝ 約4,500万件（親の出荷リクエスト）。子の出荷アイテムは最大5倍。アーカイブが飾りではなく必須だと分かる。\n\n判断の順番は2段階。①「Salesforceのレポートを使いたい」と書いてあるので外部オブジェクトは選べない（外部オブジェクトは標準レポートに制限がある）。②残ったカスタムオブジェクト案のうち、アイテムを5つの項目に並べる案は正規化に反するので、親子に分ける。\n\nなお「コミュニティ」は現在 Experience Cloud に改称されている。"}, {"n": 11, "t": "Northern Trail Outfittersは、マーケティング目的での顧客の承認を記録するための同意フォームの構築を計画しています。この要件を満たすために、データアーキテクトは何を推奨するべきでしょうか？", "c": ["承認の詳細を記録するためにカスタム項目を使用する。", "承認を管理するためにカスタムオブジェクトを作成する。", "同意を記録するために Authorization Form Consent オブジェクトを利用する。", "要件に対処するために AppExchange ソリューションを使用する。"], "a": [2], "e": ["カスタム項目を使用して同意情報を管理することは可能ですが、コンプライアンス要件に対応するための同意履歴の追跡やバージョン管理が複雑になるため、推奨されるアーキテクチャではありません。", "カスタムオブジェクトを作成して同意を管理することも技術的には可能ですが、Salesforceには同意管理に特化した標準機能がすでに用意されているため、開発やメンテナンスの負荷が増えるカスタム構築は避けるべきです。", "正解です。Salesforceにはデータプライバシーと同意管理をサポートするための標準オブジェクト群(同意データモデル)が用意されています。Authorization Form Consent オブジェクトなどを活用することで、標準機能を最大限に生かしてコンプライアンス要件に準拠し、顧客の同意を安全かつ適切に追跡できます。", "AppExchangeのサードパーティ製ソリューションを利用することも選択肢の一つですが、Salesforceの標準の同意管理機能で要件を満たすことができるため、追加のコストや導入の手間がかかる外部ソリューションを最初から推奨する必要はありません。"], "note": "同意管理の標準オブジェクト群は名前を知っているかどうかだけの問題。Authorization Form（同意フォームの定義）、Authorization Form Consent（本人がどのフォームに同意したか）、Individual（プライバシー設定の持ち主）の3つが中心。GDPRや同意という語が出たらこの一式を思い出す。前問の Individual オブジェクトとセットで覚えると区別がつく。"}, {"n": 12, "t": "UCは、レガシーERPアプリケーションからSalesforceプラットフォームに1億件の注文レコードを移行する要件があります。UCは、移行されたデータのレポートに関する要件を持っていません。プラットフォームのパフォーマンス低下を軽減するために、データアーキテクトは何を推奨するべきですか？", "c": ["データを保存するためのカスタムオブジェクトを作成する。", "Salesforceによって定義された標準Big Objectを使用する。", "データを保存するために標準の注文オブジェクトを使用する。", "データを保存するためのカスタムBig Objectを実装する。"], "a": [3], "e": ["1億件という膨大なレコードを通常のカスタムオブジェクトに保存すると、Salesforceのデータストレージ制限を大幅に超過する可能性が高く、プラットフォーム全体のパフォーマンスにも悪影響を及ぼすため、推奨されません。", "FieldHistoryArchiveなどの特定の目的を持った標準Big Objectは存在しますが、外部システムから移行した独自の注文データを保存するための汎用的な標準Big Objectはありません。この要件を満たすにはカスタムで作成する必要があります。", "標準の注文オブジェクトは通常のデータストレージを使用するため、1億件ものレコードを保存するとストレージの枯渇やパフォーマンスの低下を引き起こします。レポート要件がない大量のデータ保存には適していません。", "正解です。カスタムBig Objectは、数億から数十億のレコードを保存し、プラットフォームのパフォーマンスを低下させることなく大規模なデータを管理できるように設計されています。レポート要件がなく、大量の履歴データやアーカイブデータを保存する必要がある今回のケースにおいて、最適なソリューションです。"], "note": "Big Object を選んでよいのは「レポート要件がない」と問題文に書いてあるときだけ。Big Object は標準のレポートが使えず、SOQL と Async SOQL で限定的に読むだけだから。逆に「レポートを使いたい」と書いてある問題（出荷リクエストの問題など）では、通常のオブジェクト＋アーカイブ処理になる。この一文を探すのが解き方。\n\nもう1つ、標準 Big Object（FieldHistoryArchive）とカスタム Big Object の区別も問われている。自分のデータを入れるならカスタム。"}, {"n": 13, "t": "Universal Containers (UC) は、Salesforceに商品データを保存したいと考えていますが、標準の商品オブジェクトは、現在商品マスターシステムで使用されているより複雑な階層構造をサポートしていません。ソースシステムからSalesforceに商品データを同期するために、階層データ構造をサポートするようにUCは標準の商品オブジェクトモデルをどのように変更できますか？", "c": ["階層内の子レコードを参照するために、標準の商品オブジェクトにカスタム参照項目を作成する。", "階層内の親レコードを参照するために、標準の商品オブジェクトにカスタム参照項目を作成する。", "階層内の子レコードを参照するために、標準の商品オブジェクトにカスタム主従関係項目を作成する。", "商品オブジェクトの商品ファミリ標準選択リスト項目を同期するためのApexトリガを作成する。"], "a": [1], "e": ["子レコードを参照する項目を作成した場合、1つのレコードに対して1つの子レコードしか関連付けることができず、一般的なツリー状の階層構造（1対多のリレーション）を構築することができません。", "正解です。自分自身のオブジェクト（この場合は商品オブジェクト）の親レコードを指定するカスタム参照項目（自己参照リレーション）を作成することで、Salesforce内で標準的な階層構造（1つの親に対して複数の子が紐づく構造）を表現し、複雑な階層データをサポートすることができます。", "Salesforceでは、同じオブジェクト同士で主従関係（自己参照の主従関係）を作成することはシステム仕様上許可されていません。また、標準オブジェクトを主従関係の従側に設定することもできません。", "商品ファミリは商品をカテゴリ分けするための選択リスト項目であり、レコード同士を関連付けて複雑な階層データ構造を構築するための機能ではありません。"], "note": "階層を作るときは必ず「子が親を指す」。逆向きにすると1件しか指せない。これはSalesforceに限らずデータベース全般の話で、理屈で覚えられるので暗記しなくてよい。あわせて、自己参照の主従関係は作れない（参照関係のみ）、標準オブジェクトは主従の従側になれない、という2つの制約も問われている。"}, {"n": 14, "t": "大手保険プロバイダーがSalesforceの導入を検討しています。現在、以下の状況が存在します。\n1. リード獲得のための複数のチャネル\n2. チャネルをまたいだリードの重複\n3. 顧客体験の低下とコストの増加\n分析の結果、重複リードが存在し問題を引き起こしていることがわかりました。問題を軽減するために何を推奨するべきでしょうか？", "c": ["重複を手動で検索してマージするプロセスを構築する。", "すべてのチャネルでリード情報を標準化する。", "重複リードを特定してマージするカスタムソリューションを構築する。", "リードデータをクレンジングおよび強化するためのサードパーティソリューションを導入する。", "重複リードを防ぐための重複排除戦略を導入する。"], "a": [1, 3, 4], "e": ["大量のリードデータに対して手動で検索およびマージを行うことは非常に時間がかかり非効率的です。また、人為的エラーが発生しやすいため、大企業向けの解決策としては適していません。", "正解です。データの標準化はデータ品質を向上させるための重要な基礎となります。入力フォーマットを統一することで、システムが異なるチャネルから入ってくるリードの重複をより正確に特定できるようになります。", "カスタムコードや独自のソリューションを開発することは、将来のメンテナンスの負担と技術的負債を増加させます。Salesforceの標準機能や専用のサードパーティツールを活用する方がベストプラクティスです。", "正解です。AppExchangeなどで提供される実績のあるデータクレンジングツールを利用することで、既存のデータの重複や汚れを効率的に解決し、正確なリード情報を維持することができます。", "正解です。重複ルールや一致ルールなどの重複排除戦略をシステム設計に組み込むことで、システム入力時に新たな重複データが混入することを継続的に防ぐことができます。"], "note": "重複の問題は、この問題集に何問も出てくる。共通する消去法は2つ。「手作業でやる」案と「自分でコードを書く」案は、ほぼ常に不正解。残ったものが答えになる。\n\n選ばれた3つは、時間軸で並べると理解しやすい。入ってくる前に形を揃える（標準化）→ 入るときに止める（重複ルール）→ すでに汚れているものを洗う（外部のクレンジングツール）。"}, {"n": 15, "t": "Northern Trail Outfittersは、エージェントの関係性をルックアップテーブルで識別するレガシーCRMシステムからSalesforceに移行しています。データをSalesforceに移行するために、データアーキテクトは何をするべきですか？", "c": ["エージェントの関係性を保存するためのカスタムオブジェクトを作成する。", "レコード所有者なしでSalesforceに移行する。", "関係性に基づいてレコード所有者を割り当てる。", "データを移行し、非個人のシステムユーザーに割り当てる。"], "a": [0], "e": ["正解です。レガシーシステムのルックアップテーブルによって管理されている複雑な関係性（多対多の関係など）をSalesforceで再現するには、関係性を保持するための専用のカスタムオブジェクト（連結オブジェクトなど）を作成する必要があります。これにより、移行先でも元のデータ構造を正確に維持できます。", "Salesforceのほとんどの標準オブジェクトやカスタムオブジェクトにおいて、レコードには所有者（Owner）の割り当てが必須です。所有者なしでデータを移行することはシステム上できないため、不適切な選択肢です。", "レコードの所有者を特定のユーザーに設定することと、エージェント同士の複雑な関係性のデータをシステム上で管理・保持することは異なります。所有者を割り当てるだけでは、ルックアップテーブルにあった関係性データを表現できません。", "統合ユーザーなどのシステムユーザーに所有権を割り当てることは一般的なデータ移行の手法ですが、これもルックアップテーブルに保存されていた「関係性」のデータ自体をどこに格納するかという課題の解決にはなっていません。"], "note": "「多対多の関係をどう表すか」が問われたら、答えは連結オブジェクト（junction object）。2つの主従関係を持つカスタムオブジェクトを間に挟む形で、Salesforceで多対多を作る唯一の標準的な方法。\n\nこの問題は、所有者の話に見える選択肢を3つ並べて混乱させているが、問われているのは関係性データの置き場所である。"}, {"n": 16, "t": "一般データ保護規則(GDPR)の要件に対応する一環として、UCはSalesforceを含む顧客情報を保存するすべての内部システムに対してデータ分類ポリシーを実装することを計画しています。データアーキテクトは、UCが標準オブジェクトとカスタムオブジェクトの両方でSalesforceに保持されている消費者情報を簡単に分類できるようにするために、何を推奨するべきでしょうか？", "c": ["ポリシーに基づいて項目を分類するためにAppExchange製品を使用する。", "項目の定義で利用可能なデータ分類メタデータ項目を使用する。", "顧客に関する情報の分類を記録するためのカスタム選択リスト項目を作成する。", "顧客情報のレポートを作成して検証する。"], "a": [1], "e": ["AppExchange製品を使用することも可能ですが、Salesforceには標準で項目レベルのデータ分類機能が組み込まれているため、これを解決するための最も推奨されるネイティブなアプローチではありません。", "正解です。Salesforceには、各項目(標準およびカスタム)の定義設定において、「データ所有者」「データの機密性レベル」「コンプライアンスの分類」などをメタデータとして記録できるデータ分類機能が標準で用意されています。これを使用することで、追加の開発を行わずにGDPRなどの要件に合わせて容易に情報を分類できます。", "データ分類は個々のレコードに対して行うのではなく、メタデータ(項目そのものの定義)レベルで行うべきものです。そのため、レコードに値を持たせるカスタム選択リスト項目の作成は適切な設計ではありません。", "レポートの作成と検証は既存のデータを抽出または確認するための機能であり、システム全体のメタデータに対してデータ分類ポリシーを適用および管理するためのアプローチとしては不適切です。"], "note": "ここが最大の分かれ目——データ分類は「レコード」ではなく「項目の定義」に付ける。つまりメタデータであって、データではない。カスタム選択リストを作る案が不正解なのはこのため。\n\n項目に付けられるのは、データ所有者／項目の使用状況／データの機密性レベル／コンプライアンスの分類。この4つは名前のまま選択肢に出る。なお、分類はラベルを貼るだけで、アクセス制御はしない。"}, {"n": 17, "t": "Universal Containers (UC) は、営業チームの大規模な組織再編を行おうとしています。これにより、多数のグループメンバーと共有ルールの変更が必要になります。UCの管理者は、プロセス中の長い処理時間と失敗を懸念しています。変更を効率的に行うために、データアーキテクトは何を実施するべきでしょうか？", "c": ["共有ルールの変更を行うために、Salesforceにケースを登録する。", "共有ルールの変更を行う前に、共有の計算の延期を有効にする。", "古い共有ルールを削除し、新しい共有ルールを構築する。", "すべてのユーザーをログアウトさせ、共有ルールに変更を加える。"], "a": [1], "e": ["Salesforceサポートにケースを登録しても、システム側の共有ルールの処理時間が短縮されるわけではありません。また、共有ルールの変更自体は管理者が標準機能を使用して行うべき作業です。", "正解です。組織再編などでグループメンバーや共有ルールを大量に変更する場合、「共有の計算の延期」機能を有効にすることで、変更のたびに発生する自動的な再計算を一時停止できます。すべての変更が完了した後に一括で再計算を行うことで、処理時間を大幅に短縮し、エラーやタイムアウトによる失敗を防ぐことができます。", "共有ルールの削除や作成を行うたびに共有の再計算が発生するため、計算の延期機能を利用せずにこの作業を行うと、非常に長い処理時間がかかり、問題の解決にはなりません。", "ユーザーをログアウトさせることでレコードのロックなどの一部の競合は防げるかもしれませんが、共有ルールの再計算に伴う長い処理時間やシステムリソースの消費という根本的な懸念事項の解決にはなりません。"], "note": "共有計算の延期が答えになる問題は2種類ある。①この問題のように、共有ルールやグループを大量に変更するとき。②大量データをロードするとき。どちらも原因は「誰が何を見られるかの作り直し」が毎回走ること。\n\n重要なのは、これはロック競合とは別物だということ。ロック競合は親レコードの取り合いで、対策は直列モードか親IDでのソート。共有の再計算は延期で止める。症状が似て見えても原因が違う。"}, {"n": 18, "t": "North Trail Outfitters (NTO) は、ビジネスの大部分を中央のSalesforce組織から運営しています。また、NTOは、サービス、財務、およびマーケティングチームが業務を行う複数のセカンダリ組織も所有しています。現在、中央組織とセカンダリ組織の間に統合がないため、データの可視性の問題が発生しています。今後、NTOは、中央組織をハブとし、セカンダリ組織をスポークとするハブ＆スポークモデルがデータを管理するための適切なアーキテクチャであると特定しました。データアーキテクトは、ハブ組織とスポーク組織の間でデータをオーケストレーションするためにどのツールを使用するべきですか？", "c": ["ハブとスポークの両方でデータを抽出および配信するミドルウェアソリューション。", "変更データについてハブ組織をポーリングし、スポーク組織にプッシュするカスタムAPIを開発する。", "変更データについてスポークをポーリングし、組織にプッシュするカスタムAPIを開発する。", "組織間でデータを抽出および復元するバックアップおよびアーカイブソリューション。"], "a": [0], "e": ["正解です。複数のSalesforce組織（ハブおよびスポーク）間でデータを連携し、データの流れや複雑なオーケストレーションをスケーラブルに一元管理するためには、ETLツールやESBなどのミドルウェアソリューションを使用するのが標準的なベストプラクティスです。", "カスタムAPIの開発と継続的なポーリングは、開発および保守の負担が大きくなります。また、大量のAPIコールを消費し、ガバナ制限に達するリスクがあるため、エンタープライズ規模のハブ＆スポーク統合のアプローチとしては推奨されません。", "ハブ側をポーリングするもう一方の案と同様に、ポーリングベースのカスタムAPIソリューションは、アーキテクチャを不必要に複雑にし、パフォーマンスやAPI制限の観点から非効率であるため、データオーケストレーションの最適な選択肢ではありません。", "バックアップおよびアーカイブソリューションは、障害復旧（ディザスタリカバリ）やコンプライアンスのためのデータ保護を目的としたものです。組織間で業務データをリアルタイムまたは定期的に統合し、オーケストレーションするためのツールではありません。"], "note": "「複数のシステムをつなぐ」「オーケストレーション」と書いてあったらミドルウェア、と機械的に取れる。カスタムAPIを自作する案が2つ並んでいるのは、どちらを選んでも不正解にするための配置で、こういう並び方自体が「どちらも違う」という合図になっている。\n\nポーリング（定期的に『変わった？』と聞きに行く）が不利な理由も覚えておくとよい。API消費が増え、変更がない時も走る。Salesforce側から知らせる変更データキャプチャが現代的な代替手段。"}, {"n": 19, "t": "Get Cloudy Consultingは、Salesforce内の取引先責任者情報の完全性と一貫性を評価する必要があります。同社の営業担当者は、取引先と取引先責任者に関する不完全な情報を持っていることがよくあります。さらに、彼らは一貫した方法で情報を解釈することができません。Get Cloudy Consultingは、営業担当者にとって重要な特定の「主要な」項目を特定しました。データの完全性と一貫性を確認するために、Get Cloudy Consultingが実行できる2つのアクションはどれですか？（2つ選択してください。）", "c": ["主要な項目が最後に更新された日時を示すレポートを実行する。", "主要な項目ごとにその項目でグループ化されたレポートを実行し、データのばらつきを理解する。", "重要な項目の空白の割合を示すレポートを実行する。", "空白の項目にデフォルト値を入力できるプロセスを実行する。"], "a": [0, 2], "e": ["正解です。主要な項目がいつ更新されたかを示すレポートを作成することで、データが定期的にメンテナンスされているか、放置されて古い状態になっているかを把握でき、データの鮮度や一貫性を評価するのに役立ちます。", "この方法は入力されている値のばらつきを確認するのには役立ちますが、システム全体の「完全性（どれだけデータが埋まっているか）」を評価するための第一歩としては、空白の割合や更新履歴を確認するアプローチの方がより直接的です。", "正解です。重要な項目がどの程度未入力のままになっているか（空白の割合）を確認することは、データの「完全性」を評価する上で最も直接的かつ効果的な確認方法です。", "プロセスによるデフォルト値の自動入力はデータの欠損を埋めるための具体的な解決策であり、現在のデータがどれだけ完全で一貫しているかを「評価・確認する」という問題の目的には合致しません。"], "note": "この問題は解答に疑問が残る。設問は「完全性と一貫性」の両方を評価せよと言っており、項目でグループ化してばらつきを見る案は、一貫性の評価としてはむしろ直球である。それを消して「最終更新日」を選ばせる理屈は弱い。\n\n確実に押さえるべきは1点だけ——デフォルト値を入れる案は「評価する」ではなく「直す」なので、設問の目的に合わない。設問が評価・測定を求めているのか、改善を求めているのかを読み分ける。"}, {"n": 20, "t": "Northern Trail Outfittersは、Salesforceデータのアーカイブソリューションを実装する必要があります。このアーカイブソリューションは、NTOが以下のことを行うのを支援する必要があります。\n1. 日常的に必要とされない古い情報を削除する。\n2. Salesforceのパフォーマンスを向上させる。\nこれらの要件を満たすためには、どのソリューションを使用するべきでしょうか？", "c": ["アーカイブされたデータを保存する場所を特定し、スケジュールされたバッチジョブを使用して、古いデータを夜間に移行およびパージする。", "アーカイブされたデータを保存する場所を特定し、時間ベースのワークフローを使用してその場所にデータを移動する。", "レコードが定義された経過日数に達したときにtrueを示す数式項目を使用し、その項目を使用してレポートを実行し、SharePointにレポートをエクスポートする。", "フルコピーSandboxを作成し、それをアーカイブされたデータを保持するためのソースとして使用する。"], "a": [0], "e": ["正解です。外部のデータベースやデータウェアハウスなど、アーカイブ用の保存場所を確保し、スケジュールされたバッチジョブ（ApexバッチやETLツールなど）を利用して定期的にデータを移行し、Salesforceから削除（パージ）するのが、大規模なデータを効果的に管理し、システムのパフォーマンスを向上させるための標準的なアーキテクチャアプローチです。", "時間ベースのワークフローは、項目自動更新やメール送信などの標準的なアクションを実行するためのものであり、外部の保存場所に大量のデータを移行およびアーカイブするためのデータエクスポートや削除の機能は持っていません。", "レポートを利用した手動のエクスポートは、堅牢で自動化されたエンタープライズレベルのアーカイブソリューションとしては不十分です。また、エクスポート後にSalesforceから元のデータを自動で削除するメカニズムがないため、データ容量の削減やパフォーマンスの向上には直接つながりません。", "フルコピーSandboxは開発やテストを行うための環境であり、データアーカイブ用ではありません。Sandboxを更新（リフレッシュ）すると環境内のデータが本番データで上書きされるため、データの長期保存場所として使用することは非常に危険であり、ベストプラクティスに反します。"], "note": "アーカイブの問題で常に効く考え方——「移す」だけでは不十分で、「Salesforceから消す」までやらないとパフォーマンスは改善しない。エクスポートして保管するだけの案が不正解になるのはこのため。移行＋パージの2つが揃っているかで選ぶ。\n\nSandboxをデータの保管場所にしてはいけない理由も覚えておく。更新すると中身が本番データで上書きされ、保管していたものが消える。"}, {"n": 21, "t": "UCは大量のデータを伴う大規模なSalesforceの実装を計画しています。組織の実装の一環として、いくつかのロール、テリトリー、グループ、および共有ルールが設定されています。データアーキテクトは、ユーザーデータを含むすべての必要なデータをタイムリーに読み込むという任務を負っています。システム計算によるデータの読み込み時間を最小限に抑えるために、データアーキテクトは何をするべきですか？", "c": ["共有の直接適用の延期を有効にし、共有ルールの計算を一時停止する。", "データローダを使用してデータを読み込み、並列処理をオンにする。", "Bulk APIを活用し、複数のバッチで同時処理を行う。", "「UNABLE_TO_LOCK_ROW」エラーを回避するために、詳細なロックを有効にする。"], "a": [0], "e": ["正解です。ロール、テリトリー、グループ、共有ルールが構成されている環境で大量のデータをロードすると、レコードが挿入されるたびに共有の再計算が発生し、パフォーマンスが大幅に低下します。共有の直接適用の延期(Defer Sharing Calculations)を有効にして計算を一時停止し、すべてのデータのロードが完了した後に再計算を一括で行うことで、システム計算による読み込み時間を大幅に短縮できます。", "並列処理を使用するとデータ読み込みが高速化される可能性がありますが、複雑な共有モデル（ロールやテリトリーなど）が設定されている場合、行ロックエラーが頻発するリスクが高くなります。システム計算による遅延を根本的に解決する手法ではありません。", "Bulk APIを使用することは大量データロードのベストプラクティスですが、データローダの並列処理と同様に、同時処理を行うと共有ルールや親レコードの競合による行ロックエラーが発生しやすくなります。システム計算による負荷を軽減するための直接的な対策とは言えません。", "詳細なロック(Granular Locking)は、パブリックグループやロールなどの管理操作が同時に実行された際のロック競合を最小限に抑えるための機能です。大量データロード時の共有再計算などによるシステム計算の遅延を直接的に最小化するアプローチではありません。"], "note": "この問題は「ロック競合」の問題に見えて、実は違う。問題文のキーワードは「システム計算による読み込み時間」で、原因は共有の再計算である。\n\n見分け方——問題文に「ロール」「テリトリー」「グループ」「共有ルール」が並んでいたら、答えは共有計算の延期。「親子関係のあるレコードを大量に入れる」「UNABLE_TO_LOCK_ROW が出る」ならロック対策（直列モードか親IDでソート）。原因が違うので対策も違う。"}, {"n": 22, "t": "Universal Containers (UC) は、販売報告のために商談と注文に関する月次および年次レポートを実行する必要があります。500万件の商談と1000万件の注文があります。営業ユーザーは、レポートが頻繁にタイムアウトすると不満を述べています。タイムアウトの問題を解決するために、データアーキテクトにとって最も速く効果的な方法は何ですか？", "c": ["商談にカスタム項目を作成し、注文からそれらのカスタム項目にデータをコピーして、商談オブジェクトですべてのレポートを実行する。", "Salesforceから商談と注文のデータを抽出し、サードパーティのレポートツールを使用してSalesforceの外部でレポートを実行する。", "Salesforceにスキニーテーブルを作成し、注文と商談の項目をスキニーテーブルにコピーして、それに必要なレポートを作成する。", "月次および年次の値を、必要なレポートのために必要なフォーマットに要約する集計カスタムオブジェクトを作成する。"], "a": [3], "e": ["データ量が500万件の商談と1000万件の注文と非常に多いため、項目をコピーして1つのオブジェクトにまとめても、大量のレコードを毎回集計する際のレポートのタイムアウト問題自体を根本的に解決することはできず、データの冗長性も生じます。", "外部ツールを使用して要件を満たすことは可能ですが、継続的にデータを抽出して外部システムに連携する仕組みの構築や維持が必要となり、Salesforce内で完結する最も速く効果的な解決策とは言えません。", "スキニーテーブルは頻繁に使用される項目を含めて検索などのパフォーマンスを向上させる機能ですが、複数のオブジェクトをまたいだ複雑な集計を自動的に行うものではありません。今回のような月次や年次の集計レポートにおける数千万件規模の大規模データのタイムアウトを完全に防ぐ最適な方法ではありません。", "正解です。数百万件を超える大量のレコードに対して月次や年次の集計レポートを実行する場合、事前にバッチ処理などでデータを月ごとや年ごとに集計（サマリー）した専用のカスタムオブジェクトを作成しておくことで、レポート実行時に読み込むレコード数を劇的に減らし、タイムアウトを回避する最も速く効果的な方法となります。"], "note": "スキニーテーブルが不正解になる理由を正確に押さえる。スキニーテーブルは「1つのオブジェクトの、よく使う項目だけを抜き出した軽量な複製」であって、複数のオブジェクトをまたいだ集計はできない。この問題は商談と注文の2つにまたがっているので使えない。\n\nあわせて、スキニーテーブルは自分では作れずSalesforceのサポートに依頼する、という点も問われやすい。「最も速く」という条件とも相性が悪い。\n\n正解の考え方は「毎回集計するのをやめて、集計済みの結果を持っておく」。レポートが読む件数そのものを減らすのが唯一の根本解決になる。"}, {"n": 23, "t": "Universal Containers（UC）は事務用品の主要なサプライヤーです。一部の製品はUCによって製造され、一部は他のメーカーによって製造されています。最近、多くの顧客から、請求書上の製品説明がオンラインカタログや一部の注文確認書の説明と一致しないという苦情が寄せられています（例：カタログでは「ballpoint pen」、請求書では「pen」、また商品の色のラベルが不一致：「what」と「White」、「blk」と「Black」など）。すべての製品データは企業のデータウェアハウスに統合され、見積もりと請求書を生成するためにSalesforceにプッシュされます。オンラインカタログとウェブショップはSalesforce Customer Communityソリューションです。データの不整合を解決するためにUCが使用すべき正しい手法は何ですか？", "c": ["製品マスターシステムがSalesforce APIを介してSalesforce内の製品データを直接更新できるように、インテグレーションを変更する。", "さまざまなソースシステムからのデータを保存するために、Salesforceの商品標準オブジェクトにカスタム項目を追加する。", "製品データのデータタクソノミー（分類体系）を定義し、そのタクソノミーをデータウェアハウス内の製品データに適用する。", "データがSalesforceにロードされた後、製品が正しい名前とラベルを持つことを保証するApexトリガーをSalesforceで構築する。"], "a": [2], "e": ["複数のシステムがそれぞれ直接Salesforceを更新するように変更しても、各システム間でのデータ形式や命名規則の違いがそのまま反映されてしまうため、データの不整合は解決しません。また、データウェアハウスで統合するという現在のデータアーキテクチャの利点を損なうことになります。", "システムごとに異なるカスタム項目を作成してデータを保持すると、Salesforceのデータモデルが不必要に複雑になります。カタログや請求書でどの項目を表示するかを判断する処理も煩雑になり、根本的なデータの標準化や一貫性の解決には至りません。", "正解です。データウェアハウスにすべての製品データが集約されているため、この段階で全社的なデータタクソノミー（分類体系や命名規則）を定義して適用し、データをクレンジングするのが最適です。これにより、Salesforceに連携される前にデータが標準化され、カタログや請求書で一貫した正しい製品データが表示されるようになります。", "Salesforce側のApexトリガーを使用してデータロード後に名称やラベルを修正・標準化することは、処理の負荷が高くなりパフォーマンスに悪影響を与えます。将来の変更管理も難しくなるため、データの標準化は上流の統合基盤であるデータウェアハウスで行うのがベストプラクティスです。"], "note": "この問題集を通じて繰り返し出る原則——データの標準化・クレンジングは、Salesforceに入れる前（上流）で行う。Salesforceに入ってから直す案は、ほぼ常に不正解。\n\n移行の場面ではステージングデータベースが、継続的な連携の場面ではデータウェアハウスが、その「上流」にあたる。どちらも役割は同じで、名前が違うだけ。"}, {"n": 24, "t": "NTOには25年にわたる100万件の顧客レコードがあります。新しいSalesforceプロジェクトの一環として、NTOは顧客データの履歴と関連性を保持するために、マスターデータ管理戦略を作成したいと考えています。マスターデータ管理戦略を成功させるために必要な3つのアクティビティはどれですか？3つの答えを選択してください。", "c": ["複製するデータを特定する", "データアーカイブ戦略を作成する", "重要なデータのシステムオブレコードを定義する", "データウェアハウスを導入する", "ビジネスインテリジェンスツールを選択する"], "a": [0, 1, 2], "e": ["正解です。マスターデータ管理において、複数のシステム間でどのデータを同期または複製する必要があるかを特定することは、組織全体でデータの一貫性と正確性を保つために不可欠な活動です。", "正解です。25年にわたる100万件のレコードのように大量の履歴データが存在する場合、Salesforceのストレージ制限やシステムのパフォーマンスを維持しつつ、必要なデータ履歴を保持するためのアーカイブ戦略が重要になります。", "正解です。マスターデータ管理では、各データ要素についてどのシステムが信頼できる唯一の情報源(システムオブレコード)であるかを明確に定義し、データの競合や重複を防ぐ必要があります。", "データウェアハウスの導入は、蓄積されたデータの集計や大規模な分析、レポート作成には役立ちますが、マスターデータ管理戦略を定義・確立するための直接的または必須のアクティビティではありません。", "ビジネスインテリジェンス(BI)ツールはデータの視覚化や高度な分析を行うために使用されますが、マスターデータの品質や一貫性を管理する戦略そのものを構成する要素ではありません。"], "note": "マスターデータ管理の核は「システム・オブ・レコード（その項目の正本を持つシステム）を決めること」。これが必ず正解に入る。\n\n不正解になる2つに共通するのは、どちらも「分析のための道具」だということ。マスターデータ管理は分析ではなく、正本を決めて品質を保つ活動なので、分析の道具は答えにならない。この区別は何問かで効く。"}, {"n": 25, "t": "Universal Containers (UC) はSalesforceを導入していますが、ストレージが不足しているため、アーカイブソリューションを必要としています。UCはSalesforce内に2年分のデータを保持し、それより古いデータをSalesforce外にアーカイブしたいと考えています。データアーキテクトはアーカイブソリューションとしてどの解決策を推奨すべきですか？", "c": ["すべてのデータをプラットフォーム外にバックアップするために、サードパーティのバックアップソリューションを使用する。", "バッチジョブを構築してすべてのレコードをプラットフォーム外に移動し、Salesforceからすべてのレコードを削除する。", "バッチジョブを構築して2年以上前のレコードをプラットフォーム外に移動し、Salesforceからレコードを削除する。", "バッチジョブを構築してすべての復元データをプラットフォーム外に移動し、Salesforceから古いレコードを削除する。"], "a": [2], "e": ["要件は2年分のデータをSalesforce内に保持し、それより古いデータをアーカイブすることです。すべてのデータをバックアップすることは、古いデータのみをアーカイブするという要件を満たしていません。", "すべてのレコードを移動および削除してしまうと、2年分のデータをSalesforce内に維持するという要件を満たすことができません。", "正解です。要件通りに、最近2年間のデータをSalesforce内に残し、2年以上経過した古いレコードのみをプラットフォーム外へ移動させてSalesforceから削除することで、要件を満たしつつストレージ容量の問題を解決できます。", "選択肢の意図が不明確であり、2年分のデータを維持してそれより古いデータのみを対象とするという具体的な要件に対する正確なアプローチではありません。"], "note": "ほぼ読解問題で、知識は要らない。「2年分は残す」と書いてあるので「すべて」と書かれた案は全部消える。\n\nこの種の問題で時間を使わないことが本番では効く。選択肢の差分だけを見て、要件の数字と合わないものを機械的に消す。"}, {"n": 26, "t": "ある顧客が、1回の移行で70万件の取引先レコードをSalesforceに移行したいと考えています。移行時間を最小限に抑えながらこれらのレコードを移行するために推奨されるソリューションは何ですか？", "c": ["パラレルモードでSalesforce SOAP APIを使用する。", "シリアルモードでSalesforce Bulk APIを使用する。", "パラレルモードでSalesforce Bulk APIを使用する。", "シリアルモードでSalesforce SOAP APIを使用する。"], "a": [2], "e": ["SOAP APIは少量のレコードやリアルタイムの統合に適した同期APIであり、70万件のような大量のデータ移行には最適化されていません。Bulk APIを使用する場合と比較して、移行に長い時間がかかります。", "Bulk APIは大量のデータ処理に適していますが、シリアルモードではバッチが1つずつ順番に処理されるため、データロックの回避などの特別な理由がない限り、並列処理よりも全体の移行時間が長くなります。", "正解です。Salesforce Bulk APIは、数十万件の大規模データをロードまたはクエリするために最適化された非同期APIです。パラレル（並列）モードを使用することで、複数のバッチが同時に処理されるため、70万件の取引先レコードの移行時間を最小限に抑えることができます。", "SOAP APIは大規模データの移行には不向きであり、さらにシリアルモードで順次処理を行うと、70万件のレコード移行には最も時間がかかる非効率な方法となります。"], "note": "ここが並列と直列の分かれ目の基準になる問題。対象が取引先で、共通の親がいない。親の取り合いが起きないので、速い並列をそのまま使ってよい。\n\n同じBulk APIでも、取引先の子である注文を入れる問題では答えが変わる（親IDでソート、または直列）。「何を入れるのか、その上に共通の親がいるか」を必ず確認する。選択肢の組み合わせだけ見て反射的に選ぶと落とす。"}, {"n": 27, "t": "Northern Trail Outfittersは顧客の種別についてレポートを作成したいと考えています。顧客種別のカスタム項目が取引先オブジェクトに作成されました。ユーザーがこの項目に情報を入力する際、以下の定義された選択肢に限定する必要があります：\n1. High Value\n2. Medium Value\n3. Low Value\nデータアーキテクトは顧客種別を設定するためにどの戦略を推奨するべきでしょうか？", "c": ["定義された選択肢を持つカスタムオブジェクトへの参照。", "定義された選択肢を持つ単一選択の制限付き選択リスト。", "ユーザーを定義された選択肢へと案内するためのヘルプテキストを提供する。", "定義された選択肢への入力に限定するための入力規則を作成する。"], "a": [1], "e": ["選択肢を管理するためだけにカスタムオブジェクトを作成し参照関係を構築することは、システムとデータモデルを不必要に複雑化させるため推奨されません。", "正解です。制限付き選択リストを使用することで、ユーザーが事前に定義された値（High Value、Medium Value、Low Value）のみを選択できるようにシステム的に強制でき、データ品質と整合性を維持するための最も標準的で適切な方法です。", "ヘルプテキストはユーザーに入力方法を案内する単なる表示情報であり、システム的に不正な値の入力を制限する機能はないため要件を満たしません。", "テキスト項目に対して入力規則を設定して入力を制限することは技術的には可能ですが、あらかじめ決まった選択肢からユーザーに選ばせる場合は、標準の選択リスト項目を使用する方が構築、保守、ユーザーインターフェースのすべての観点で優れています。"], "note": "「制限付き」選択リストという語に意味がある。制限付きにしないと、APIや連携経由で定義にない値を入れられてしまう。画面では選べなくても、裏口から入る。\n\nこの問題はスキューの問題とも関係する。値が3つしかないものをカスタムオブジェクトへの参照にすると、3件の親に数十万件がぶら下がって参照スキューになる。値が少数で固定なら選択リスト、は性能の観点からも正しい。"}, {"n": 28, "t": "NTOは10年間、営業とサービスのためにSalesforceを使用しています。過去2年間、マーケティンググループはSalesforceに保存されている取引先責任者の情報を使用して郵便物を送信した際、返送される郵便物が0%から35%に増加したことに気づきました。返送される郵便物の量を減らすために、データアーキテクトはどの解決策を使用すべきですか？", "c": ["サードパーティのデータソースを使用してSalesforceの取引先責任者情報を更新する。", "すべての顧客にメールを送信し、情報を確認するよう求め、住所が間違っている場合はNTOに電話するよう依頼する。", "NTOの郵送コストを節約するために、郵便物が返送された時に取引先責任者を削除する。", "営業チームにすべての既存顧客に電話をかけさせ、取引先責任者の詳細を確認するよう依頼する。"], "a": [0], "e": ["正解です。サードパーティのデータソース（データプロバイダーやデータクレンジングツール）を統合することで、古くなった住所情報などを自動的かつ大規模に最新の正確な情報に更新できます。これがデータ品質を維持し、返送される郵便物を減らすための最も効率的でスケーラブルなベストプラクティスです。", "顧客自身に確認や電話を依頼することは顧客体験を損なう可能性があり、返答率に依存するため非効率的です。また、住所が古い顧客はメールアドレスも無効になっている可能性があり、効果的な解決策とは言えません。", "郵便物が届かないという理由だけで取引先責任者のレコードを削除してしまうと、過去の取引履歴や関連する重要な顧客データを完全に失うことになります。データ管理の観点から非常に不適切なアプローチです。", "すべての既存顧客に対して手動で電話をかけることは、非常に時間と労力がかかるため現実的ではありません。営業チームのリソースを圧迫し、本来の営業活動を妨げる原因となります。"], "note": "住所の品質の問題は、答えが毎回「外部のデータサービスと連携する」になる。手作業（電話・メールで依頼・担当者に直させる）と、データを消す案は常に不正解。\n\n消す案が不正解になる理由は覚えておく価値がある。届かないことと、顧客として価値がないことは別。履歴ごと失うのは品質対策ではない。"}, {"n": 29, "t": "Universal Containersは営業組織を管理するためにSalesforceの使用を検討しています。彼らは老朽化した2つのシステムからレガシーな取引先データをSalesforceに移行する予定です。データの重複を最小限に抑えるためにアーキテクトが考慮すべき2つの設計上の注意点はどれですか？2つの答えを選択してください。", "c": ["重複をチェックして防止するためにワークフローを使用する。", "Salesforceにインポートする前にデータをクレンジングする。", "Salesforceの一致ルールと重複ルールを使用する。", "データを同時にインポートする。"], "a": [1, 2], "e": ["ワークフローにはレコードの重複を評価したり作成をブロックしたりする機能は備わっていません。重複の防止には専用の一致ルールおよび重複ルールを使用する必要があります。", "正解です。古いシステムからデータを抽出した後、Salesforceへインポートする前に外部ツールなどを用いてデータのクレンジング（重複の排除や名寄せ）を行うことは、データの重複を防ぐための最も重要で効果的なベストプラクティスです。", "正解です。Salesforceの標準機能である一致ルールと重複ルールを適切に設定することで、インポート時やユーザーの入力時に重複したレコードが作成されるのを自動的に防ぐことができます。", "データを並列で同時にインポートすると、同じ情報を持つレコードが別々の処理で同時にインポートされる可能性があり、重複ルールをすり抜けてデータが重複してしまうリスクが高まるため不適切です。"], "note": "重複対策は「どこで止めるか」で3つに整理できる。移行の前＝外部でクレンジング（ステージングデータベース）。入力のとき＝一致ルールと重複ルール。複数システムにまたがる＝マスターデータ管理で正本を決める。\n\nこの問題は移行の話なので、上の2つが答えになる。ワークフローに重複を止める機能はない、という事実は単独でも問われる。"}, {"n": 30, "t": "Universal Container (UC) は、従業員の詳細、給与、および採用活動を管理するための人事アプリケーションをSalesforce上に構築したいと考えています。関連するデータを適切に保存するために、このアプリケーションでは45個のカスタムオブジェクトを利用する必要があります。これに加えて、UCはオンプレミスアプリケーションからSalesforceへ1日に約20,000回のAPIコールを想定しています。データアーキテクトは、これらの要件に最も適したどのライセンスタイプを推奨するべきでしょうか？", "c": ["Service Cloud", "Lightning Platform Start", "Lightning Platform Plus", "Lightning External Apps Starts"], "a": [2], "e": ["Service Cloudはカスタマーサービスやサポートに特化したフル機能のCRMライセンスです。カスタムオブジェクトやAPIの要件は満たせますが、社内の人事アプリケーションを構築する目的としては不要な機能が多く含まれており、コストの観点から推奨される最適な選択肢ではありません。", "このライセンスは基本的なカスタムアプリケーションの構築に適していますが、ユーザーあたりに許可されるカスタムオブジェクトへのアクセスは最大10個までに制限されています。今回の要件である45個のカスタムオブジェクトを利用できないため不適切です。", "正解です。このライセンスはユーザーあたり最大110個のカスタムオブジェクトへのアクセスをサポートしているため、45個という要件を十分に満たすことができます。また、エンタープライズレベルのAPIコール制限も含まれており、オンプレミスシステムとの連携を含む社内向けのカスタム人事アプリケーションを構築する上で最も適切なライセンスです。", "このライセンスは、コミュニティやポータルを通じて社外のユーザー（顧客など）がカスタムアプリケーションにアクセスするためのライセンスです。社内の従業員が人事管理タスクを行うための内部用途には適していません。"], "note": "ライセンスの問題は、覚える数字が2つだけ。Starter＝カスタムオブジェクト10個まで、Plus＝110個まで。問題文の個数がこの間なら Plus。\n\nただしライセンスの名称と上限は改称・改定されやすい領域なので、実務で判断するときは一次情報を見ること。試験対策としてはこの2つの数字で足りる。\n\n判断の順番は、①社内か社外か（社外ならExternal Apps系）②標準の営業・サービス機能が要るか（要らなければPlatform系）③カスタムオブジェクトの数、で絞る。"}, {"n": 31, "t": "Universal Containers (UC) は、主に米国を拠点とする企業に関する100,000件の取引先データを継続的に強化およびクレンジングしたいと考えています。UCは、主要なデータ品質指標を簡単に監視できるソリューションを探しています。この要件を満たすために推奨されるソリューションは何ですか？", "c": ["取引先のデータ品質を監視するために、Data.com Cleanをインストールおよび設定することによる宣言的アプローチを使用する。", "取引先のデータ品質を監視するために、サードパーティのデータ品質APIを呼び出すBatch Apexを実装する。", "取引先のデータ品質を監視するために、Data.com Prospectorをインストールおよび設定することによる宣言的アプローチを使用する。", "取引先のデータ品質を監視するために、サードパーティのデータ品質APIをクエリするApexトリガーを取引先に実装する。"], "a": [0], "e": ["正解です。Data.com Clean(または同等のAppExchangeの宣言的なデータ品質パッケージ)を使用することで、開発を行わずに継続的なデータのクレンジングや強化ができ、ダッシュボード等でデータ品質の指標を簡単に監視・レポートすることが可能になります。", "Batch Apexによるカスタム開発は可能ですが、継続的な監視や指標の簡単なダッシュボード化といった標準機能を提供しないため、開発と保守のコストがかさみ、最適なソリューションとは言えません。", "Data.com Prospectorは新規リードや見込み客を見つけるためのソリューションであり、既存の取引先データの継続的な強化やクレンジング、データ品質指標の監視を主目的としたものではありません。", "Apexトリガーを使用してAPIコールアウトを行うと、トランザクションの制限(ガバナ制限)に達するリスクが高くなります。また、データ品質指標の全体的な監視という要件を満たすのにも適していません。"], "note": "Data.com は提供終了しているので、この問題は現行では成立しない。覚えるべきは機能名ではなく、「開発せずに済む宣言的な方法を選ぶ」という考え方。コードを書く案（Batch Apex・Apexトリガー）が2つ並んでいて、どちらも不正解になるのは他の問題と同じ型。\n\nなお、Apexトリガーから外部APIを呼ぶ案が不正解になる理由は覚えておくとよい。トリガーの中で外部通信をするとガバナ制限に当たりやすい。"}, {"n": 32, "t": "Universal Containers (UC) は、マルチシステムのERP環境において、マーケティング、営業、およびサポートの取り組みを管理するためにSalesforceを導入しました。標準のレポートとダッシュボードの制限に達した後、UCの経営陣は、より分析的なインサイトを提供するためにどのようなオプションが使用できるかを理解したいと考えています。アーキテクトが推奨するべき2つのアプローチはどれですか？2つの答えを選択してください。", "c": ["AppExchangeアプリ", "Wave Analytics", "ウィークリースナップショット", "設定変更履歴"], "a": [0, 1], "e": ["正解です。Salesforceの標準機能では満たせない高度な分析やデータの視覚化要件に対して、AppExchangeで提供されているサードパーティ製の分析アプリケーションを導入することは、有効な選択肢の一つです。", "正解です。Wave Analytics（現在のCRM Analytics）は、Salesforceのデータおよび外部データ（ERPなど）を統合して、高度な分析やダッシュボードを提供する強力な分析プラットフォームです。標準レポートの制限を超えるインサイトを得るのに最適です。", "レポートのスナップショット機能を使用すると、特定の時点でのデータを保存して履歴の傾向を追跡できますが、これ自体は高度な分析プラットフォームを提供するものではなく、経営陣が求めるインサイトの拡張には直接的につながりません。", "設定変更履歴は、管理者がSalesforce組織の設定変更を追跡および監査するための機能です。ビジネスデータの分析やインサイトの提供を目的とした機能ではありません。"], "note": "Wave Analytics は改称を重ねていて、Wave → Einstein Analytics → Tableau CRM → CRM Analytics と変わっている。過去問にどの名前で出てきても同じ製品を指していると判断する。\n\n設定変更履歴が選択肢に混ざっているのは、分析の問題に監査の機能を紛れ込ませる定番の引っかけ。設定変更履歴は「誰が設定をいじったか」であって、ビジネスデータとは無関係。"}, {"n": 33, "t": "UCは患者管理のためにSales Cloudを導入しており、ファイルに保存される機密の患者レコードを暗号化したいと考えています。この要件を解決するために、データアーキテクトはどのソリューションを推奨するべきでしょうか？", "c": ["ファイルを暗号化するためにShieldプラットフォーム暗号化を実装する。", "ファイルを暗号化するためにクラシック暗号化を使用する。", "ファイルを暗号化するためにサードパーティのAppExchangeアプリを実装する。", "Salesforceの外部にファイルを保存し、リアルタイムでアクセスする。"], "a": [0], "e": ["正解です。Shieldプラットフォーム暗号化は、Salesforce内のファイルや添付ファイルなどの保存データを暗号化することができる強力なネイティブ機能です。医療情報などの機密性の高いデータをコンプライアンス要件に従って安全に保護するための最適なソリューションとなります。", "クラシック暗号化は、特定のカスタムテキスト項目を暗号化するための基本機能であり、ファイルや添付ファイルを暗号化することはできません。", "サードパーティのアプリを使用することも技術的には可能かもしれませんが、Salesforceの標準機能であるShieldプラットフォーム暗号化を利用する方が、アーキテクチャの複雑さを避け、ネイティブな統合とサポートの恩恵を受けられるため推奨されます。", "外部のストレージシステムを利用してリアルタイムアクセスを構築することは、インテグレーションの開発や保守コストなどの不要なシステム要件を増やします。Salesforce内でファイルを直接暗号化して保存できるため、この要件に対して外部システムに依存することは推奨されません。"], "note": "覚える違いは1つだけ。クラシック暗号化はカスタムのテキスト項目しか暗号化できない（文字数の制限もある）。ファイル・添付・標準項目まで暗号化できるのは Shield プラットフォーム暗号化のほう。問題文に「ファイル」と書いてあれば Shield。\n\nただし実務では、Shieldで暗号化した項目は検索や並べ替えに制限が出る。「暗号化すれば万事解決」という選択肢が不正解になる問題もあるので、代償があることは覚えておく。"}, {"n": 34, "t": "Universal Containers (UC) は、リードを所有者に割り当てるためのリード割り当てルールを設定しています。割り当てルールによってルーティングされないリードは、ダミーユーザーに割り当てられます。営業担当者は、ダミーユーザーに割り当てられたリードの読み込み時間が長く、アクセスに問題があると不満を述べています。データアーキテクトは、これらのパフォーマンスの問題を解決するために何を推奨すべきでしょうか？", "c": ["ダミーユーザーをロール階層の最下位のロールに割り当てる", "複数のダミーユーザーを作成し、それらにリードを割り当てる", "ダミーユーザーをロール階層の最上位のロールに割り当てる", "リードを定期的に削除して、リードの数を減らす"], "a": [1], "e": ["ロール階層を持たせない、または最下位に配置することは共有計算の影響を最小限に抑えるためのベストプラクティスの1つですが、1人のユーザーが大量のレコードを所有することによる根本的なデータスキュー(所有権スキュー)の問題を完全に解決するものではなく、読み込み時間の劇的な改善には至りません。", "正解です。1人のユーザーが10,000件以上のレコードを所有すると「所有権スキュー」が発生し、パフォーマンスが著しく低下します。複数のダミーユーザーを作成し、レコードの所有権を分散させることで、このデータスキューを解消し、パフォーマンスの低下やアクセス時の問題を解決することができます。", "最も避けるべき設定です。大量のレコードを所有するユーザーをロール階層の上位に配置すると、共有ルールの再計算が発生した際に、階層の下位にいるすべてのユーザーに影響が及び、システム全体のパフォーマンスが致命的に低下します。", "データの総量を減らすことはパフォーマンス向上に寄与しますが、未割り当てのリードであっても後で活用できる可能性がある重要なビジネスデータです。システムのパフォーマンス問題を解決するためにビジネスデータを削除することは、適切なアーキテクチャの解決策とは言えません。"], "note": "所有権スキューの典型例。1人が1万件を超えて所有すると起きる。対策は2つあり、この問題では両方が選択肢に並んでいる。①所有者を分散させる（根本対策）②そのユーザーをロール階層に入れない、または最下位に置く（影響の緩和）。\n\n正解は①のほう。②も実際のベストプラクティスだが、偏りそのものは解消しないため。逆に、ロール階層の上位に置くのは最悪で、再計算が下位全員に波及する。この3つの関係を押さえる。\n\n移行時に「全レコードを管理者が所有する」「取りこぼしをダミーユーザーに寄せる」のが、所有権スキューの二大原因。"}, {"n": 35, "t": "Universal Containersには、数百万行のデータを持つカスタムオブジェクトがあります。SOQLクエリを実行する際、クエリが選択的になることを妨げる3つのオプションはどれですか？（3つ選択してください。）", "c": ["先頭に%ワイルドカードを使用する。", "末尾に%ワイルドカードを使用する。", "大規模なロードと削除を実行する。", "NOTおよび!=演算子を使用する。", "決定論的数式項目にカスタムインデックスを使用する。"], "a": [0, 2, 3], "e": ["正解です。LIKE演算子で先頭にワイルドカード（%）を使用する（例: '%text'）と、データベースのインデックスを利用できなくなり、フルテーブルスキャンが発生するため、クエリが選択的になることを妨げます。", "末尾のワイルドカード（例: 'text%'）を使用した検索であれば、インデックスを利用することができるため、条件が絞り込まれていればクエリの選択性を妨げることはありません。", "正解です。大規模なデータのロードや削除といったDML操作を行うと、データベースの統計情報が古くなったりインデックスが一時的に機能しなくなったりすることがあり、クエリオプティマイザが適切にインデックスを利用できず、クエリの選択性が低下する原因となります。", "正解です。否定演算子（NOTや!=）を使用すると、条件に合致しない残りの多数のレコードを評価しなければならず、インデックスが有効に機能しないため、クエリが選択的になることを妨げます。", "決定論的数式項目（実行時ではなく保存時に値が確定する数式）にカスタムインデックスを作成して使用することは、むしろクエリの検索パフォーマンスを向上させ、クエリを選択的にするための有効な手段です。"], "note": "索引（インデックス）を本の巻末索引だと思うと、全部説明がつく。「田中で始まる」なら索引を引けるが、「田中を含む」は全ページ読むしかない。だから先頭のワイルドカードは索引が効かず、末尾なら効く。「〜ではない」も同じで、該当しないものを探すには全部見るしかない。\n\n大規模なロードや削除が効いてくるのは、削除したレコードがごみ箱に残っている間も統計がずれるため。移行の直後にクエリが遅くなる現象の説明になる。\n\n「決定論的」とは、保存時に値が確定して後から勝手に変わらない、という意味。だから索引を作れる。TODAY() のように時間で変わる数式は索引を作れない。"}, {"n": 36, "t": "顧客は、取引先オブジェクトと主従関係にある子レコードの注文レコードを大量にインポートする際、ロックの問題に直面しています。インポート中のロックの問題を回避するために推奨される方法は何ですか？", "c": ["取引先レコードを先にインポートし、注文を注文IDで並べ替えた後に注文レコードをインポートする。", "取引先レコードを先にインポートし、注文を取引先IDで並べ替えた後に注文レコードをインポートする。", "関係を参照関係に変更し、インポート後に関係を主従関係に更新する。", "注文レコードと取引先レコードを個別にインポートし、バッチApexを使用して注文内の取引先IDを入力する。"], "a": [1], "e": ["注文IDで並べ替えた場合、同じ親の取引先を持つ注文レコードが複数の異なるバッチに分散して処理される可能性が高くなります。これにより、並列処理時に異なるスレッドが同時に同じ親レコードをロックしようとして、ロック競合が発生します。", "正解です。子レコードを親レコードのID（取引先ID）で並べ替えてインポートすることで、同じ親取引先レコードを参照する子レコードが同一バッチ内に集約されます。これにより、複数のスレッドによる親レコードへの同時アクセスやロック競合を回避し、大量のデータをスムーズにインポートすることができます。", "関係を参照関係に変更しても、参照データのインポート時に親レコードのロック問題が発生する可能性は残ります。また、インポート後に再び主従関係へ変更する作業は、データの整合性検証など不要な処理負荷と手間がかかるため非効率的です。", "主従関係において、子レコードを作成する際には親レコードのID設定が必須となります。そのため、取引先IDなしで注文レコードを先に作成することはできません。バッチApexでの後処理は根本的な解決にはなりません。"], "note": "ロック競合の仕組みが分かっていれば理屈で解ける。子を保存すると親にも鍵がかかる。同じ親を持つ子が別々の束に散っていると、束どうしが同じ親を取り合う。親IDで並べ替えると同じ親の子が1つの束にまとまるので、取り合いが起きない。\n\nこれは「速さを保ったまま」解決できるので、直列モードより上等な答え。直列が正解になるのは、並べ替えという選択肢が与えられていない場合や、確実さを優先する場合。\n\nあわせて覚える事実——主従関係の子は、親のIDなしでは作れない。"}, {"n": 37, "t": "Salesforceは、Ursa Major Solarの異なるマルチシステムのERP環境に導入されようとしています。Ursa Major Solarは、システム間のデータ同期を維持したいと考えています。この目標を達成するために使用すべき2つのテクニックはどれですか？（2つ選択してください。）", "c": ["SalesforceとERP環境を統合する。", "Workbenchを利用してシステム内のファイルを更新する。", "MDM戦略を活用して、信頼できる唯一の情報源の概要を描く。", "同期レポートとダッシュボードを構築する。"], "a": [0, 2], "e": ["正解です。SalesforceとERPシステムを統合（APIや連携ツール、ミドルウェアなどを使用）することで、データの変更がシステム間で自動的に同期され、一貫性を維持することができます。", "Workbenchは管理者や開発者がAPIを介してSalesforce組織のデータを手動または単発で操作するためのツールであり、複数システム間で継続的かつ自動的なデータ同期を行うアーキテクチャやテクニックとしては適していません。", "正解です。マスターデータ管理（MDM）戦略を策定し、どのシステムが特定のデータ要素において信頼できる唯一の情報源（シングルソース・オブ・トゥルース）であるかを定義することは、マルチシステム環境でのデータ同期を成功させるための重要な基盤となります。", "レポートとダッシュボードはSalesforce内のデータを視覚化して分析するための機能であり、外部システムとのデータ同期を実際に実行・維持するための技術的なアプローチではありません。"], "note": "同期の問題は、技術（つなぐ）と方針（どちらを正とするか）の2つが揃って初めて成立する。片方だけでは答えにならないので、2つ選ぶ問題ではこの組み合わせになりやすい。\n\nレポート・ダッシュボードは見るための道具であって、同期の手段ではない。分析の道具を混ぜる引っかけは、この問題集で繰り返し出てくる。"}, {"n": 38, "t": "Universal Containers (UC) はSales Cloudを導入しましたが、洞察に満ちたレポートやダッシュボードを実行するのに十分なデータを営業担当者が入力していないことが判明しました。UCの経営陣はデータ品質の指標を監視および測定したいと考えています。この要件を満たすソリューションはどれですか？", "c": ["データ品質を監視および測定するために、サードパーティのAppExchangeツールを使用する。", "サンプルデータの品質を確認するためのレポートを作成する。", "データ品質を計算するために、カスタムオブジェクトとカスタム項目を使用する。", "エンタープライズデータウェアハウスにデータをエクスポートし、データ品質のためにBIツールを使用する。"], "a": [0], "e": ["正解です。Salesforceにはデータ品質を視覚化しスコアリングするための評価の高いAppExchangeアプリ（Salesforce Labsが提供するData Quality Analysis Dashboardsなど）が多数用意されています。これらを活用することで、ゼロからカスタム開発を行うことなく、データ品質の指標を迅速かつ容易に監視および測定できます。", "標準のレポート機能単体でも空白項目の確認などはある程度可能ですが、データ品質の包括的なスコアリングや指標の測定、継続的な監視を自動的に行うという経営陣の要件を満たすには機能が不足しています。", "数式項目などを駆使して独自のデータ品質スコアを計算する仕組みを構築することも技術的には可能ですが、開発および保守の工数が大きくかかります。すでに利用可能なAppExchangeツールを導入する方が、ベストプラクティスとして推奨されます。", "データ品質を監視するというSalesforceの運用に関する要件に対して、外部システムにデータを連携して分析するのはアーキテクチャとして過剰です。リアルタイム性に欠け、不要なコストと複雑さをシステムに招くため推奨されません。"], "note": "「データ品質の指標を監視・測定したい」と書いてあったら、答えはAppExchangeのデータ品質ダッシュボード。Salesforce Labs の Data Quality Analysis Dashboards が定番の答えで、無償で提供されている。\n\n外部のデータウェアハウスに出す案が不正解になるのは、Salesforce内の運用の問題を、わざわざ外に出して解いているから。「過剰な解決策」を選ばせない問題は多い。"}, {"n": 39, "t": "Universal Containers（UC）は1,000万件を超える注文レコードのエクスポートにInformatica Cloud Loaderを使用する際に問題を抱えています。各注文レコードには10件の注文商品が含まれています。これを改善するために実行できる2つの手順は何ですか？2つ選択してください。", "c": ["複数のバッチでエクスポートする", "Bulk APIをパラレルモードでエクスポートする", "PK Chunkingを使用する", "バッチを1万件のレコードに制限する"], "a": [0, 2], "e": ["正解です。1,000万件を超えるような大量のレコードを一括でクエリして抽出しようとすると、タイムアウトやリソース上限によるエラーが発生しやすくなります。データを複数のバッチに分割して処理することで、システムへの負荷を抑え、安定したデータ抽出が可能になります。", "大規模なデータセットや親子のリレーションシップ（注文と注文商品など）が含まれるオブジェクトの処理でパラレルモードを使用すると、データロックや競合が発生し、エラーやパフォーマンス低下を引き起こす可能性があります。そのため、このような大規模な抽出処理でのパラレルモードの使用は適していません。", "正解です。PK Chunking（プライマリキーチャンキング）は、数百万件以上の大容量テーブルからデータをエクスポートする際にSalesforceが推奨する手法です。レコードID（PK）に基づいてクエリを自動的に最適なサイズのバッチに分割して実行するため、クエリのタイムアウトを防ぎ、効率的なデータ抽出を実現します。", "PK Chunkingを使用する場合のデフォルトのバッチサイズは10万件（最大25万件）です。バッチサイズを1万件という小さな値に制限してしまうと、過剰な数のバッチが生成されることになり、全体の処理時間が増大するだけでなく、APIリクエスト数の上限を圧迫するため適切な解決策ではありません。"], "note": "PK Chunking は「取り出す」ときの技法。入れるときの並列・直列とは別の話なので混ざらないようにする。数百万件以上を抽出してタイムアウトする、と書いてあれば PK Chunking。\n\n数字を2つ覚えておく。既定のチャンクサイズは10万件、最大25万件。選択肢に「1万件に制限する」が出てきたら、小さすぎるので不正解。"}, {"n": 40, "t": "Universal Containers (UC) は、エンタープライズ資源計画(ERP)システムからレガシーな在庫データをSales Cloudに移行するプロセスにあり、以下の要件があります。\n・レガシーな在庫データは、Inventory_cと呼ばれるカスタムの子オブジェクトに保存されます。\n・在庫データは標準の取引先オブジェクトに関連付けられる必要があります。\n・在庫オブジェクトは、取引先オブジェクトと同じ共有ルールを継承する必要があります。\n・Salesforceで取引先レコードが削除されたときはいつでも、関連するInventory_cレコードも削除される必要があります。\nこのシナリオにおいて、データアーキテクトはどのタイプの関係項目を推奨するべきでしょうか？", "c": ["取引先に作成された、Inventory_cに関連する主従関係項目", "Inventory_cに作成された、取引先に関連する主従関係項目", "取引先に作成された、Inventory_cに関連する間接参照関係項目", "Inventory_cに作成された、取引先に関連する参照関係項目"], "a": [1], "e": ["主従関係項目は、常に「詳細（子）」側となるオブジェクトに作成する必要があります。このシナリオではInventory_cが子オブジェクトと指定されているため、親である取引先オブジェクト側に主従関係項目を作成することはできません。", "正解です。子オブジェクトであるInventory_cに主従関係項目を作成することで要件をすべて満たすことができます。主従関係では、子レコードへのアクセス権は親レコード（取引先）の共有ルールに従って制御され、親レコードが削除されると関連する子レコードも一緒に削除（カスケード削除）されます。", "間接参照関係は、外部IDを使用して外部オブジェクトのデータをSalesforceオブジェクトに関連付けるために使用される機能です。Salesforce内部のカスタムオブジェクトであり、かつ共有ルールの継承などが求められるこのシナリオには適していません。", "参照関係はオブジェクト同士を独立して結びつける機能であり、デフォルトでは親レコードの共有ルールを子レコードに継承しません。また、カスケード削除も標準の主従関係のようには機能しないため、今回の要件を満たすことができません。"], "note": "要件の2つが主従関係を名指ししている。「親と同じ共有ルールを継承する」と「親が消えたら子も消える」は、どちらも主従関係だけが持つ性質で、参照関係にはない。この2語が問題文にあれば主従、と機械的に判断してよい。\n\nもう1つの軸は「どちら側に項目を作るか」。関係の項目は必ず子側に作る。階層の問題と同じ理屈で、子が親を指す。\n\n間接参照関係は外部オブジェクト専用の仕組みで、Salesforce内部のオブジェクト同士には使わない。"}, {"n": 41, "t": "Universal Containers (UC) は、10,000件以上の取引先レコードを持つSalesforceインスタンスを使用しています。類似しているものの完全に同一ではない取引先名と住所が存在することに気づきました。適切なデータ品質を確保するために、UCは何を行うべきですか？", "c": ["取引先の住所を標準化するサービスを使用し、ルールに基づいて取引先をマージするサードパーティツールを使用する。", "レポートを実行し、名前が同じ最初の5文字で始まる取引先を見つけ、それらの取引先をマージする。", "Salesforceで一致ルールを作成して取引先の重複排除を有効にし、重複する取引先を一括マージする。", "取引先の所有者に取引先の住所をクリーンアップさせ、同じ住所を持つ取引先をマージする。"], "a": [2], "e": ["サードパーティツールを使用することもデータクレンジングの一つの手段ですが、Salesforceには標準で高度な重複管理機能が備わっているため、まずは追加のコストや複雑なインテグレーションを必要としない標準機能を活用することがベストプラクティスとして推奨されます。", "レポートを使用して類似レコードを目視で探し出し、手動で一つずつマージする手法は、10,000件以上のデータが存在する環境においては非常に非効率的であり、持続可能なデータ品質管理の解決策とは言えません。", "正解です。Salesforceの標準機能である重複管理（一致ルールと重複ルール）を使用することで、完全一致だけでなくファジィ一致などの高度なロジックに基づいて類似する取引先レコードをシステム的に特定し、効率的に重複を管理・排除してデータ品質を向上させることができます。", "ユーザー（所有者）に対して手動でのデータクレンジングやマージ作業を依存することは、品質のばらつきや作業の未実施を招く可能性が高く、組織全体のデータ品質をシステム的に確保し維持する戦略としては不適切です。"], "note": "「類似しているが完全に同一ではない」が鍵。一致ルールには完全一致とファジィ一致（あいまい一致）があり、表記ゆれを拾えるのは後者。この語が出たら標準の重複管理で足りる。\n\n住所の品質が主題の問題では外部サービスが正解になることが多いが、この問題は重複が主題なので標準機能が答えになる。何を解こうとしているのかを読み分ける。"}, {"n": 42, "t": "NTO（Northern Trail Outlets）は、過去5年間にわたって開発された複雑なSalesforce組織を持っています。内部ユーザーは、組織内の不完全なデータや重複データなど、複数のデータ問題について不満を述べています。NTOは、データ品質基準を分析および定義するために、データアーキテクトを雇用することを決定しました。データ品質基準を定義する際に、データアーキテクトが考慮すべき3つの重要な要素は何ですか？3つ選択してください。", "c": ["データの重複に関する基準とルールを定義する", "データクレンジングのためにステージングデータベースの重要な項目を定義する", "データの適時性と一貫性を測定する", "データ移行用のETL（抽出・変換・ロード）ツールを確定する", "データの完全性と正確性を測定する"], "a": [0, 2, 4], "e": ["正解です。ユーザーが重複データについて不満を述べているため、データ品質を向上させるための直接的な対策として、重複を特定し防止するための明確な基準や一致ルール・重複ルールを定義することが不可欠です。", "ステージングデータベースでのデータクレンジングはデータ移行や統合プロセスの一部としては重要ですが、Salesforce組織全体のデータ品質基準を定義するという根本的なデータガバナンスの要素ではありません。", "正解です。データ品質を評価する上で、データが最新の状態で提供されているか（適時性）、およびシステム全体でフォーマットや意味が矛盾していないか（一貫性）の基準を設け、それを測定し管理する必要があります。", "ETLツールの選定はデータ移行やシステム統合を実行するための技術的なステップであり、データ品質の基準そのものを定義するアーキテクチャ上のタスクとは異なります。", "正解です。ユーザーが必須情報の不足について不満を述べているため、情報が不足なく入力されているか（完全性）、およびそのデータが現実の事実を正しく反映しているか（正確性）を測定するための基準を確立することが非常に重要です。"], "note": "データ品質の「ものさし」は決まった語彙がある。完全性・正確性・一貫性・適時性・一意性。この5語が選択肢に出てきたら基準の話なので正解側。\n\n一方、ステージングデータベースやETLツールは「手段」であって「基準」ではない。設問が基準の定義を求めているのか、実行の手段を求めているのかで答えが入れ替わる。同じ語が別の問題では正解になる。"}, {"n": 43, "t": "Cloud Kicksは請求書レコードをカスタムオブジェクトに保存しています。都道府県が欠落し、郵便番号のフォーマットが正しくない状態で、請求書レコードが経理部門に送信されています。データ品質を向上させるために、Cloud Kicksが実行すべき2つのアクションはどれですか？（2つ選択してください。）", "c": ["各住所項目をページレイアウト上で必須に変更する。", "すべての項目に値が入力されることを必須にするApexトリガーを作成する。", "郵便番号にREGEX演算子を使用した入力規則を活用する。", "住所項目にCONTAINS演算子を使用した入力規則を活用する。"], "a": [2, 3], "e": ["ページレイアウトでの必須化は、ユーザーインターフェースからの手動入力には有効ですが、API経由のデータ連携や自動化プロセスによる更新時には適用されません。また、単に必須にするだけでは郵便番号のフォーマットが正しいかどうかを検証できないため、今回の要件を満たすには不十分です。", "項目の入力必須化や単純なフォーマット検証のためにApexトリガーを作成することは、標準機能で対応可能な要件に対してコードを使用する過剰な開発（オーバーエンジニアリング）となります。将来的なメンテナンスの負荷も高まるため、ベストプラクティスではありません。", "正解です。REGEX（正規表現）関数を使用した入力規則を設定することで、入力された郵便番号がシステムが求める正しいフォーマット（例：特定の桁数の数字や特定の文字の並び）に完全に一致しているかを厳密に検証し、不正なデータの保存を防ぐことができます。", "正解です。入力規則内でCONTAINS関数などを活用することで、入力された都道府県などの住所項目が、あらかじめ定義された有効な値（特定の州の名前や略称など）を含んでいるかどうかを検証し、欠落や無効なデータが経理部門に送られるのを防ぐことができます。"], "note": "この問題は解答に疑問が残る。都道府県のように値が決まっているものは、入力規則で文字列を照合するのではなく、制限付き選択リストにするのが正しい設計（顧客種別の問題と同じ考え方）。ここでは与えられた4つの中で最もマシなものを選ばされているだけ。\n\n確実に押さえるべきはこちら——ページレイアウトでの必須は、画面からの入力にしか効かない。API・連携・Visualforce経由では素通りする。入力規則は経路を問わず効く。この違いは別の問題でも繰り返し問われる。"}, {"n": 44, "t": "S社は最近T社に買収されました。買収の一環として、S社のSalesforce組織(移行元)のすべてのデータをT社のSalesforce組織(移行先)に移行する必要があります。S社には600万件のケースレコードがあります。アーキテクトはデータロード時間の最適化を担当しています。この目標を達成するためにアーキテクトは何を考慮すべきですか?", "c": ["データを前処理し、zip圧縮を有効にしたSOAP APIを使用したデータローダでアップサートする。", "ケースデータをロードするためにSalesforce-to-Salesforce機能を直接活用する。", "Bulk APIの並列処理を使用して、複数のセットでデータをロードする。", "設定のデータ管理メニューからSalesforce組織移行ツールを利用する。"], "a": [0], "e": ["正解です。データをあらかじめ前処理して整理し、zip圧縮を有効にしたSOAP API対応のデータローダを使用することで、ネットワーク転送量を削減し、大量のケースレコードのアップサート処理時間を最適化できます。", "Salesforce-to-Salesforce機能は組織間での継続的なデータ共有や接続を主な目的としており、600万件に及ぶ大規模な一括データ移行やロード時間の最適化には適していません。", "ケースレコードなどの親オブジェクトへの参照を持つオブジェクトでBulk APIの並列処理を使用すると、レコードのロック競合が発生してエラーや処理遅延が引き起こされる可能性が高いため、最適な解決策とは言えません。", "Salesforceの標準設定メニューには組織移行ツールと呼ばれる機能は存在しないため、選択肢として不適切です。"], "note": "この問題は解答が弱い。数百万件規模の移行はBulk APIが定石であり、実務でSOAP APIのデータローダを選ぶことはまずない。並列処理の案がロック競合を理由に消されるため、消去法で残っているだけ。\n\n本番で同じ選択肢が出たらこの答えを選ぶのが無難だが、理屈は信用しないこと。実務での正解は「Bulk APIを直列にする」か「親IDでソートしてから並列で流す」。\n\n拾える知識は1つ。ケースは取引先への参照を持つので、親の取り合いが起きうる——つまりこの問題もロック競合の仲間である。"}, {"n": 45, "t": "NTOは、さまざまな外部システム内でバックアップするために、Salesforce組織のメタデータをプログラムによって取得したいと考えています。このタスクを達成するのに最適なAPIはどれですか？", "c": ["Metadata API", "Tooling API", "シリアルモードのBulk API", "SOAP API"], "a": [0], "e": ["正解です。Metadata APIは、Salesforce組織のカスタマイズ情報（メタデータ）を取得、デプロイ、管理するために設計されています。組織のメタデータをプログラムで外部に一括バックアップする目的に最も適しています。", "Tooling APIは、Salesforceプラットフォームのカスタム開発ツールを構築するために使用されます。特定のメタデータコンポーネントへのきめ細かいアクセスを提供しますが、組織全体のメタデータをバックアップするためのAPIとしては最適ではありません。", "シリアルモードのBulk APIは、大量のレコード（データ）を非同期でロードまたは削除するために使用されます。メタデータではなく、実際のデータ（レコード）の処理を目的としているため不適切です。", "SOAP APIは、レコードの作成、取得、更新、削除などのデータ操作に使用されます。メタデータの取得を目的としたAPIではないため、このタスクには適していません。"], "note": "「データ」と「メタデータ」の区別だけの問題。データ＝レコードの中身。メタデータ＝オブジェクトや項目、画面、コードといった設定そのもの。設定を運ぶなら Metadata API。\n\nTooling API との違いも押さえておく。Tooling API は開発ツールを作るためのもので、個々の部品に細かくアクセスする用途。組織まるごとのバックアップには向かない。"}, {"n": 46, "t": "Universal Containers (UC) は、営業組織全体にSales Cloudを導入し、顧客のプロジェクトの詳細と従業員の請求可能時間を保存する projects__c というカスタムオブジェクトを構築しました。\n以下の要件が必要です。\n・財務チームの一部のメンバーは、レポート作成と従業員の稼働状況の調整のために projects オブジェクトにアクセスする必要があります。\n・財務ユーザーは営業オブジェクトにはアクセスしませんが、カスタムオブジェクトを操作する必要があります。\nデータアーキテクトが要件を最もよく満たすために財務チームに推奨すべきライセンスの種類はどれですか？", "c": ["Service Cloud", "Sales Cloud", "Lightning Platform Starter", "Lightning Platform Plus"], "a": [3], "e": ["Service Cloudライセンスは、ケースやナレッジなどのカスタマーサービス機能および標準の営業オブジェクトにアクセスするためのライセンスです。営業オブジェクトやケースを使用しない財務ユーザーにとっては機能が過剰であり、コスト面でも適切ではありません。", "Sales Cloudライセンスは、商談やリードなどの標準営業オブジェクトを使用する営業担当者向けのライセンスです。財務ユーザーは営業オブジェクトへのアクセスを必要としないため、このライセンスを選択するのは不適切です。", "Lightning Platform Starterライセンスはカスタムオブジェクトにアクセスできますが、利用可能なカスタムオブジェクト数が1ユーザーあたり最大10個までに制限されています。業務要件や将来的な拡張性を考慮すると、より包括的なプラットフォーム機能を提供するLightning Platform Plusが適しています。", "正解です。Lightning Platform Plusライセンスは、商談やケースなどの標準営業・サービスオブジェクトへのアクセスを必要とせず、カスタムオブジェクト（最大110個まで）を中心に業務を行うユーザーに最適で最もコスト効率の高いライセンスです。財務チームの要件を正確に満たしています。"], "note": "人事アプリの問題と同じ判断。社内ユーザーが標準の営業・サービス機能を使わず、カスタムオブジェクトだけを使うなら Platform 系のライセンス。\n\nただしこの問題は人事アプリの問題と違い、カスタムオブジェクトの個数が明示されていない。それでも Starter ではなく Plus が正解とされているのは、「レポート作成」や将来の拡張を含めた機能の幅で判断しているため。個数が書かれていない場合は、要件の広さで選ぶ。"}, {"n": 47, "t": "大手自動車メーカーがSalesforceをCRMとして使用することを決定しました。CRMで以下のディーラー種別を維持する必要があります：\n・ローカルディーラー\n・リージョナルディストリビューター\n・ステートディストリビューター\n・サービスディーラー\n属性は顧客種別ごとに異なります。CRMユーザーは顧客種別に関連する属性のみを入力できるようにする必要があります。各顧客種別のプロセスとビジネスルールは異なる場合があります。Salesforceでさまざまなディーラーをどのように維持すべきですか？", "c": ["ディーラーに取引先を使用し、各ディーラー種別のレコードタイプを作成する。", "ディーラーを取引先として作成し、各ディーラー種別のカスタムビューを構築する。", "ディーラーに取引先を使用し、各ディーラー種別のカスタム選択リスト項目を使用する。", "各ディーラー種別のカスタムオブジェクトとディーラー属性のカスタム項目を作成する。"], "a": [0], "e": ["正解です。レコードタイプを使用することで、ディーラー種別ごとに異なるページレイアウトを割り当ててユーザーが入力できる項目を制御できます。また、種別ごとに異なるビジネスプロセスやビジネスルールを個別に適用することが可能になります。", "カスタムビュー（リストビュー）は条件に基づいてレコードを絞り込んで表示するための機能です。これを使用して特定の項目入力を制限したり、固有のビジネスプロセスやビジネスルールを適用したりすることはできません。", "選択リスト項目を作成してディーラー種別を識別することは可能ですが、それだけでは種別ごとに異なるページレイアウトを割り当てて入力項目を制御したり、別々のビジネスプロセスを適用したりするという要件を満たすことはできません。", "すべてのディーラーは基本的に「取引先（企業）」という共通の概念を持ちます。種別ごとに個別のカスタムオブジェクトを作成すると、データモデルが不必要に複雑になり、将来的な保守や横断的なレポート作成が非常に困難になるため、適切なアーキテクチャではありません。"], "note": "レコードタイプは「同じオブジェクトの中で、種類ごとに見せ方と進め方を変える」ための機能。この問題では要件が2つあり、どちらもレコードタイプでないと満たせない。①種別ごとに入力できる項目が違う（ページレイアウトの割り当て）②種別ごとにプロセスとルールが違う。\n\n選択リストとの違いが分かれ目。選択リストは「どの種類か」を記録するだけで、画面も処理も変わらない。種類によって見た目や流れが変わるならレコードタイプ。"}, {"n": 48, "t": "NTOは現在のSalesforce組織の規模を拡大し、まもなく新しい組織に移行する予定です。このプロセスの一環として、NTOはすべてのメタデータとデータを移行します。ソース組織におけるNTOのデータモデルは、オブジェクト間に複数の主従関係および参照関係を持つ複雑なリレーション階層を持っており、これはターゲット組織でも維持される必要があります。移行中にリレーション階層を維持するために、データアーキテクトが実行すべき3つのことは何ですか？3つ選択してください。", "c": ["データローダを使用してソース組織からデータをエクスポートし、ターゲット組織に順番にインポートまたはUpsertする。", "ターゲット組織の各オブジェクトに外部ID項目を作成し、ソースレコードのIDをこの項目にマッピングする。", "ターゲット組織で、主従関係項目を参照関係項目として再定義する。", "インポートファイル内のソースレコードIDを、ターゲット組織の新しいレコードIDに置き換える。", "インポートファイル内のリレーション項目には、ソースレコードIDを入力したままにする。"], "a": [0, 1, 3], "e": ["正解です。複雑なリレーション階層を持つデータを移行する場合、親オブジェクトのレコードを先に作成し、その後に子オブジェクトのレコードを作成するというように、データモデルの階層順序（シーケンシャル）に従ってデータをロードする必要があります。", "正解です。ターゲット組織に外部ID項目を作成し、ソース組織の元のSalesforce ID（またはその他の一意の識別子）を保持することで、データローダのUpsert機能を使用してレコード間のリレーションを簡単に再構築できるようになります。", "元の組織で設定されていた主従関係を参照関係に変更することは、セキュリティ、レコードの所有権、積み上げ集計項目などのビジネスロジックや要件を破壊することになるため、移行時の対応として適切ではありません。", "正解です。外部IDを使用したUpsertを行わずに標準のInsert操作を使用する場合、親レコードをインポートした後に生成されるターゲット組織の新しいSalesforce IDを取得し、ExcelのVLOOKUPなどを使用して子レコードのインポートファイル内の参照IDを新しいIDに置き換えてからロードする必要があります。", "ソース組織のSalesforce IDはターゲット組織では存在しない無効なIDとなります。リレーション項目（参照や主従関係）に存在しないIDをそのまま挿入してデータロードを行うと、エラーが発生してインポートに失敗します。"], "note": "組織をまたぐ移行の核心は1つ。Salesforce の ID は組織ごとに違うので、移行元のIDはそのままでは使えない。関係を復元する方法は2通りあり、この問題は両方を正解に含めている。①移行元のIDを外部ID項目に入れておき、Upsert で自動的に紐付ける（推奨）②親を入れた後に新しいIDを取得し、子のファイルのIDを置き換えてから入れる（手作業に近い）。\n\n実務では①だけで足りる。試験では「3つ選べ」なので両方が並ぶ。\n\nあわせて、親→子の順にロードする、という順番の原則もここで問われている。"}, {"n": 49, "t": "Universal Containers (UC) はオンプレミスの自社開発カスタマーリレーションシップマネジメント (CRM) システムから移行しようとしています。分析中、UCのユーザーは多くの顧客に対して複数のバージョンが存在することが課題であると指摘しました。この課題を軽減し、移行を成功させるために、データアーキテクトは何を行うべきですか？", "c": ["インターンを雇用し、Salesforceへの移行後にレコードの重複を手動で解消する。", "データをそのまま移行し、Salesforceの重複排除機能を使用する。", "移行前に、ユーザーに旧システム内のデータを手動でクレンジングさせる。", "ステージングデータベースにデータを保存し、同一レコードの重複を排除する。"], "a": [3], "e": ["Salesforceへの移行後に大量のレコードを手動で重複排除することは、人為的エラーのリスクが高く、膨大な時間とコストがかかります。未整理の不完全なデータを本番組織にロードすることは避けるべきです。", "Salesforceの標準重複管理機能は、主に運用中の新規入力防止や少数のレコードマッチングに適しています。移行時における大規模な既存データの重複クレンジング手段としては処理限界や機能面で不十分です。", "業務を行っているエンドユーザーに旧システム上での手動データクレンジングを依存すると、多大な業務負荷がかかるうえ、一貫したルールに基づく重複排除を行うことが困難です。", "正解です。移行前の段階でデータを別個のステージング環境（中間データベース）に抽出し、専用のツールやバッチ処理で一括してクレンジングおよび重複排除を行ってからSalesforceにインポートするのがデータ移行のベストプラクティスです。"], "note": "移行と運用で答えが変わる。移行のときは「入れる前に外で洗う」＝ステージングデータベース。運用中の入力を止めるのが一致ルールと重複ルール。この問題は移行なので前者。\n\n汚れたデータをとりあえず入れて、Salesforceの機能で後から直す、という案は常に不正解。本番組織に汚れたものを入れない、が原則。"}, {"n": 50, "t": "ある消費財企業が、コンタクトセンターにSalesforceを使用することを決定しました。コンタクトセンターのエージェントは、顧客が連絡してきた際に、サービスコンソールで以下の情報にアクセスする必要があります：\n1. オンプレミスシステムに保存されているWebサイト上での顧客のブラウジングアクティビティ\n2. Salesforceで管理されている小売店での営業担当者との顧客のやり取り\n3. Salesforceで管理されているコンタクトセンターでのやり取り\n4. マーケティングシステムからの顧客へのメールキャンペーンアクティビティ\nSalesforceでの開発工数を最小限に抑えつつ、これらの要件を満たすためにデータアーキテクトは何をすべきでしょうか？", "c": ["サービスコンソールにWebタブを作成し、Webサイトとマーケティングのアクティビティを表示する。", "サービスコンソールにカスタムコンポーネントを構築し、マーケティング情報とWebサイトの情報を取り込む。", "Salesforce Connectを使用し、外部オブジェクトを用いてWebサイトとマーケティングシステムをサービスコンソールに統合する。", "サービスコンソールに顧客ビューを構築し、Webサイトのデータとマーケティングデータをマッシュアップとして表示するコンポーネントを含める。"], "a": [3], "e": ["Webタブは特定のURL全体を表示するためには機能しますが、画面上で開いている特定の顧客レコード（コンテキスト）に連動して動的に外部データを抽出・表示させる用途には適しておらず、要件を十分に満たすことができません。", "カスタムコンポーネントを一から構築して外部システムのデータを取り込むアプローチは、API連携などのコーディング作業が必要になるため、開発工数を最小限に抑えるという要件には合致しません。", "Salesforce Connectはデータ統合において非常に優れた機能ですが、外部システム側でのODataプロバイダの準備やカスタムアダプタの開発が必要になる場合があります。データを表示させるだけであれば、最小限の開発工数で行うアプローチとしては作業規模が大きくなります。", "正解です。UIレベルでのマッシュアップ（キャンバスアプリケーションや画面統合など）を活用することで、外部システムにデータを持たせたまま、Salesforce内にデータを複製することなくコンソール上で情報を提供できます。これにより開発工数を最小限に抑えつつ、すべての情報へのアクセス要件を満たすことができます。"], "note": "外部データの問題の中で、この問題だけ答えがマッシュアップになる。決め手は問題文の「開発工数を最小限に抑えつつ」という一文で、これは飾りではなく答えを決める条件。\n\n使い分けの基準——Salesforceのレコードとして扱う必要があれば（検索・レポート・関連付け）Salesforce Connect ＋ 外部オブジェクト。画面で見られればよく、工数の制約があるならマッシュアップ。マッシュアップは相手の画面をそのまま埋め込むので、Salesforce側では一切扱えない代わりに最も軽い。"}, {"n": 51, "t": "Universal Containers (UC) は、営業担当者が重複する顧客の取引先、取引先責任者、およびリードを作成してしまうというデータ品質の問題に直面しています。UCは、Salesforceに存在する可能性のあるレコードについてユーザーにプロンプトを表示することで、この問題を直ちに修正したいと考えています。UCは、重複レコードに関するレポートを求めています。UCがすぐに開始できるようにするための推奨されるアプローチは何ですか？", "c": ["取引先、取引先責任者、およびリードに after insert および update トリガを作成し、カスタムの一致基準を使用して重複が見つかった場合にエラーを送信する。", "取引先、リード、および取引先責任者の重複ルールを作成し、これらのオブジェクトの標準の一致ルールを使用し、作成と編集の両方のアクションをレポートおよびアラートに設定する。", "取引先、リード、および取引先責任者の重複ルールを作成し、これらのオブジェクトの標準の一致ルールを使用し、作成と編集の両方のアクションをブロックに設定する。", "取引先、取引先責任者、およびリードに before insert および update トリガを作成し、カスタムの一致基準を使用して重複が見つかった場合にエラーを送信する。"], "a": [1], "e": ["Apexトリガによるカスタム開発は時間とリソースがかかるため、「直ちに修正したい」「すぐに開始したい」という要件に適していません。また、エラーを送信して保存をブロックする場合はafterではなくbeforeトリガを使用するのが一般的であり、どちらにしてもユーザーへの警告プロンプト表示やレポート機能の提供という要件を満たしません。", "正解です。Salesforceの標準機能である重複ルールと標準の一致ルールを使用することで、コードを記述することなく直ちに設定できます。アクションを「アラート」に設定することでユーザーに警告プロンプトを表示し、「レポート」に設定することで重複レコードのレポートを作成できるため、すべての要件を完全に満たします。", "標準の重複ルールを使用する点は正しいですが、アクションを「ブロック」に設定すると、重複の可能性があるレコードの保存を完全に拒否してしまいます。要件は「ユーザーにプロンプトを表示する（アラート）」ことであり、保存をブロックすることではないため不適切です。", "beforeトリガを使用して重複を防ぐことは技術的に可能ですが、トリガを使うもう一方の案と同様に開発工数がかかるため「すぐに開始する」という目的に反します。さらに、エラーを送信してブロックするのではなく、ユーザーへのアラート表示とレポートの作成が求められているため要件を満たしません。"], "note": "この問題の分かれ目は、アラートかブロックか。要件は「ユーザーにプロンプトを表示」と「重複のレポートがほしい」なので、アクションはアラートとレポート。ブロックではない。\n\n原則として、問題文に「作成させるな」「止めろ」と書いていなければ、止める選択肢は選ばない。止めるのは強い対応で、要件が明示していない限り過剰になる。\n\n重複ルールのアクションは、アラート（警告して続行可）／レポート（記録する）／ブロック（保存させない）の3つ。それぞれを要件の言葉に対応させて覚える。"}, {"n": 52, "t": "UCは10年間Salesforceを使用しています。最近、ユーザーは顧客と取引先のリストビューを表示する際にページの読み込みが遅いことに気づきました。これを軽減するために、UCはアクティブに読み込まれるデータ量を減らすためのデータアーカイブ戦略を実装します。この戦略を定義するために必要な2つのタスクはどれですか？2つ選択してください。", "c": ["目標復旧時点を特定する。", "アーカイブデータがどのようにアクセスされ、使用されるかを特定する。", "目標復旧時間を特定する。", "データ保持要件を特定する。"], "a": [1, 3], "e": ["目標復旧時点(RPO)は、障害発生時にどの過去の時点までデータを復旧させる必要があるかという、バックアップや災害復旧計画を策定する際の指標です。システムパフォーマンスを向上させるためのアーカイブ戦略を定義するためのタスクではありません。", "正解です。データをアーカイブした後でも、コンプライアンス監査や過去の履歴参照などのためにデータへのアクセスが必要になる場合があります。そのため、アーカイブされたデータがどのような頻度で、誰によって、どのように検索および参照されるかを事前に特定しておくことは、適切なアーカイブソリューションを選択するための重要なタスクです。", "目標復旧時間(RTO)は、システム障害が発生してからビジネスプロセスを復旧させるまでの許容最大時間を指す災害復旧の指標です。データアーカイブ戦略の定義とは直接関係がありません。", "正解です。アーカイブ戦略を構築する際には、社内ポリシーや法的コンプライアンスに基づいて、データを本番環境にどれくらいの期間保持し、いつアーカイブに移行するか、そしてアーカイブデータ自体を最終的にいつ破棄するかというデータ保持要件を明確に定義することが不可欠です。"], "note": "RPO（目標復旧時点）とRTO（目標復旧時間）は災害復旧の用語で、アーカイブ設計の用語ではない。アーカイブの問題にこの2語が出てきたら、それは不正解の選択肢と判断してよい。この見分けだけで2つ消える。\n\nアーカイブ設計で決めるべきは2つ。どれだけ残すか（保持要件）と、出したあとどう読むか（アクセス方法）。後者を決めないと、出し先を Big Object にするか外部にするかが決まらない。"}, {"n": 53, "t": "NTOはブランドのフランチャイズ化を決定しました。導入後、1,000のフランチャイズ加盟店はポータルを通じてNTOの製品情報にアクセスし、大口顧客の売上や商談を追跡できるようになります。また、フランチャイズ加盟店は月次および四半期ごとの売上レポートと予測を実行し、ダッシュボードでレポートを表示することもできるようになります。NTOがこれらの機能をフランチャイズ加盟店に提供するために必要なライセンスはどれですか？", "c": ["Salesforce Sales Cloudライセンス", "Lightning Platformライセンス", "Customer Communityライセンス", "Partner Communityライセンス"], "a": [3], "e": ["Sales Cloudライセンスは社内ユーザー向けのフル機能ライセンスです。1,000の外部フランチャイズ加盟店ユーザー全員に社内用ライセンスを割り当てるのはコスト効率が悪く、ポータルを通じた外部パートナー連携というユースケースには適していません。", "Lightning Platformライセンスは社内ユーザー向けのカスタムアプリケーション構築用ライセンスであり、標準の商談オブジェクトへのアクセス権は含まれていません。また、外部ポータルユーザー向けのライセンスでもありません。", "Customer Communityライセンスは主にB2Cの顧客向けポータルを対象としており、サポート情報へのアクセスやケース管理が主な用途です。商談オブジェクトへのアクセスや高度なレポートおよびダッシュボード機能はサポートされていません。", "正解です。Partner Communityライセンスは、代理店やフランチャイズなどのビジネスパートナー向けに設計されており、リードや商談などのSalesforceの標準営業オブジェクトへのアクセスや、レポートおよびダッシュボードの表示・作成機能を提供します。そのため、今回の要件をすべて満たす最適なライセンスです。"], "note": "外部ユーザー向けライセンスの分かれ目は「商談を触るか」。商談・リードを扱い、レポートやダッシュボードを使うのはパートナー向け。ケースやナレッジだけなら顧客向け。問題文に商談が出てきたら Partner Community。\n\nなお「コミュニティ」は現在 Experience Cloud に改称されている。ライセンスの考え方は変わっていない。"}, {"n": 54, "t": "データアーキテクトは大規模なB2C小売業者と協力しており、Salesforceで消費者の取引先構造をモデル化する必要があります。このシナリオでは、どの標準機能を選択するべきでしょうか？", "c": ["個別取引先", "取引先 取引先責任者", "取引先責任者", "個人取引先"], "a": [3], "e": ["個別取引先という標準の取引先モデルはSalesforceに存在しません。個人（Individual）オブジェクトというデータプライバシーと同意を管理する標準オブジェクトはありますが、消費者自体を取引先としてモデル化するための機能ではありません。", "取引先とそれに属する取引先責任者を分ける標準的な構成はB2B（企業間取引）モデル向けに設計されています。1人の消費者を管理するために取引先と取引先責任者を別々に作成・管理することは、B2Cのシナリオにおいてデータモデルを複雑にするため最適ではありません。", "取引先責任者オブジェクトは通常、親となる取引先レコードに紐づく形で使用されます。取引先責任者単体では商談などの他の標準機能とシームレスに連携させることが難しいため、消費者構造全体をモデル化するには不十分です。", "正解です。個人取引先（Person Accounts）は、企業ではなく個人の消費者と直接取引を行うB2Cモデル向けに設計されたSalesforceの標準機能です。取引先と取引先責任者の項目を1つのレコードに統合して保持できるため、このシナリオに最も適しています。"], "note": "B2Cと書いてあれば個人取引先、で取れる。実質的に用語を知っているかだけの問題。\n\n「個別取引先」という紛らわしい選択肢が置かれているが、そのような機能は存在しない。似た名前の Individual（個人）オブジェクトは同意管理のためのもので、顧客モデルではない。この区別は同意フォームの問題とセットで覚える。"}, {"n": 55, "t": "Universal Containers (UC) は、主要な営業自動化ツールとしてSalesforceを採用しました。UCには100,000人の顧客がおり、年間成長率は10%です。UCは、月次請求サイクルをサポートし年間100万件以上の請求書を生成するオンプレミスのウェブベースの請求および請求書システムを使用しています。UCの営業チームは、Salesforceの外部にナビゲートすることなく、顧客レコードを取得し、取引先のステータス、請求書の履歴、および商談を表示できる必要があります。営業チームに必要な機能を提供するために、データアーキテクトは何を使用するべきでしょうか？", "c": ["カスタムオブジェクトを作成し、過去12か月分の請求書データをSalesforceに移行して、取引先のレイアウトに表示できるようにする。", "Apexコールアウトを記述し、取引先レコードに表示する関連リストに入力する。", "Salesforce内で請求システムレコードを提示するマッシュアップページを作成する。", "請求システムをiframe内にカプセル化したVisualforceタブを作成する。"], "a": [2], "e": ["年間100万件以上の大量の請求書データをSalesforce内に保存することは、データストレージを大量に消費し、データの冗長性を生むため、単に外部システムのデータを表示したいという要件には最適なアプローチではありません。", "Apexコールアウトを使用して外部システムからデータを取得することは可能ですが、大量のデータをリアルタイムで取得して関連リストとして描画する処理は、コールアウトの制限やパフォーマンスの低下を引き起こす可能性があり、スケーラブルな解決策とは言えません。", "正解です。マッシュアップ(キャンバスアプリなどを利用して外部WebアプリケーションのUIを埋め込む技術)を使用することで、Salesforce内に大量のデータを保存することなく、営業担当者が取引先レコードのコンテキスト内で請求システムのデータを直接閲覧できるようになります。これにより、データ容量を消費せずに要件を効率的に満たすことができます。", "Visualforceタブを使用して独立した画面としてiframeを表示することは可能ですが、特定の取引先レコードのコンテキストに合わせて請求書履歴を表示するという要件には適していません。取引先画面内に組み込まれたマッシュアップページの方が適切です。"], "note": "マッシュアップが答えになるもう1問。要件は「Salesforceの外に出ずに見られること」だけで、レポートや検索の要求がない。見るだけならマッシュアップで足りる。\n\nここで押さえたいのは、同じマッシュアップでも「どこに埋め込むか」が問われていること。タブとして独立した画面を出すと、いま開いている取引先と連動しない。レコードの画面の中に組み込んで、その顧客の情報を出す必要がある。選択肢の差はそこだけ。"}, {"n": 56, "t": "Universal ContainerはSalesforceを導入中であり、2つのレガシーシステムからデータを移行する必要があります。UCはSalesforceに移行する前に、データをクレンジングして重複を排除したいと考えています。クリーンな移行を実現するために、データアーキテクトはどのソリューションを推奨すべきですか？", "c": ["オブジェクトの外部IDを定義し、2番目のデータベースを1番目のデータベースに移行して、Salesforceに読み込む。", "Salesforceで重複ルールを定義し、両方のデータベースからSalesforceにデータを読み込む。", "ステージングデータベースを設定し、外部IDを定義してマージし、重複データをクレンジングしてから、Salesforceに読み込む。", "オブジェクトの外部IDを定義し、1つのデータベースからデータを挿入して、2番目のデータベースにはupsertを使用する。"], "a": [2], "e": ["一方のレガシーシステムをもう一方のシステムに直接統合しようとすると、稼働中の既存システムに予期せぬ影響を与えるリスクがあります。また、データ移行に特化した環境ではないため、クレンジングや重複排除の処理を適切に行うことが困難です。", "Salesforceの重複ルールは個別レコードの入力時などの重複検知には有効ですが、複数のシステムからの大規模な初期データ移行時に重複ルールに依存すると、大量のエラーで読み込み処理が失敗したり、パフォーマンスが著しく低下したりする原因となります。クレンジングはSalesforceへの読み込み前に行う必要があります。", "正解です。複数のソースからデータを移行する場合、Salesforceの外部にステージングデータベース（中間データベース）を構築し、そこで外部IDを使用したマージ、データの標準化、重複排除などのクレンジング処理をすべて完了させてからSalesforceに読み込むのが、最も安全かつ確実なベストプラクティスです。", "upsert機能を使用することでSalesforce上での重複作成をある程度防ぐことはできますが、データ自体のクレンジング（表記ゆれの修正や不完全なデータの補完など）を事前に評価して整えるプロセスが含まれていません。"], "note": "2つのシステムから持ち込む場合は、どちらかに寄せるのではなく、第三の場所（ステージングデータベース）で突き合わせる。稼働中のシステムを移行先にすると、本来の業務に影響が出る。\n\nUpsert で重複を防ぐ案が不正解になる理由も押さえる。Upsert が防げるのは「同じ外部IDのものを二重に作る」ことだけで、表記ゆれで別物に見えているものは素通りする。クレンジングとは別の機能である。"}, {"n": 57, "t": "Northern Trail Outfitters (NTO) は、Salesforceデータのバックアップと復元を実装したいと考えています。現在、週に1回実行されるデータバックアッププロセスがあり、すべてのSalesforceデータをエンタープライズデータウェアハウス (EDW) にバックアップしています。NTOは、障害発生時のデータ損失を回避するために、日次バックアップに移行し、復元機能を提供したいと考えています。日次のバックアップと復元ソリューションについて、データアーキテクトは何を推奨するべきでしょうか？", "c": ["バックアップと復元にAppExchangeパッケージを使用する。", "EDWからのバックアップと復元にETLを使用する。", "Bulk APIを使用して日次でEDWにデータを抽出し、復元にはREST APIを使用する。", "週次のバックアッププロセスを日次バックアップに変更し、カスタムの復元ソリューションを実装する。"], "a": [0], "e": ["正解です。Salesforceエコシステムには、データのバックアップと復元に特化した堅牢なAppExchangeソリューションが多数存在します。これらは日次（またはより頻繁な）バックアップや、リレーションシップを維持したままの細粒度な復元機能を標準で提供しています。カスタム開発や継続的なメンテナンスのコストをかけることなく、迅速かつ安全に要件を満たすことができるベストプラクティスです。", "ETLツールを使用してEDWにデータをバックアップすることは可能ですが、Salesforceへのデータ復元（特に親子のリレーションなどの複雑なデータモデルの復元）をETLのみで完全に構築・管理することは非常に困難であり、復元時のエラーリスクが高まります。", "Bulk APIでの抽出とREST APIでの復元を組み合わせるアプローチは、ゼロからカスタムソリューションを構築することを意味します。レコードIDや関連する参照関係を維持したまま正確にデータを復元するロジックを自前で開発・維持するのは非常に工数がかかり、推奨されません。", "カスタムの復元ソリューションを実装することは、開発コストと技術的負債を大幅に増加させます。障害発生時に確実かつ迅速にデータを復旧させるためには、自社開発のカスタムソリューションよりも、すでに実績のあるAppExchangeパッケージを利用する方がはるかに安全で効率的です。"], "note": "バックアップで覚える核心は1つ。「取り出すこと」と「戻すこと」はまったく難易度が違う。データを抜くのは簡単だが、親子の関係とIDを保ったまま戻すのは非常に難しい。だから自前で作る案はすべて不正解になる。\n\n現在は Salesforce 純正の Backup & Restore も提供されているので、AppExchange一択という前提は古い。考え方（復元機能を持つ既成の仕組みを使う）は変わらない。"}, {"n": 58, "t": "Universal Containers (UC) はSalesforceで車両(Vehicle__c)とサービス履歴(Service-History__c)を管理しています。車両とサービス履歴は、参照関係を通じて関連付けられたカスタムオブジェクトです。毎週、バッチ同期プロセスによってSalesforce内の車両とサービス履歴のレコードが更新されます。UCには毎週2時間の移行ウィンドウがありますが、データ移行プロセスの一環としてロックの問題に直面しています。データアーキテクトは、データ移行のパフォーマンスに影響を与えることなくロックの問題を回避するために何を推奨するべきですか？", "c": ["データ移行にBulk APIの並列モードを使用する。", "データ移行にBulk APIの直列モードを使用する。", "注文を別のカスタムオブジェクトに挿入し、Batch Apexを使用してService_Order__cオブジェクトにレコードを移動する。", "参照レコードが削除されたときの参照構成を「この項目の値をクリアする」に変更する。"], "a": [1], "e": ["Bulk APIの並列モードは処理速度が速いですが、関連するレコード（この場合は参照関係にある車両とサービス履歴）を同時に更新・挿入しようとした場合、親レコードのロック競合（行ロックエラー）が発生しやすくなります。現在直面しているロックの問題を悪化させる原因となるため不適切です。", "正解です。Bulk APIの直列（シリアル）モードを使用すると、バッチが1つずつ順番に処理されるため、同じ親レコードに対する同時更新によるロックの競合を効果的に防ぐことができます。並列処理よりも全体の処理時間は延びる可能性がありますが、ロックエラーを回避しつつ、限られた移行ウィンドウ内で安定してデータを処理するための標準的なベストプラクティスです。", "中間オブジェクトを作成してBatch Apexで処理する方法は、システム構造を不必要に複雑にします。また、別のプロセスを挟むことでデータ移行のパフォーマンスに悪影響を及ぼすため、要件を満たしていません。", "参照関係の削除時の動作設定（項目の値をクリアする）は、親レコードが削除された場合の子レコードの挙動を制御するものです。大量データの同期や移行中に発生するレコードロックの競合問題を解決するものではありません。"], "note": "ここで直列が正解になる理由を、他の問題と比べて理解しておく。取引先70万件の問題では並列が正解、取引先の子の注文の問題では親IDでソートが正解だった。この問題で直列になるのは、①毎週のバッチ同期なので自分でファイルを並べ替える前提が置かれていない ②2時間という枠の中で確実に終わらせたい、の2つによる。\n\n選択肢にソートが無い時点で、残る対策は直列しかない。与えられた選択肢の範囲で考えるのも試験の技術。\n\nなお参照関係でもロックは起きる。主従関係だけの問題ではない。"}, {"n": 59, "t": "Universal Containers (UC) は、顧客がUCの新しいサポートサービスを購入した場合に、Gold、Silver、またはBronzeのカテゴリに割り当てられる新しい顧客カテゴリ分類プロセスを導入しています。顧客は3つのカテゴリすべてに均等に分布することが予想されています。現在、UCには約50万の顧客がおり、今後5年間、未分類の既存顧客の1%が毎月UCの新しいサポートサービスを購入すると見込んでいます。上記の要件を念頭に置き、長期的なパフォーマンスを確保するための推奨されるソリューションは何ですか？", "c": ["Gold、Silver、Bronzeの値を持つ新しいグローバル選択リストのカスタム項目を実装し、それを取引先で有効にする。", "取引先オブジェクトに、Gold、Silver、Bronzeの値を持つ新しい選択リストのカスタム項目を実装する。", "新しいカテゴリカスタムオブジェクトを実装し、取引先からカテゴリへの主従関係を作成する。", "新しいカテゴリカスタムオブジェクトを実装し、取引先からカテゴリへの参照項目を作成する。"], "a": [1], "e": ["グローバル選択リストは、複数の異なるオブジェクト間で同じ選択リスト値を一元管理・共有する場合に役立ちます。このシナリオでは取引先オブジェクトでのみこのカテゴリ分類が必要とされているため、グローバル選択リストを作成することは要件に対して過剰な設定となります。", "正解です。選択リスト項目を使用することで、親レコード（カテゴリ）に大量の子レコード（取引先）が紐づくことで発生する「データスキュー」の問題を完全に回避できます。50万件のデータがあり今後も増加する環境において、パフォーマンスへの影響を防ぐ最もシンプルかつ最適なソリューションです。", "3つのカテゴリレコード（Gold、Silver、Bronze）を親として50万件の取引先を主従関係で紐づけた場合、1つの親レコードに10,000件以上の子レコードが集中することになります。これにより深刻なデータスキューが発生し、レコード保存時のロックエラーやパフォーマンスの大幅な低下を引き起こすため不適切です。", "参照項目を使用した場合でも、少数の親レコードに対して大量の取引先が紐づく構造になるため「参照スキュー」が発生します。主従関係と同様に、レコードのロック競合などシステムパフォーマンス低下の直接的な原因となるため推奨されません。"], "note": "スキューの問題として最もよくできている1問。値が3つしかない分類を、カスタムオブジェクトへの参照や主従で作ると、3件の親に50万件がぶら下がる。1つの親に1万件を超えると偏りとみなされる、という目安に照らせば一発でアウト。\n\n判断の型——値が少数で固定なら選択リスト。リレーションにしない。\n\nグローバル選択リストが不正解なのは性能ではなく過剰設計が理由。複数のオブジェクトで同じ値を共有するときに使うもので、1つのオブジェクトだけなら通常の選択リストで足りる。"}, {"n": 60, "t": "UCはSales Cloudの導入準備をしており、子レコードの商談へのアクセス権を持つユーザーが、その親である取引先レコードに対して読み取り専用アクセス権を持つようにしたいと考えています。データアーキテクトは、オブジェクト間のこの共有要件をどのように実装するべきでしょうか？", "c": ["条件に基づく共有ルールを作成する。", "暗黙的な共有により、標準機能で自動的に処理される。", "取引先チームに適切なユーザーを追加する。", "所有者に基づく共有ルールを作成する。"], "a": [1], "e": ["条件に基づく共有ルールは、特定の項目条件を満たすレコードを指定したユーザーグループに共有するために使用されます。今回のような「子レコード（商談）へのアクセス権の有無に基づいて親レコード（取引先）のアクセス権を付与する」という動的な親子関係の要件を満たすための機能ではありません。", "正解です。Salesforceには「暗黙的な共有（Implicit Sharing）」という標準機能が組み込まれており、ユーザーが子レコード（商談、ケース、取引先責任者など）へのアクセス権を持つ場合、システムは自動的にその親レコード（取引先）への読み取り専用アクセス権を付与します。したがって、この要件を満たすための追加の設定や開発は不要です。", "取引先チームを使用すると取引先へのアクセス権を柔軟に拡張できますが、商談へのアクセス権が付与されるたびに手動または自動化ツールで取引先チームを更新する必要が生じます。標準機能がすでに自動で処理していることをわざわざ再構築することになるため、適切なアプローチではありません。", "所有者に基づく共有ルールは、特定のユーザーまたはグループが所有するレコードを他のユーザーに共有するための機能です。子レコードのアクセス状態を基準にして、親レコードへのアクセス権を自動的に制御する目的には使用できません。"], "note": "暗黙的な共有は「設定していないのにそうなっている」標準の挙動で、しかも消せない。商談・ケース・取引先責任者を見られる人は、その親の取引先も読み取りだけ見られる。\n\n試験では「追加の設定は不要」が答えになる形で出る。何かを作る選択肢ばかり並んでいる中に「標準で処理される」が混ざっていたら、それを疑う。\n\n実務では逆向きに効くことがある。取引先を隠したつもりなのに商談経由で見えてしまう、という現象の正体がこれ。"}, {"n": 61, "t": "NTOは、地理的な地域 (AMER、EMEA、APAC) に基づく複数のSalesforce組織を持っています。NTOの製品はAMER組織にあり、製品が承認された後にEMEAおよびAPAC組織で作成される必要があります。データアーキテクトは、Salesforce組織間でレコードを共有するために、どの2つの機能を推奨するべきですか？2つ選択してください。", "c": ["変更データキャプチャ (CDC)", "Salesforce Connect", "フェデレーション検索", "Salesforce to Salesforce"], "a": [0, 3], "e": ["正解です。変更データキャプチャは、Salesforceのレコードの変更（作成、更新、削除、復元）をリアルタイムで公開するイベント駆動型の機能です。AMER組織で製品レコードが承認された（更新された）ことをトリガーにしてイベントを発行し、EMEAやAPACの組織がそれをサブスクライブして自組織内に製品レコードを作成するという自動化プロセスを構築するのに非常に適しています。", "Salesforce Connectは、外部システム（他のSalesforce組織を含む）のデータをSalesforce内に物理的にコピーすることなく、外部オブジェクトとしてリアルタイムに参照および表示するため
