の機能です。今回の要件である「EMEAおよびAPACで製品を作成する（レコードを物理的にコピー・同期する）」という目的には適していません。", "フェデレーション検索は、Salesforceのグローバル検索を使用して、外部の検索エンジンやドキュメントリポジトリ内のデータを一度に検索して結果を表示する機能です。組織間のデータ同期やレコードの作成を行うための機能ではないため、この要件には該当しません。", "正解です。Salesforce to Salesforceは、複数のSalesforce組織間でレコードを直接共有し、データを同期するためのネイティブな機能です。AMER組織から特定の条件（承認済みなど）を満たした製品レコードを他の組織に公開し、EMEAおよびAPAC組織でそれを受け入れてレコードを作成・同期するために使用できる有効なソリューションです。"], "note": "分かれ目は「相手の組織にレコードを作るのか、見るだけか」。この問題は「EMEAとAPACで作成される必要がある」と書いてあるので、実体をコピーする手段が答えになる。だから Salesforce Connect は外れる。\n\n他組織を読むだけでよい問題では、逆に Salesforce Connect のクロス組織アダプタが正解になる。同じ「組織をまたぐ」でも要件が違えば答えが入れ替わるので、動詞を読む。\n\n変更データキャプチャは「変わったことを相手に知らせる」仕組みで、相手が聞きに来るポーリングを不要にする。"}, {"n": 62, "t": "Salesforceの顧客は十分なデータストレージを持っています。営業担当者は、検索するともはや関連性のない古いレコードが返ってくると不満を漏らしています。営業マネージャーは、履歴レポートのためにそのデータを必要としています。営業担当者のユーザーエクスペリエンスを向上させるために、データアーキテクトはどのような戦略を使用するべきでしょうか？", "c": ["営業担当者から古いデータを隠すために権限セットを作成する。", "Batch Apexを使用して、毎晩ローリングベースで古いデータをアーカイブする。", "毎月、Salesforceから古いデータをアーカイブしてパージする。", "データアクセスを非公開に設定して、営業担当者から古いデータを隠す。"], "a": [2], "e": ["権限セットはユーザーにアクセス権や権限を付与するための機能であり、レコードへのアクセスを隠す、または制限するためには使用できないため不適切です。", "Batch Apexを利用したアーカイブ処理自体は可能ですが、毎晩カスタムコードをローリングベースで実行し続けるのはシステムのオーバーヘッドを増大させます。Salesforceでのアーカイブ戦略としては、月次などで定期的に外部のデータウェアハウス等へ移行する方が一般的であり、メンテナンス性も高くなります。", "正解です。古いデータをSalesforceから外部システム(データウェアハウスなど)に毎月アーカイブし、その後Salesforce上からパージ（削除）することで、営業担当者の検索結果に古い情報が表示されなくなります。また、営業マネージャーはアーカイブ先の外部システムを利用することで、引き続き履歴レポートを作成することが可能となり、両者の要件を満たすことができます。", "組織の共有設定などを非公開に変更すると、古いレコードだけでなく現在必要なレコードへのアクセスにも影響を及ぼす可能性があります。また、営業担当者自身が所有する古いレコードであれば非公開にしても検索結果に表示され続けるため、要件を満たす根本的な解決策にはなりません。"], "note": "この問題の面白いところは「ストレージは足りている」と明記されていること。つまり容量の問題ではなく、検索結果が汚れているという使い勝手の問題。それでも答えがアーカイブになるのは、古いものを組織から出すのが唯一の根本解決だから。\n\n権限セットは権限を「足す」機能であって「隠す」機能ではない、という点も覚えておく。隠す方向の制御は共有設定や項目レベルセキュリティの仕事。\n\n営業マネージャーの履歴レポート要件を、アーカイブ先の外部システムで満たしている点にも注目。両方の要件を見落とさない。"}, {"n": 63, "t": "Universal Containers (UC) は、ユーザーが商談レコードを編集できる複数のカスタムVisualforceアプリケーションを開発しました。UCは商談レコードのデータの完全性に苦労しており、過去には必須ではなかった特定の項目を必須にすることを決定しました。新たに必須となる項目は商談のフェーズに依存しており、商談が後のフェーズに進んだ場合にのみ特定の項目が必須になります。項目は2つあります。この新しい要件を処理するための最も簡単なアプローチは何でしょうか？", "c": ["商談のページレイアウトを更新して、これらの項目を必須としてマークする。", "フェーズを考慮した、各項目のための入力規則を使用する。", "設定でこれらの商談の項目の定義を更新して、必須にする。", "レコードが保存されるときに各項目をチェックするApexトリガーを記述する。"], "a": [1], "e": ["ページレイアウトでの必須設定は常に必須となり、フェーズの進行に基づいた動的な条件付きの必須化に対応できません。また、ユーザーはカスタムVisualforceアプリケーションを介してレコードを編集しているため、標準のページレイアウトレベルの必須設定は適用されません。", "正解です。入力規則はサーバー側で評価されるため、Visualforceからの更新やAPI経由の更新など、どのインターフェースからのデータ変更にも確実に適用されます。数式を使用して「特定のフェーズに達している、かつ、該当項目が空白である」という条件を簡単に設定できるため、この要件を満たす最もシンプルで最適な方法です。", "項目の定義レベル（データベースレベル）で必須に設定すると、フェーズに関係なくレコードの作成や保存時に常にその項目が必須になってしまいます。これは「特定のフェーズに進んだ場合にのみ必須にする」という条件付きの要件を満たすことができません。", "Apexトリガーを使用して条件付きの必須チェックを実装することは技術的には可能ですが、最も簡単なアプローチではありません。標準の宣言型機能である入力規則で実現できる要件に対してカスタムコードを記述することは、開発および保守のコストを増加させるため避けるべきです。"], "note": "必須にする3つの方法の違いが、この1問に凝縮されている。ページレイアウトは画面からの入力にしか効かず、条件付きにもできない。項目定義の必須は経路を問わず効くが、常に必須になるので条件付きにできない。入力規則だけが、経路を問わず効き、かつ条件付きにできる。\n\n問題文に「Visualforceから編集している」と「フェーズによって変わる」の2つが書いてあり、この2つがそれぞれページレイアウトと項目定義を消している。条件が2つ置かれている意味を読む。"}, {"n": 64, "t": "取引先責任者の重複作成を避けるため、ある顧客はデータローダを頻繁に使用してSalesforceに取引先責任者レコードをアップサートしています。アップサートを使用する際、データアーキテクトが注意すべき一般的なエラーは何ですか？", "c": ["同じCSVファイル内に重複する外部ID値があることによるエラー。", "同じCSVファイル内でレコードが更新および挿入されることによるエラー。", "重複する取引先責任者名が見つかった場合にアップサートが失敗することによるエラー。", "誤った外部IDを使用するとロードが失敗することによるエラー。"], "a": [0], "e": ["正解です。データローダを使用して外部IDをキーとしてアップサートを実行する際、読み込む1つのCSVファイル内に同じ外部IDを持つ複数の行（重複行）が存在すると、Salesforceはどちらの行の値で処理（更新または挿入）すべきか判断できず、エラーが発生してロードが失敗します。", "アップサート機能の最大の利点は、外部IDまたはSalesforce IDを基準にして、既存のレコードは更新し、存在しないレコードは新規に挿入するという処理を1つのCSVファイルで同時に行えることです。そのため、更新対象と挿入対象がファイル内に混在していること自体はエラーの原因になりません。", "アップサート処理は名前項目ではなく、指定されたID（Salesforce IDまたは外部ID）に基づいてレコードの一致を判定します。名前が同じでもIDが異なれば別レコードとして扱われるため、単に名前が重複しているだけではアップサートの直接的なエラーにはなりません。", "指定した外部IDがSalesforce上に存在しない場合、アップサート機能はそれを「新しいレコード」と見なして新規挿入を行います。そのため、誤った外部IDを指定したとしても、意図しない新規レコードが作成される可能性はありますが、処理自体が失敗してエラーになるわけではありません。"], "note": "Upsert は外部IDを鍵にして「あれば更新、なければ作成」を判断する。だから同じファイルの中に同じ鍵が2回出てくると、どちらを採用すべきか決められずエラーになる。理屈で覚えられる。\n\n見落としやすいのは最後の選択肢。存在しない外部IDを渡してもエラーにはならず、黙って新規レコードが作られる。エラーで止まってくれないぶん、こちらのほうが実務では厄介。"}, {"n": 65, "t": "Universal Containers (UC) は、エンタープライズデータウェアハウス (EDW) の実装を進めています。UCは、EDWへの移行のためにSalesforceから1億件のレコードを抽出する必要があります。最大限のパフォーマンスを得るために、データアーキテクトはどのデータ抽出戦略を使用するべきですか？", "c": ["サードパーティのAppExchangeツールをインストールする。", "連続するクエリでREST APIを呼び出す。", "Bulk APIでPK Chunkingを活用する。", "並列モードでBulk APIを使用する。"], "a": [2], "e": ["サードパーティのツールはデータ抽出を支援する場合がありますが、1億件のレコードのような極めて大規模なデータセットに対して最大限のパフォーマンスを保証するアーキテクチャ上の直接的な解決策ではありません。最適なパフォーマンスを確保するには、SalesforceのネイティブなAPI機能を正しく設計して利用する必要があります。", "REST APIは少量の同期的なデータ操作には適していますが、大量のデータ抽出には適していません。1億件のレコードを連続するクエリで抽出すると、APIコールの制限に達するだけでなく、タイムアウトや著しいパフォーマンスの低下を引き起こします。", "正解です。PK Chunking (Primary Key Chunking) は、数千万から数億件の大規模なデータセットを抽出する際に、主キー（レコードID）の境界に基づいてクエリを自動的に小さなチャンクに分割する機能です。これにより、Bulk APIを使用した大量データの抽出において、クエリのタイムアウトを防ぎ、最大限のパフォーマンスを安全に実現することができます。", "Bulk APIを並列モードで使用することはデータ処理を高速化する一般的な方法ですが、1億件もの超大容量データを抽出する場合、PK Chunkingを併用せずに単純なクエリを実行するだけではタイムアウトが発生しやすく、最適な抽出パフォーマンスは得られません。"], "note": "並列・直列は「入れる」ときの話、PK Chunking は「取り出す」ときの話。この問題は抽出なので PK Chunking が答えになる。\n\n抽出でタイムアウトする理由を押さえておくと迷わない。1億件に対して1本のクエリを投げると、Salesforce側が全件を走査しようとして時間切れになる。IDの範囲で区切って小分けに取れば、1回あたりの仕事が小さくなる。"}, {"n": 66, "t": "あるカジノがSalesforceを導入しており、リゾートを訪れる顧客のために顧客の360度ビューを構築することを計画しています。このカジノは現在、顧客の活動を記録する以下のシステムを維持しています。\n1. POS (販売時点情報管理) システム: 顧客のすべての購入。\n2. Salesforce: 顧客のすべてのカスタマーサービス活動と営業活動。\n3. モバイルアプリ: 顧客のすべての予約、設定、ブラウザアクティビティ。\n4. マーケティング: 顧客のすべてのメール、SMS、ソーシャルキャンペーン。\nSalesforceを使用するカスタマーサービスエージェントは、顧客にサポートを提供するために、すべてのシステムからの活動を表示したいと考えています。この情報は最新かつリアルタイムである必要があります。この要件を満たすために、データアーキテクトはどの戦略を導入するべきでしょうか？", "c": ["顧客の360度ビューを構築するために、Salesforceで外部データソースを活用する。", "顧客の360度ビューを表示するために、顧客データマートを使用する。", "4つのシステムすべてからSalesforceに顧客の活動を移行する。", "360度ビューを構築するために、定期的にSalesforceに要約情報をアップロードする。"], "a": [0], "e": ["正解です。Salesforce Connectなどの機能を使用して外部データソースを設定することで、データをSalesforceに複製することなく、外部システムのデータをリアルタイムで参照・表示できます。これにより、最新かつリアルタイムな情報をエージェントに提供するという要件を、Salesforceのデータストレージを圧迫せずに満たすことができます。", "データマートやデータウェアハウスは分析や履歴のレポート作成には適していますが、Salesforceの画面内で作業しているカスタマーサービスエージェントに対して、各システムのリアルタイムなトランザクションデータを直接提供するための最適なアプローチではありません。", "外部システムの大量のトランザクションデータや活動データをすべてSalesforceに複製して保存すると、データストレージの制限をすぐに超過し、システムのパフォーマンス低下を招きます。また、4つのシステムと常にリアルタイムでデータを同期し続けるための統合の複雑さとコストが非常に高くなります。", "データを定期的にアップロードする（バッチ処理などの）アプローチでは、データが同期されるまでのタイムラグが発生するため、「最新かつリアルタイムである必要がある」という要件を満たすことができません。"], "note": "「リアルタイム」「最新」と書いてあれば、定期的にコピーする案はすべて消える。これが最初の絞り込み。\n\nそのうえで Salesforce Connect が答えになるのは、エージェントがSalesforceの画面の中で各システムの情報を扱う必要があるから。マッシュアップが答えになる問題との違いは、工数の制約が書かれていないことと、情報源が4つあって個別に画面を埋め込むのが現実的でないこと。\n\n複数組織の360度ビューを作る問題では、逆に「一元化したデータストアに集める」が答えになる。あちらは名寄せして単一の顧客像を作る話で、こちらは見るだけ。動詞を読み分ける。"}, {"n": 67, "t": "Universal Containersは、顧客にWeb注文フォームを提供していますが、注文に無効なデータが入力されていることに気付きました。この問題を軽減するために何を使用するべきでしょうか？", "c": ["ワークフロールール", "フォーマット済み項目", "Apexトリガ", "入力規則"], "a": [3], "e": ["ワークフロールールは、指定した条件を満たしたレコードに対して自動的にアクション(ToDoの割り当て、メールアラート、項目更新など)を実行する自動化機能です。ユーザーによる無効なデータの入力を保存前にブロックしてエラーメッセージを表示する目的には使用できません。", "メールアドレスや電話番号のような特定のデータ型による基本的な形式チェックは可能ですが、独自のビジネス要件に基づいた複雑なデータの妥当性を検証し、保存を防ぐための柔軟なルール設定としては不十分です。", "Apexトリガを使用してプログラミングによる複雑なデータ検証ロジックを記述し、保存を拒否してエラーを返すことは技術的に可能です。しかし、コードの開発と保守のコストがかかるため、標準機能で要件を満たせる場合には推奨されません。", "正解です。入力規則を使用すると、ユーザーがレコードを保存する前に設定した条件(数式)に基づいてデータの妥当性を評価できます。入力されたデータが条件を満たさない場合は指定したエラーメッセージを表示して保存をブロックできるため、無効なデータがシステムに作成されるのを防ぐ最適な標準機能です。"], "note": "自動化機能の役割分担がそのまま問われている。ワークフローやフローは「保存されたあとに何かする」機能で、保存そのものを止めることはできない。保存を止めるのは入力規則（またはトリガの addError）。\n\nWebフォームからの入力でも入力規則は効く。経路を問わずサーバー側で評価されるため。"}, {"n": 68, "t": "データアーキテクトはSalesforceから100万件のレコードをエクスポートする場合、どのAPIを使用するべきですか？", "c": ["Bulk API", "REST API", "Streaming API", "SOAP API"], "a": [0], "e": ["正解です。Bulk APIは、大量のデータ（通常は数万から数千万レコード）を非同期でロードまたはクエリ（エクスポート）するために最適化されたAPIです。100万件のレコードを処理するための最も効率的で適切な選択肢となります。", "REST APIは、少量のデータに対する同期的な操作や、Webアプリケーションからのリアルタイムな連携に適しています。100万件といった大量データの処理には、ガバナ制限やタイムアウトのリスクがあるため適していません。", "Streaming APIは、Salesforce内のデータの変更をリアルタイムで外部システムに通知（プッシュ配信）するためのイベント駆動型のAPIです。大量の既存データを一括でエクスポートするためのツールではありません。", "SOAP APIは、システム間の同期的なインテグレーションや小規模から中規模のデータ操作に使用されます。REST APIと同様に、100万件のレコードを一度にエクスポートしようとするとパフォーマンスの低下やガバナ制限に達する可能性が高いため推奨されません。"], "note": "APIの選び方は4つ覚えれば足りる。大量をまとめて入れる・出す＝Bulk API。少量をその都度＝REST API（軽量）またはSOAP API（古いが機能が厚い）。変わったことを知らせる＝Streaming API。設定を運ぶ＝Metadata API。\n\nこの問題は100万件の抽出なので Bulk API。なお数千万件を超えてタイムアウトする場合は、Bulk API に加えて PK Chunking を併用する、という段階がある。"}, {"n": 69, "t": "Universal Containers (UC) は、10分ごとにコンテナの温度と湿度の情報をUCに送信するスマートコンテナで構成される新しいIoT（モノのインターネット）技術を導入しています。この技術を備えたコンテナは約10,000個あり、今後5年間で50,000個に増えると予想されています。Salesforceユーザーは、各コンテナの現在および過去の温度と湿度のデータにアクセスできることが不可欠です。推奨されるソリューションは何でしょうか？", "c": ["既存の Container カスタムオブジェクトに温度と湿度の新しいカスタム項目を作成し、各コンテナに固有の外部ID項目も作成する。新しい測定値を受信したときにこれらのカスタム項目を更新する。", "特定のコンテナの新しい測定値を受信したときに作成される、新しい Container Reading カスタムオブジェクトを作成する。Container Reading カスタムオブジェクトは、Container オブジェクトと主従関係を持つ。", "特定のコンテナの最新の湿度と温度データを表示し、UCの既存のデータウェアハウスから関連データを取得して過去の傾向も表示できる新しいLightningコンポーネントを作成する。", "特定のコンテナの新しい測定値を受信したときに作成される、Container オブジェクトとの主従関係を持つ新しい Container Reading カスタムオブジェクトを作成する。1時間ごとに実行されるアーカイブプロセスを実装する。"], "a": [3], "e": ["この方法では、データを受信するたびに項目が上書きされてしまうため、各コンテナの過去の履歴データを保持するという要件を満たすことができません。", "履歴を保存するために子レコードを作成するのは正しいアプローチですが、膨大な量のレコードが生成されるため、このままではSalesforceのデータストレージ制限をすぐに超過してしまいます。データのライフサイクル管理が考慮されておらず不十分です。", "データウェアハウスを活用しカスタム開発を行うことは大規模データの処理手段の一つですが、Salesforceの標準機能やデータモデルを活用して履歴データを管理・表示するというデータアーキテクチャの推奨アプローチからは外れます。", "正解です。過去のデータを保持するために主従関係の子オブジェクトを作成しつつ、膨大なデータ量によってSalesforceのストレージが枯渇しパフォーマンスが低下するのを防ぐために、高頻度で実行されるデータアーカイブプロセスを組み合わせるのが、大規模データを扱う際のベストプラクティスです。"], "note": "自分で件数を出すと、なぜ1時間ごとのアーカイブなのかが分かる。10分おきなら1台あたり1日144回。10,000台で1日144万件。5万台に増えると1日720万件。元の解説は「100万件以上／500万件以上」と書いているが、実際はもっと多い。\n\n解き方は2段階。①「過去のデータにアクセスできること」が要件なので、上書きする案は消える。②残った子オブジェクト案のうち、アーカイブが付いているほうを選ぶ。この問題集では「子オブジェクトを作る案」と「子オブジェクト＋アーカイブの案」を並べる型が繰り返し出るので、必ず後者を選ぶ。"}, {"n": 70, "t": "Universal Containers (UC) は、過失または悪意によってデータが毎日破損していることを懸念しています。彼らは、破損したデータや誤って変更または削除されたデータを回復するためのバックアップ戦略を実装したいと考えています。データアーキテクトが項目レベルの監査および回復計画を設計する際に考慮すべきことは何ですか？", "c": ["古いデータを消去してデータストレージを削減する。", "AppExchangeパッケージを実装する。", "予想されるデータストレージのニーズを見直す。", "週次エクスポートファイルをスケジュールする。"], "a": [2], "e": ["データの監査および回復計画を設計する目的は、失われたデータの復元や変更履歴の保持です。古いデータを消去してストレージを削減することは、データの回復能力を低下させてしまうため、バックアップ戦略の考慮事項として不適切です。", "バックアップや監査を強化するAppExchangeパッケージを導入することは具体的な解決策の一つにはなり得ますが、計画を設計する段階でのアーキテクチャ上の基本的な考慮事項としては、まず自社のデータストレージ要件やシステムへの影響を評価することが優先されます。", "正解です。項目レベルの監査（項目履歴管理など）の有効化や、変更データのバックアップをSalesforce内に保持する戦略を設計する場合、長期間にわたる大量の履歴データが作成されるため、データストレージを大きく消費します。そのため、計画を設計する際には、将来的に必要となるデータストレージ容量を事前に予測・見直し、容量制限に抵触しないかを考慮することが極めて重要です。", "週次データエクスポートはSalesforceの標準機能ですが、毎日発生するデータの変更や、項目レベルの細かな変更を追跡するには、エクスポートの間隔（最大週に1回）が長すぎます。日々のデータの破損に対するきめ細やかな回復計画の要件を満たすには不十分です。"], "note": "この問題は解答に疑問が残る。設問が「考慮すべきこと」と広く聞いているのに、答えが「ストレージの見積もり」という細部に寄っている。暗記の価値は低い。\n\n拾える事実は1つだけ——項目履歴の追跡を増やすとストレージを消費する。履歴データも容量を食う、という当たり前のことが見落とされやすい。\n\nあわせて、週次エクスポートは最短でも週1回なので、日次の要件には届かない。この制約は別の問題でも使える。"}, {"n": 71, "t": "大規模な多国籍B2CのSalesforce顧客が、販売代理店管理アプリケーションをSalesforceで実装しようとしています。このアプリケーションには以下の機能があります：\n1. 販売代理店はSalesforceで販売注文を作成する。\n2. 販売注文は、その地域に適用される商品価格に基づいている。\n3. 販売注文は、履行された時点で成約となる。\n4. 注文は商談オブジェクトで管理することが決定されている。\nデータアーキテクトは、この要件をどのようにモデル化するべきですか？", "c": ["カスタム価格オブジェクトへの参照を作成し、販売代理店と共有する。", "各地域の価格表を設定し、販売代理店と共有する。", "販売代理店に適用される価格で商談を手動で更新する。", "商談にカスタム項目を追加し、トリガーを使用して価格を更新する。"], "a": [1], "e": ["商談オブジェクトには商品や価格を管理するための強力な標準機能（商談商品など）が備わっています。独自のカスタムオブジェクトと参照を作成することは、標準機能の利点を損ない、将来的なメンテナンスの負担を増加させるため推奨されません。", "正解です。Salesforceの標準機能である価格表（Price Books）を使用することで、地域ごとの異なる価格設定を効率的に管理できます。それぞれの販売代理店に適切な地域の価格表へのアクセス権を付与することで、商談上で正しい地域価格に基づいた注文作成を標準機能のままシームレスに実現できます。", "大規模な多国籍企業において、手動での価格更新はヒューマンエラーの原因となり、業務の非効率化を招きます。システムの自動化とスケーラビリティの観点から不適切なアプローチです。", "標準の価格表機能で地域ごとの価格要件を完全に満たすことができるため、カスタム項目を追加し、Apexトリガーを用いて価格を計算・更新する独自のロジックを開発する必要はありません。不要なカスタマイズは技術的負債を生む原因となります。"], "note": "価格表（Price Book）は「同じ商品に、相手や地域ごとに違う価格を持たせる」ための標準機能。地域別・代理店別の価格という要件が出たらこれ。\n\nこの問題集を通じた原則がここでも効く——標準機能で足りるなら、カスタムオブジェクトもコードも作らない。手作業の案も不正解。消去法だけでも正解に届く。"}, {"n": 72, "t": "Universal Container (UC) には約20万の顧客がおり、取引先オブジェクトに保存されています。UCは各顧客から毎月1〜2件の注文を受けます。注文は Order__c というカスタムオブジェクトに保存されており、これには約50の項目があります。UCは前年比10%の成長を見込んでいます。Order__c オブジェクトからデータを取得するSOQLクエリのパフォーマンスを向上させるために、アーキテクトが考慮すべき2つのことは何ですか？2つ選択してください。", "c": ["WHERE条件なしでSOQLクエリを使用する。", "Salesforceサポートと協力してスキニーテーブルを有効にする。", "Order__c オブジェクトのトリガーの数を減らす。", "インデックス付けされた項目を使用して、クエリの選択性を高める。"], "a": [1, 3], "e": ["何百万件ものレコードが存在する大規模データ環境において、WHERE条件なしでクエリを実行すると、オブジェクトの全レコードを検索するフルテーブルスキャンが発生します。これによりパフォーマンスが著しく低下し、Salesforceのガバナ制限（取得行数制限など）に抵触してエラーとなるため推奨されません。", "正解です。スキニーテーブルは、頻繁に使用される項目を抽出し、ごみ箱にあるレコードを除外して構成される専用のテーブルです。データベースの結合を減らすことで、数百万件のレコードを持つオブジェクトに対するSOQLクエリやレポートの検索パフォーマンスを劇的に向上させます。作成するにはSalesforceサポートに依頼する必要があります。", "トリガーの数を減らす、または1つのトリガーにまとめることは、レコードの作成や更新（DML操作）の際のパフォーマンス向上やメンテナンス性の向上には役立ちますが、SOQLを使用したデータ検索（読み取り操作）のパフォーマンスには直接関係しません。", "正解です。クエリを選択的にする（Selective Query）とは、インデックスが作成された項目（外部IDやカスタムインデックスなど）をWHERE句のフィルター条件として使用し、検索対象となるレコード数を全体の一定割合以下に絞り込むことです。これにより、効率的にインデックスが利用され、クエリのパフォーマンスが最適化されます。"], "note": "読み取りの速さと、書き込みの速さは別の話。トリガーを減らす案が不正解になるのは、トリガーが効くのは保存のときであって、検索のときではないため。問題文が SOQL（検索）を名指ししていることに注意する。\n\nスキニーテーブルの特徴を3つ押さえる。①自分では作れずSalesforceのサポートに依頼する ②1つのオブジェクトの中でしか効かず、他オブジェクトの項目は含められない ③ごみ箱のレコードを含まないので速い。\n\n月1〜2件 × 20万顧客なら年間で数百万件になる。件数を見積もる癖をつける。"}, {"n": 73, "t": "Universal Containers (UC) は、クラウドデータベースに1000万行の在庫データを保存しています。Salesforceでの統合された体験を作成する一環として、UCはインポートすることなくこの在庫データをSales Cloudに連携したいと考えています。UCは、Salesforce Connectが必要かどうかを判断するようデータアーキテクトに依頼しました。Salesforce Connectの必要性を評価する際、データアーキテクトはどの3つの考慮事項を確認するべきですか？", "c": ["他のシステムから最新のデータにリアルタイムでアクセスしたい。", "大量のデータがあり、そのサブセットをSalesforceにコピーしたい。", "仮想プライベート接続を介してデータを公開する必要がある。", "Salesforce組織にコピーしたくない大量のデータがある。", "一度に少量の外部データのみを必要とする。"], "a": [0, 3, 4], "e": ["正解です。Salesforce Connectは、外部システムのデータにリアルタイムでアクセスしてSalesforce内で表示するための機能であり、データの最新状態を常に参照したい要件に最適です。", "Salesforce Connectは外部データをSalesforce内に「コピー（保存）」するためのものではありません。データをSalesforce内にコピーして保存したい場合は、ETLツールやデータインポート機能の使用を検討する必要があります。", "Salesforce Connectは、主にODataプロトコルなどを使用して外部システムと連携し、Salesforce内にデータを表示する機能です。Salesforce Connect自体が仮想プライベート接続（VPNなど）を介したデータの公開を提供するものではありません。", "正解です。Salesforce Connectを使用すると、外部データをSalesforce組織のデータストレージに保存することなく（コピーせずに）外部オブジェクトとして参照できるため、大量のデータによるSalesforceストレージの消費を防ぐことができます。", "正解です。Salesforce Connectは、ユーザーがレコード画面を開いた時やリストビューを表示した時など、必要な時に必要な少量のデータのみを外部システムから動的に取得して表示するユースケースに最適化されています。バッチ処理などで一度に大量のデータを処理するのには向いていません。"], "note": "Salesforce Connect が向く条件は3つ。①リアルタイムに最新を見たい ②コピーしたくない ③一度に見るのは少量。この3つがそのまま正解になっている。\n\n3つ目が見落とされやすい。Salesforce Connect は見るたびに相手へ問い合わせる仕組みなので、一度に大量を扱うと相手にもSalesforceにも負荷がかかる。「画面を開いたときに数件〜数十件を見る」用途に向いている。大量を一括処理するならETLでコピーする。\n\nつまり「1000万行あるから Connect」ではなく、「1000万行あるがコピーしたくなく、一度に見るのは少しだから Connect」という理屈。"}, {"n": 74, "t": "Universal Containersは、フルコピーのSandbox内で、5つの異なるオブジェクトに5,000万件のレコードを複数回正常に移行しました。インテグレーションエンジニアは、本番環境へのリリースの1か月前にこのテストを再実行したいと考えています。テストを再実行するための推奨されるアプローチは何ですか？", "c": ["5つのオブジェクトすべてをすばやく切り捨てて、データ移行テストを再実行する。", "フルコピーのSandboxを更新して、データ移行テストを再実行する。", "5つのオブジェクトのすべてのデータを物理削除して、データ移行テストを再実行する。", "テストを実行する前に、5つのオブジェクトすべてを切り捨てて物理削除する。"], "a": [1], "e": ["カスタムオブジェクトの切り捨て機能はデータの削除を高速に行えますが、他から参照されているオブジェクトや一部の標準オブジェクトには使用できないなどの厳しい制限があります。移行対象のすべてのオブジェクトで確実に機能するとは限らないため、テストのリセット方法として最適ではありません。", "正解です。5,000万件という非常に大量のデータを持つ環境をクリーンな状態にリセットする最も確実で効率的な方法は、フルコピーのSandboxを本番環境から再度更新（リフレッシュ）することです。フルコピーSandboxは29日ごとに更新可能であるためリリースの1か月前という要件に適合し、データ削除の長時間の処理や制限事項を回避して、最新の本番組織と同じ状態から移行テストを正確にやり直すことができます。", "Bulk APIを使用した物理削除（Hard delete）であっても、5,000万件のレコードを削除するには非常に長い時間がかかります。APIコールの消費やシステムパフォーマンスへの影響も大きく、Sandboxの更新と比較してはるかに非効率的です。", "切り捨てと物理削除はそれぞれ異なるデータ削除の手法であり、両方を組み合わせて実行するという選択肢は不自然です。また、どちらの方法にしてもSandbox全体の更新に比べて手間がかかり、技術的な制限や処理時間の問題があるため推奨されません。"], "note": "覚えるべき数字は29日。フルコピーSandboxは29日に1回しか更新できない。問題文の「リリースの1か月前」はこの制約に合わせて書かれている。\n\nSandboxの種類も整理しておく。Developer と Developer Pro は設定だけで本番データが入らない。Partial Copy は設定＋データの一部。Full は本番の完全なコピーで、本番相当の性能検証や大量データのテストができる唯一の選択肢。\n\n切り捨て（truncate）はカスタムオブジェクトを空にする機能だが、他から参照されていると使えないなど制限が多い。"}, {"n": 75, "t": "DreamHouse Realtyには、取引先責任者を管理するために使用されるSalesforce組織があります。この状況でデータ品質を維持するために、アーキテクトが使用を検討すべき2つのことは何ですか？（2つ選択してください。）", "c": ["非公開の共有モデルを使用する。", "Salesforceの重複管理を使用する。", "新規レコードの作成および編集時に入力規則を使用する。", "重複レコードを削除するためにワークフローを使用する。"], "a": [1, 2], "e": ["共有モデルを非公開に設定することは、レコードへのアクセス権限やセキュリティを制御するための機能であり、データの正確性や品質（重複の防止や入力フォーマットの統一など）を直接維持するための手段ではありません。", "正解です。Salesforceの標準機能である重複管理（重複ルールと一致ルール）を使用することで、ユーザーが既存の取引先責任者と重複するレコードを作成または編集しようとした際に、警告を表示したり保存をブロックしたりできるため、クリーンなデータ品質の維持に直接貢献します。", "正解です。入力規則を使用することで、ユーザーがレコードを作成または編集して保存する前に、データが特定の条件（必須項目の入力漏れや不適切なフォーマットなど）を満たしているかを検証できます。これにより、正確で要件を満たしたデータのみがシステムに保存されるようになります。", "ワークフロールール（およびプロセスビルダーや標準のフロー）には、重複レコードを識別して自動的に削除する標準アクションは存在しません。重複の管理と排除には、専用の重複管理機能や必要に応じたApexコード等を使用する必要があるため、このアプローチは不適切です。"], "note": "データ品質とセキュリティは別物、という見分けの問題。共有モデルは「誰が見られるか」の話で、データが正しいかどうかには関係しない。\n\nもう1つ、ワークフローに重複を消す機能はない、という事実も繰り返し問われる。ワークフローやフローができるのは、保存されたあとに項目を更新する・メールを送る・ToDoを作る、といったこと。重複の検知も削除もできない。"}, {"n": 76, "t": "Northern Trail Outfitters (NTO) は地域に基づいた複数のSalesforce組織を持っています。ユーザーは、すべてのSalesforce組織にわたって顧客への読み取り専用アクセスを必要としています。すべてのNTO組織にわたって顧客レコードへのアクセスを提供するために使用できるSalesforceの機能はどれですか？", "c": ["Salesforce Connect", "Salesforce 2 Salesforce", "統合検索", "外部API"], "a": [0], "e": ["正解です。Salesforce Connectのクロス組織アダプタを使用すると、異なるSalesforce組織のデータを自身の組織にコピーすることなく、外部オブジェクトとしてシームレスに表示および検索できます。これにより、他の組織の顧客データへの読み取り専用アクセスを容易かつスケーラブルに提供できます。", "Salesforce to Salesforceは、複数のSalesforce組織間でレコードをパブリッシュおよびサブスクライブし、実際にデータをコピーして同期するための機能です。データを複製せずにリアルタイムの読み取り専用アクセスを提供するという今回の要件には最適ではありません。", "統合検索は、Salesforceのグローバル検索から外部の検索エンジンやドキュメントリポジトリ(SharePointなど)の検索結果を表示するための機能です。他のSalesforce組織の構造化されたレコードを、Salesforce内で直接参照・操作する目的には適していません。", "外部APIを使用してカスタムのインテグレーションを開発し、他組織のデータを表示させることは技術的には可能ですが、多大な開発工数とメンテナンスコストがかかります。Salesforce Connectという強力な標準機能が存在するため、推奨されるアプローチではありません。"], "note": "組織をまたぐ問題は、要件の動詞で答えが決まる。「読み取り専用でアクセスしたい」＝見るだけなので、コピーしない Salesforce Connect のクロス組織アダプタ。\n\n一方、他組織にレコードを作成する問題では Salesforce to Salesforce や変更データキャプチャが答えになる。さらに、名寄せして単一の顧客像を作る問題では一元化したデータストアが答えになる。同じ「複数組織」でも3通りに分かれるので、見る・作る・まとめる、のどれかを読む。\n\nクロス組織アダプタという名前は覚えておく価値がある。"}, {"n": 77, "t": "Universal Containers (UC) は、AppExchangeで利用可能な新しい会計製品を導入するためのRFPを開始しています。UCは年間500万件の請求書を発行する予定であり、各請求書には平均10個の明細が含まれます。スケーラビリティを確保するために、UCのデータアーキテクトは何を推奨するべきですか？", "c": ["請求書明細が既存の商談商品を単に参照することを確認する。", "会計製品ベンダーが提供内容にWave Analyticsを含めていることを確認する。", "会計製品ベンダーが適切なデータアーカイブ戦略を提供していることを確認する。", "会計製品がSalesforceプラットフォーム上で100%ネイティブに実行されることを確認する。"], "a": [2], "e": ["この方法では、年間5000万件以上の明細レコードがSalesforce内に蓄積されるというデータ量の根本的な問題は解決されません。参照を使用しても、システムの長期的なスケーラビリティには寄与しません。", "Wave Analytics（現在のCRM Analytics）は大量のデータを分析してインサイトを得るための強力なツールですが、Salesforceのコアプラットフォーム上でのデータストレージ制限の超過やパフォーマンスの低下を防ぐためのスケーラビリティ対策ではありません。", "正解です。年間500万件の請求書と5000万件の明細レコードが生成される場合、Salesforceのデータストレージはすぐに逼迫し、パフォーマンスの低下を引き起こす大量データの問題に直面します。システムの長期的なスケーラビリティを維持するためには、古いデータを定期的にアーカイブしてプラットフォーム外やBig Objectなどに移動させる、堅牢なデータアーカイブ戦略が不可欠です。", "アプリケーションが100%ネイティブであるかどうかに関わらず、年間数千万件のレコードがSalesforce内に直接作成され続ければ、データストレージの限界やパフォーマンスの問題が同様に発生します。大量データに対する根本的なスケーラビリティの解決策にはなりません。"], "note": "500万 × 10 ＝ 年5,000万件の明細。数を出せば、アーカイブ以外に答えがないと分かる。\n\nこの問題の面白いところは、AppExchange製品を選ぶ場面でも同じ判断をしている点。ベンダーを評価する観点として「アーカイブの仕組みを持っているか」を挙げている。自社で作る場合と、製品を買う場合とで、問うべきことは変わらない。\n\n「100%ネイティブ」が不正解なのも覚えておく価値がある。ネイティブであること自体はストレージの問題を何も解決しない。"}, {"n": 78, "t": "DreamHouse Realtyには、Salesforceのカスタムオブジェクトにレコードを作成するインテグレーションがあります。このカスタムオブジェクトには、ページレイアウト上で必須とマークされた項目があります。DreamHouse Realtyは、外部システムから送られてくるレコードの多くに、この項目のデータが欠落していることに気づきました。アーキテクトは、ソースシステムから送られてくるデータが常にこの項目に含まれていることを確実にする必要があります。アーキテクトはどの2つのアプローチを取るべきでしょうか？2つ選択してください。", "c": ["空白の値を防ぐために入力規則を設定する。", "この項目にデフォルト値を設定するためにワークフローを作成する。", "設定の項目レベルで項目を必須とマークする。", "顧客の外部システムの不良データを非難する。"], "a": [0, 2], "e": ["正解です。入力規則は、ページレイアウト上の操作だけでなくAPIやインテグレーションを経由するデータ処理に対してもサーバー側で実行されます。これにより、外部システムから連携されたレコードの該当項目が空白である場合、保存をブロックして確実にデータを要求することができます。", "ワークフローやデフォルト値の設定によってシステム側で自動的に値を埋めることは可能ですが、これでは「ソースシステムから送られてくるデータが常に含まれていること」を保証するという要件を満たせません。", "正解です。項目定義（データベースレベル）で必須チェックを入れることで、ページレイアウトからの入力だけでなく、API経由でのレコード作成時も含め、すべての経路においてその項目へのデータ入力を強制することができます。", "外部システム側に問題がある可能性はありますが、これはアーキテクトがSalesforce側のデータ整合性を担保するための技術的な解決策やプロフェッショナルなアプローチではありません。"], "note": "この問題が、ページレイアウトの必須が連携に効かないことの証拠そのものになっている。ページレイアウトで必須にしてあるのに、外部システムからは空のまま入ってきている——それがこの問題の状況である。\n\n連携にも効かせたいなら、項目定義で必須にするか、入力規則を使う。この問題は両方を正解にしている。\n\nデフォルト値で埋める案が不正解になる理由も読み取る。要件は「送られてくるデータに含まれていること」なので、Salesforce側で勝手に埋めたら要件を満たしたことにならない。埋めるのと、送らせるのは違う。"}, {"n": 79, "t": "Universal ContainersはInformatica Cloudを使用してSalesforceから4,000万件の取引先レコードをエクスポートしています。ETLツールが失敗し、クエリログにはフルテーブルスキャンのタイムアウトエラーが示されています。推奨される解決策は何ですか？", "c": ["エクスポートジョブのヘッダーを変更してExport-in-Parallelを指定する。", "エクスポートジョブのヘッダーを変更してSforce-Enable-PKChunkingを指定する。", "標準のインデックス項目を含むようにエクスポートクエリを変更する。", "バッチサイズ10,000のLIMIT句を含むようにエクスポートクエリを変更する。"], "a": [1], "e": ["Bulk APIにおける並列処理モードの機能はデータのインポート時（挿入や更新）のパフォーマンス向上には役立ちますが、クエリ実行時のフルテーブルスキャンによるタイムアウト問題を解決するためのヘッダー指定ではありません。", "正解です。PK Chunking（Primary Key Chunking）は、Bulk APIを使用して数千万件規模の大規模なデータをクエリする際に、主キー（レコードID）に基づいてクエリを自動的に小さなチャンク（分割された塊）に分割して処理する機能です。これにより、クエリがフルテーブルスキャンを引き起こしてタイムアウトするのを防ぎ、データ抽出を安全に完了させることができます。", "検索条件にインデックス項目を含めることは通常のクエリパフォーマンスを向上させるベストプラクティスですが、4,000万件のようなテーブル全体のデータをエクスポートするケースではインデックスの選択性が低くなるため、結果的にタイムアウトを回避する手段にはなりません。", "LIMIT句とOFFSET句を利用して手動でバッチ処理を組むことは一部のシナリオで有効ですが、数千万件の大規模データではオフセットの制限などに抵触しやすく、パフォーマンスの低下やタイムアウトの原因となるため、PK Chunkingを使用する標準機能のアプローチに比べて推奨されません。"], "note": "ヘッダー名がそのまま選択肢に出る問題。Sforce-Enable-PKChunking。この文字列は覚えておく価値がある。\n\n一見もっともらしい「インデックス項目を条件に入れる」が不正解になる理由も押さえる。全件を取り出すのが目的なので、そもそも絞り込む条件がない。索引は絞り込むための道具なので、全件取得では助けにならない。\n\n「フルテーブルスキャン」「タイムアウト」「数千万件」「抽出」が揃ったら PK Chunking、で固定してよい。"}, {"n": 80, "t": "Universal Containers (UC) には1,000件の取引先と50,000件の商談があります。UCには、すべての販売データを毎週Salesforceの外部にエクスポートするという企業のセキュリティ要件があります。セキュリティ要件では、ファイルのダウンロード、ログイン、ログアウトなどの行動を含む主要な運用データをエクスポートすることも求めています。上記の要件を満たすために推奨される2つのアプローチはどれですか？", "c": ["項目監査履歴を使用して運用データをキャプチャし、オンプレミスシステムに抽出する。", "ウィークリーエクスポートを使用してトランザクションデータをオンプレミスシステムに抽出する。", "カスタム構築された抽出ジョブを使用して、運用データをオンプレミスシステムに抽出する。", "イベントモニタリングを使用して行動データをオンプレミスシステムに抽出する。"], "a": [1, 3], "e": ["項目監査履歴(Field Audit Trail)は、特定の項目のデータ変更を最大10年間保持するための機能であり、ファイルのダウンロードやログインなどの運用データを追跡およびキャプチャするための機能ではありません。", "正解です。Salesforceの標準機能であるデータエクスポート機能(ウィークリーエクスポート)をスケジュールすることで、取引先や商談といったすべての販売データ(トランザクションデータ)を週単位で定期的に抽出し、要件を満たすことができます。", "カスタムジョブを開発して運用データを抽出することは技術的に可能かもしれませんが、開発や保守のコストがかかります。Salesforceには運用データの抽出に特化した標準機能が存在するため、カスタム構築はベストプラクティスとして推奨されません。", "正解です。イベントモニタリング(Event Monitoring)はSalesforce Shieldの一部であり、ログイン、ログアウト、ファイルのダウンロードといった詳細なユーザーの行動データ(運用データ)をキャプチャし、APIを介して外部システムにエクスポートするための最適な機能です。"], "note": "3つの「履歴」の役割分担がここで整理できる。項目履歴管理＝レコードの中の値が変わった記録。設定変更履歴＝設定をいじった記録。イベントモニタリング＝誰が何を見た・落とした・ログインしたという行動の記録。\n\nこの問題は「ファイルのダウンロード、ログイン、ログアウト」と書いてあるので行動の記録、つまりイベントモニタリング。項目監査履歴（Field Audit Trail）は値の変更履歴を長期保存する機能で、行動は追えない。\n\nもう1つの正解は週次エクスポート。要件が「毎週」なのでちょうど合う。日次が要求されていたら、この標準機能では足りない。"}, {"n": 81, "t": "カスタム設定よりもカスタムメタデータ型を使用する利点は何ですか？", "c": ["カスタムメタデータレコードは、本番環境からSandboxにコピーされない。", "カスタムメタデータ型はレポートに使用できる。", "カスタムメタデータレコードは、パッケージを使用してデプロイ可能である。", "カスタムメタデータレコードは、Apexで編集可能である。"], "a": [2], "e": ["カスタムメタデータレコードはメタデータとして扱われるため、Sandboxの作成や更新時に本番環境から自動的にコピーされます。対して、カスタム設定のレコードはデータとして扱われるため、フルコピーSandbox以外では自動コピーされません。したがって、この選択肢の記述は事実と逆になっています。", "カスタムメタデータ型のレコードを使用して標準のSalesforceレポートやダッシュボードを直接作成することはできません。", "正解です。カスタムメタデータ型は、その定義だけでなくレコード自体もメタデータとして扱われます。そのため、変更セットやパッケージ、Salesforce CLIなどを経由して、環境間でレコードを含めたデプロイを簡単に行うことができます。これは、レコードの移行にデータローダー等のデータ移行ツールが必要なカスタム設定に対する大きな利点です。", "標準のDML操作を使用して、Apexからカスタムメタデータレコードを直接作成・更新することはできません。一方、カスタム設定のレコードはApexで通常のDML操作を使用して容易に編集可能です。"], "note": "名前のとおりに考えると全部説明がつく。カスタムメタデータ型は「メタデータ」なので、設定と同じ扱いになる。だからデプロイで運べるし、Sandboxにもコピーされる。その代わり、データではないのでApexから普通に書き換えることはできず、レポートにも使えない。\n\nカスタム設定は「データ」なので逆になる。Apexから書き換えられるが、環境間を運ぶにはデータ移行ツールが要る。\n\nどちらを使うかの実務的な判断——環境をまたいで一緒に運びたい設定値はカスタムメタデータ型。実行中に書き換える値はカスタム設定。"}, {"n": 82, "t": "Universal Containers (UC) は、大量のデータと日々のトランザクションを伴うSalesforceプロジェクトを導入しています。ソリューションには、バックエンドシステムとのリアルタイムのWebサービス連携とVisualforceマッシュアップの両方が含まれています。プロジェクトで使用されるSalesforceのFull Sandboxは、フルスケールのバックエンドテストシステムと連携しています。このプロジェクトに適切なパフォーマンステストの種類はどれですか？2つ選択してください。", "c": ["稼働開始前の、Salesforce Full Sandboxに対する自動ページロードテスト。", "稼働開始後の、Salesforce本番組織に対する自動ページロードテスト。", "稼働開始前の、Salesforce Full Sandboxでの単体テスト。", "インテグレーションミドルウェアによってホストされるWebサービスに対するストレステスト。"], "a": [0, 3], "e": ["正解です。Full Sandboxは本番組織のデータとメタデータの完全なレプリカであり、本番と同等のデータボリュームと環境を再現できます。そのため、稼働開始前にVisualforceマッシュアップなどの自動ページロードテストを実施し、パフォーマンスを評価するための最適な環境となります。", "本番組織に対して自動化されたパフォーマンステストや負荷テストを実施することは、実際の業務プロセスに支障をきたす恐れがあり、Salesforceのプラットフォーム制限に抵触する可能性もあるため推奨されません。パフォーマンステストは必ず稼働開始前にFull Sandbox等のテスト環境で行う必要があります。", "単体テスト（ユニットテスト）は、個々のコードや機能が正しく動作するかを確認するテストであり、パフォーマンステストには分類されません。また、単体テストは通常、開発プロセスの初期段階においてDeveloper Sandboxなどで実施されます。", "正解です。このプロジェクトには大量のデータと日々のトランザクション処理があり、リアルタイムのWebサービス連携が含まれています。そのため、Salesforceと通信するインテグレーションミドルウェア側が、想定される大量のトラフィックや負荷に耐えられるかどうかを確認するストレステストは、システム全体のパフォーマンスを保証するために不可欠です。"], "note": "問題に書かれていない前提を1つ知っていると、この種の問題で迷わなくなる。Salesforceに対する負荷テスト・性能テストは、事前にSalesforceの承認を得る必要がある。勝手に負荷をかけてはいけない。相席している建物で、自分だけ大騒ぎするようなものだから。\n\nだから「本番組織に負荷テスト」は常に不正解になり、ストレステストの対象はSalesforceの外側（ミドルウェア）になる。\n\nもう1つ、単体テストは性能テストではない、という分類の問題も含まれている。設問が性能テストを聞いているので、種類が違うものは外れる。"}, {"n": 83, "t": "Universal Containers (UC) は顧客に配送サービスを提供しています。同社は顧客の出荷を追跡するために商談を使用しています。常に、配送状況は10個の値のいずれかになります。UCには20万件の商談レコードがあります。商談で配送状況を追跡するための新しい項目を作成する際、データ品質を向上させ、データスキューを回避するためにアーキテクトは何をするべきですか？", "c": ["選択リスト項目を作成し、値をアルファベット順に並べ替える。", "カスタムオブジェクト ShippingStatus__c への主従関係を作成する。", "カスタムオブジェクト ShippingStatus__c への参照を作成する。", "テキスト項目を作成し、外部IDにする。"], "a": [0], "e": ["正解です。配送状況は10個の固定値であるため、選択リスト項目を使用することでユーザーの入力ゆれを防ぎ、データ品質を向上させることができます。また、選択リストはリレーションを持たないため、20万件のレコードに対して10個の値を割り当てても、データスキューが発生することはありません。", "主従関係を作成すると、10個のShippingStatus__cレコード(親)に対して20万件の商談(子)が紐づくことになります。1つの親レコードに1万件以上の子レコードが紐づくとデータスキューが発生し、レコードロックやパフォーマンス低下の原因となるため不適切です。", "参照関係であっても主従関係と同様に、少数の親レコードに対して大量の子レコードが関連付けられるため、データスキュー(参照スキュー)の問題が発生します。", "テキスト項目を使用すると、ユーザーが自由に入力できてしまうため、スペルミスや表記ゆれが発生しやすくデータ品質が低下します。また、単なるステータス値に対して外部IDを設定する要件はありません。"], "note": "顧客カテゴリの問題と同じ型で、値が10個でも結論は同じ。20万件 ÷ 10 ＝ 2万件なので、1つの親に1万件を超える。偏りの目安を超えているかを計算で確かめられる。\n\n設問が「データ品質を向上させ、データスキューを回避する」と2つ要求していることに注意。テキスト項目は品質の条件を満たさず、リレーションの2案はスキューの条件を満たさない。両方を満たすのは選択リストだけ。要求が2つ書かれているときは、両方で選択肢を削る。"}, {"n": 84, "t": "アーキテクトはクライアントから、Salesforceと1つ以上の外部システム間でデータを統合し、重複や不一致を解決するソリューションの開発を依頼されました。このソリューションを実現するためにマスターデータ管理システムを使用するかどうかを決定する際、アーキテクトが考慮すべき2つの要素は何ですか？2つ選択してください。", "c": ["システムがクラウドベースかオンプレミスか。", "SalesforceがレガシーCRMを置き換えたかどうか。", "テーブルごとに記録システムが変わるかどうか。", "相互に統合されるシステムの数。"], "a": [2, 3], "e": ["システムのホスティング形式は、統合の技術的な接続方法やミドルウェアの選定には影響しますが、データを一元管理するためのマスターデータ管理システムを導入するべきかどうかを決定する主要な要因ではありません。", "過去にどのようなシステム移行が行われたかという歴史的背景は、現在の環境において複数のシステム間でデータをどう一元管理するかというマスターデータ管理の必要性を評価する直接的な基準にはなりません。", "正解です。データの種類やテーブルごとにどのシステムが信頼できる唯一の情報源(記録システム)として機能するかが異なる場合、複雑なデータの競合を解決し一貫性を保つためにマスターデータ管理システムの導入が非常に有効な解決策となります。", "正解です。連携する外部システムの数が多くなるほど、データモデルの不一致や重複を解決するための複雑さが増します。システム数が多い環境では、データの一元管理とクレンジングを担うハブとしてマスターデータ管理システムを使用する利点が大きくなります。"], "note": "マスターデータ管理が要るかどうかは、複雑さで決まる。複雑さを生むのは2つ——つながるシステムの数と、正本がデータの種類ごとにばらけているかどうか。この2つがそのまま正解になっている。\n\n「テーブルごとに記録システムが変わる」が何を言っているかを噛み砕くと、顧客の正本はCRM、商品の正本はERP、価格の正本は別システム、というように種類ごとに正本が違う状態。この状態だと、どれを信じるかを一か所で管理しないと破綻する。"}, {"n": 85, "t": "DreamHouse Realtyには、複数システムのERP環境で営業、サポート、マーケティングの取り組みを管理するSalesforceのデプロイがあります。同社は最近、標準のレポートとダッシュボードの制限に達しており、より分析的なインサイトを提供するためのオプションを必要としています。アーキテクトが推奨するべき2つのアプローチは何ですか？（2つ選択してください。）", "c": ["毎週のスナップショット", "Einstein Analytics", "設定変更履歴", "AppExchangeアプリ"], "a": [1, 3], "e": ["レポートスナップショット機能は、特定の時点のデータを保存して履歴トレンドを分析するのには役立ちますが、標準のレポートやダッシュボード自体の制限（処理できるデータ量や複雑な結合の制限など）を根本的に克服するものではありません。そのため、より高度で複雑な分析インサイトを求める場合の解決策としては不十分です。", "正解です。Einstein Analytics（現在はCRM Analyticsと呼ばれます）は、数千万件以上の大量のデータを処理し、外部システム（ERPなど）のデータとSalesforceのデータを組み合わせて高度なデータ探索や予測分析を行うことができるため、標準のレポート機能を補完する強力な分析ソリューションです。", "設定変更履歴は、組織のメタデータや設定の変更履歴を追跡、監査するための管理者向け機能です。顧客データや販売データなどのビジネスデータの分析や、インサイトの提供を目的とした機能ではありません。", "正解です。AppExchangeには、高度なデータ分析、ダッシュボードの拡張、外部データベースとの連携に特化したサードパーティ製のBI（ビジネスインテリジェンス）ツールや分析アプリケーションが多数提供されています。これらを活用することで、標準機能の制限を超えた分析要件を満たすことができます。"], "note": "Wave Analytics の問題と中身は同一で、製品名だけが Einstein Analytics に変わっている。同じ問題が別名で2回出ているので、改称の歴史を知らないと別物に見える。Wave → Einstein Analytics → Tableau CRM → CRM Analytics と変わってきた。\n\n同じ出題が名前を変えて複数回入っていること自体が、この問題集が長期間かけて集められたものだという証拠でもある。古い名前が残っている箇所は他にもある。"}, {"n": 86, "t": "顧客は、カスタムオブジェクトに緯度と経度を含む地理位置情報を保持したいと考えています。この要件を満たすために、データアーキテクトは何を推奨するべきですか？", "c": ["この要件のために、地理位置情報関数を使用した数式項目を作成する。", "緯度と経度の情報を保持するためのカスタム項目を作成する。", "この要件を維持するための地理位置情報カスタム項目を作成する。", "この要件をサポートするAppExchangeパッケージを推奨する。"], "a": [2], "e": ["数式項目は他の項目の値に基づいて計算結果を表示するものであり、ユーザーやシステムが直接データを入力して保存するためのものではありません。位置情報のデータを新しく保持するという要件を満たすことはできません。", "緯度用と経度用にそれぞれ個別の数値項目やテキスト項目を作成してデータを保存することは技術的には可能ですが、Salesforceが提供する位置情報計算や検索などの機能をネイティブに活用できなくなるため、最適な設計ではありません。", "正解です。Salesforceには「地理位置情報」というカスタム項目のデータ型が標準で用意されています。これを使用することで、緯度と経度を1つの複合項目として適切に保存でき、距離の計算や位置ベースのクエリ(SOQLでの距離の測定など)を簡単に実行できるようになります。", "緯度と経度を保存するという基本的な要件は、Salesforceの標準の項目データ型である地理位置情報項目で完全に満たすことができるため、追加のAppExchangeパッケージを導入してシステムを複雑にする必要はありません。"], "note": "地理位置情報という専用のデータ型があることを知っているかだけの問題。覚えておくとよい付随事項が2つある。①この項目は内部的に3つのカスタム項目を消費する（項目数の上限に対して3つ分）②距離を測るための専用の関数が使える。\n\n「数式項目は保存のための器ではない」という点も、他の問題で効く。数式項目は常に計算して表示するだけで、値を入れることはできない。"}, {"n": 87, "t": "大手自動車会社が営業担当者向けにSalesforceを導入しました。リードはSalesforceのバッチ統合を使用して、WebサイトからSalesforceに流入します。バッチジョブはSalesforceでリードを取引先に変換します。小売店を訪れる顧客も、Salesforceで取引先として作成されます。同社は、Salesforce内に多数の重複する取引先があることに気づきました。分析の結果、一部の顧客はWebサイトを利用し、さらに店舗にも来店する可能性があることがわかりました。営業担当者は、顧客を作成する前にグローバル検索を使用してSalesforce内で顧客を検索します。重複を避けるために、データアーキテクトはどのオプションを実装するべきでしょうか？", "c": ["取引先の作成プロセス中に重複を検証するために、Salesforceの重複ルールを活用する。", "重複を検索し、毎晩それらを削除するApexクラスを開発する。", "Salesforceで作成する前に顧客情報を検証するためのMDMソリューションを導入する。", "営業担当者が小売店への来店時にリアルタイムで顧客を検索できるカスタム検索機能を構築する。"], "a": [0], "e": ["正解です。Salesforceの標準機能である重複ルールと一致ルールを活用することで、ユーザーが手動で作成する場合やシステムがバッチで作成する場合の両方において、リアルタイムで重複を検知し、作成をブロックしたり警告を出したりすることができます。これが最も標準的で効果的な重複防止のアプローチです。", "毎晩Apexクラスで重複を削除するバッチ処理を構築することは事後対応になります。重複レコードがいったんシステムに作成されてしまうため、日中の業務においてデータの不整合や混乱を招く可能性があり、重複の発生そのものを防ぐ根本的な解決策にはなりません。", "MDM(マスターデータ管理)ソリューションの導入は、全社的な複数システム間のデータ統合やクレンジングには有効ですが、今回のケースのようにSalesforce内での取引先の重複作成を防ぐ目的のためだけに導入するには、コストと複雑さが高すぎます。Salesforceの標準機能で解決できる要件に対しては過剰なアプローチです。", "設問にある通り、営業担当者はすでにグローバル検索を使用して事前の確認を行っていますが、それでも人為的ミスによる重複が発生しています。さらに、カスタムの検索機能を構築したとしても、Webサイトからのバッチ処理によって自動的に作成される取引先の重複を防ぐことはできないため、システム全体の重複回避策としては不十分です。"], "note": "重複がどこで生まれているかを数えると答えが決まる。この問題では入口が2つある——Webサイトからのバッチと、店舗での手入力。片方だけを塞ぐ案（営業担当者向けの検索機能）では足りない。両方に効くのは重複ルール。\n\nマスターデータ管理が不正解になるのは、問題がSalesforce内で完結しているから。複数システムにまたがっていないのにMDMを持ち出すのは過剰。前問との違いがここにある。"}, {"n": 88, "t": "Universal Containers (UC) は、商談、カスタム商談品目オブジェクト、およびカスタム割引リクエストに対して複数レベルの主従関係を設定しています。UCは主従関係において、商談を主、カスタム品目オブジェクトを従としています。また、別の主従関係において、カスタム品目オブジェクトを主、カスタム割引リクエストオブジェクトを従としています。UCには、商談レベルで品目全体の割引の合計を表示するという要件があります。これらの要件に対処するための推奨されるソリューションは何ですか？", "c": ["1つのレベルの積み上げ集計しか許可されていないため、品目レベルの集計には積み上げ集計を使用し、商談金額の集計にはトリガを使用する。", "割引金額を積み上げ集計できるようにするために、主従関係を参照関係に更新する。", "主従関係を削除し、割引金額を集計するためにワークフローとトリガに完全に依存する。", "品目レベルで割引リクエスト金額を積み上げ集計し、商談レベルで品目レベルの割引集計を積み上げ集計する。"], "a": [3], "e": ["Salesforceでは、主従関係は最大3階層（親、子、孫）まで許可されており、孫から子へ、そして子から親へと複数レベルで標準の積み上げ集計項目を使用することがシステム上可能です。したがって、1つのレベルしか許可されていないという説明は誤りであり、トリガを使用する必要もありません。", "標準の積み上げ集計項目機能を利用するには、オブジェクト間が主従関係である必要があります。参照関係に変更してしまうと、標準機能での積み上げ集計が利用できなくなるため不適切です。", "既存の主従関係と標準の積み上げ集計項目で完全に実現可能な要件に対して、それらを意図的に削除してカスタム開発（Apexトリガなど）で再構築することは、開発コストと保守の観点からベストプラクティスに反します。", "正解です。まず孫オブジェクト（カスタム割引リクエスト）の金額を子オブジェクト（カスタム商談品目）の積み上げ集計項目にまとめます。次に、親オブジェクト（商談）に別の積み上げ集計項目を作成し、子オブジェクトにまとめたその値をさらに集計します。この標準機能を活用した段階的な集計が最も推奨されるアプローチです。"], "note": "覚える事実は2つ。主従関係は3階層まで作れる。積み上げ集計は主従関係でしか使えない（参照関係では使えない）。\n\n3階層あるということは、孫→子、子→親と2段階で集計を積み上げられるということ。この問題はまさにそれを問うている。\n\n不正解の選択肢が「1つのレベルしか許可されていない」という誤った前提を述べている点にも注意。選択肢の中に事実と違う説明が混ざっていることがあるので、断定的な数字が出てきたら疑う。"}, {"n": 89, "t": "Universal Containerは営業チーム向けにSales Cloudを実装しており、顧客マスターとしてエンタープライズリソースプランニング(ERP)を使用しています。営業チームは、重複した取引先と取引先データのデータ品質の問題について不満を述べています。これらの不満を解決するために、データアーキテクトはどの2つのソリューションを推奨するべきですか？", "c": ["データを重複排除し、取引先レコードをマージするための夜間バッチジョブを構築する。", "SalesforceをERPと統合し、ERPを信頼できる情報源とする。", "ERPからSalesforceへの夜間同期ジョブを構築する。", "重複排除ソリューションを実装し、Salesforceで取引先の所有権を確立する。"], "a": [1, 3], "e": ["夜間のカスタムバッチジョブで自動的にデータをマージしようとすると、誤ったレコードが結合されるリスクが高くなります。また、日中にユーザーが重複レコードを作成すること自体を防ぐことができないため、データ品質問題の根本的な解決策にはなりません。", "正解です。ERPがすでに顧客マスターとして位置付けられている場合、ERPを信頼できる唯一の情報源（System of Truth）として定義し、Salesforceと適切に統合（マスターデータ管理の確立）することで、システム全体で一貫した正確な顧客データを維持できるようになります。", "夜間にデータを同期するだけでは、Salesforce側でユーザーがリアルタイムで重複データを作成してしまうことを防げません。データ統合の一環としてはあり得ますが、これ単体では重複やデータ品質の低下という現在の課題を直接的に解決する推奨ソリューションとは言えません。", "正解です。Salesforceの標準の重複管理（一致ルールと重複ルール）やAppExchangeの重複排除ソリューションを導入することで、システムへの重複データの入力を未然に防ぐことができます。さらに、データの所有権（ガバナンスと責任）を明確にすることで、ユーザー自身がデータ品質を維持する意識が高まります。"], "note": "重複の問題だが、前問と違ってシステムが2つある（SalesforceとERP）。しかも問題文が「ERPが顧客マスター」と明記している。正本がどちらかが書いてあるので、それを前提に統合する案が正解になる。\n\nもう1つの正解は重複排除。つまり「正本を決めて統合する」と「入口で重複を止める」の両輪。片方だけでは解決しない。\n\n夜間バッチで自動マージする案が不正解になる理由は覚えておく価値がある。マージは不可逆な操作で、自動で誤って結合すると取り返しがつかない。"}, {"n": 90, "t": "Universal Containers (UC) には1000万件以上の取引先があり、各取引先には平均20件の商談があります。UCの営業幹部は、特定の商談フェーズにあるすべての商談の日次レポートを作成する必要があります。大量のデータボリュームによってレポートのパフォーマンスが低下しないようにするために、考慮すべき2つの重要な事項は何ですか？2つ選択してください。", "c": ["同時に実行されるクエリの数。", "レポートクエリで使用される結合の数。", "レポートクエリによって返されるレコードの数。", "レポートクエリの文字数。"], "a": [1, 2], "e": ["同時に実行されるクエリの数はプラットフォーム全体の同時実行制限などに関連しますが、個々のレポートのデータ取得パフォーマンスや、大規模データボリューム環境における特定のレポートクエリの遅延を評価する際の直接的な要因ではありません。", "正解です。レポート内で複数のオブジェクトを結合(リレーション関係をまたいだ参照など)すると、データベースへの負荷が大きくなります。数千万件単位の大規模データ環境では、結合の数が増えるほどクエリのパフォーマンスが著しく低下するため、カスタムレポートタイプなどで結合の数を最小限に抑える考慮が必要です。", "正解です。レポートによって抽出および処理されるレコードの総数は、パフォーマンスに直接影響します。インデックス付きの項目(フェーズなど)を検索条件として使用してクエリの選択性を高め、返されるターゲットレコード数を絞り込むことで、レポートのタイムアウトやパフォーマンス低下を防ぐことができます。", "SOQLクエリ自体の長さ(文字数)にはシステムの制限がありますが、文字数そのものがデータベースの処理速度やクエリのパフォーマンス低下を引き起こす原因にはなりません。"], "note": "件数を出してみる。1000万件 × 20件 ＝ 2億件の商談。この規模でレポートを回すと、結合の数と返す件数が直接効いてくる。\n\n覚え方は単純で、レポートが遅くなる原因は「どれだけのオブジェクトをまたぐか」と「何件返すか」の2つ。クエリの文字数は関係ない。\n\n絞り込みに使う項目が索引を持っているか（選択性）という論点とつながっている。フェーズで絞るなら、フェーズに索引があるかが効く。"}, {"n": 91, "t": "Cloud KicksはSalesforceから詳細なトランザクションレコードを消去する必要があります。データはサマリーレベルで集計され、Salesforce内で利用可能である必要があります。この目標を達成するための2つの自動化されたアプローチは何ですか？（2つ選択してください。）", "c": ["サードパーティの統合ツール (ETL)", "スケジュール可能なBatch Apex", "サードパーティのビジネスインテリジェンスシステム", "Apexトリガ"], "a": [0, 1], "e": ["正解です。ETL（抽出、変換、格納）ツールを使用することで、Salesforceから大量の詳細レコードを抽出し、外部でデータを集計（変換）した後、そのサマリーデータをSalesforceに書き戻し、元の詳細レコードを削除するという一連のデータアーカイブおよび集計プロセスを自動化できます。", "正解です。スケジュール済みのBatch Apexを使用すると、夜間などの定期的なタイミングで詳細レコードをクエリして集計処理を行い、計算結果をサマリー用オブジェクトのレコードとして保存してから、不要になった元の詳細レコードを削除する一連の処理をSalesforceプラットフォーム内で自動化できます。", "BIシステムは、データの可視化や高度な分析を実行するのには非常に優れていますが、Salesforceに集計データを書き戻したり、Salesforce内の詳細レコードを自動的にパージ（削除）したりするためのデータ操作・自動化ツールとしては設計されていません。", "Apexトリガはレコードの作成、更新、削除時などにリアルタイムで実行される機能です。データの集計を行うことは可能ですが、定期的に大量のトランザクションレコードをパージ（一括削除）してサマリーを残すという要件に対しては、ガバナ制限に抵触しやすく、非同期のバッチ処理が求められるため不適切です。"], "note": "設問が「自動化されたアプローチ」と言っていることに注目する。定期的に走らせる仕組みが要るので、トリガ（レコード操作のたびに動く）は合わない。\n\nBIシステムが不正解になるのは、読むための道具であって、書き戻したり消したりはしないから。この問題集では分析の道具を混ぜる引っかけが繰り返し出るので、「見るだけか、動かせるか」で切る。\n\nETLとBatch Apexの違いは、処理を外でやるか中でやるかだけ。どちらも正解になりうる。"}, {"n": 92, "t": "UCには、ケース履歴とSLAデータを含む何百万ものケースレコードがあります。UCのコンプライアンスチームは、監査目的で過去のケースに10年間アクセスできるようにしたいと考えています。データアーキテクトはどのソリューションを推奨すべきですか？", "c": ["Salesforceのアーカイブプロセスを使用してケースデータをアーカイブする", "ケースオブジェクトをサポートするためにデータストレージを追加購入する", "アーカイブされたケースデータを保存するためにカスタムオブジェクトを使用する", "アーカイブされたケースデータを保存するためにカスタムBig Objectを使用する"], "a": [3], "e": ["SalesforceにはToDoや行動などの一部のオブジェクトに対して自動アーカイブ機能が存在しますが、ケースやその関連データを10年間無制限にアーカイブしてアクセス可能にする汎用的な標準の「アーカイブプロセス」は存在しないため、この要件は満たせません。", "何百万ものレコードを通常のデータストレージに10年間保持し続けるためにストレージを追加購入することは、運用コストが非常に高額になるだけでなく、大量のデータが本番環境に残り続けることでシステム全体のパフォーマンス低下を引き起こすため推奨されません。", "標準のケースオブジェクトからカスタムオブジェクトにデータを移動させたとしても、依然としてSalesforceの通常のデータストレージを消費します。そのため、ストレージ容量の圧迫やパフォーマンスの問題を根本的に解決することにはなりません。", "正解です。Big Objectは、数百万から数十億ものレコードをSalesforceプラットフォームのパフォーマンスを低下させることなく一貫して保存・管理できるように設計されています。監査目的で大量の履歴データを長期間（10年間など）保持し、必要に応じてアクセスするというアーカイブ要件に最適なソリューションです。"], "note": "カスタムオブジェクトに移す案が不正解になる理由が、この問題の核心。同じSalesforce内の通常のオブジェクトに移しても、ストレージの消費もパフォーマンスへの影響も変わらない。置き場所を変えただけでは解決しない。\n\nBig Object は通常のストレージとは別枠で、桁違いの件数を扱える。その代わり標準レポートが使えないが、この問題は「監査目的でアクセスできればよい」なので制約が問題にならない。\n\n項目の値の変更履歴を10年保持したい場合は Field Audit Trail という別の機能になる。レコードそのものを10年残すのか、項目の変更履歴を10年残すのかで答えが変わるので、問題文を読み分ける。"}, {"n": 93, "t": "毎年、Ursa Major Solarには100万件以上の注文があります。各注文には平均して10件の注文品目が含まれています。最高経営責任者（CEO）は、営業担当者が各顧客から前年比でどれだけの金額が生み出されているかを確認できるようにしたいと考えています。しかし、Salesforceのデータストレージが不足しつつあります。このシナリオに適したデータアーカイブのアプローチはどれですか？", "c": ["毎年、注文品目をエクスポートして削除し、後でデータが必要になった場合に備えてzipファイルに保存する。", "毎年、注文金額データを集計してカスタムオブジェクトに保存し、それらの注文と注文品目を削除する。", "毎年、注文と注文品目をエクスポートして削除し、後でデータが必要になった場合に備えてzipファイルに保存する。", "毎年、注文と注文品目を削除し、顧客が別のシステムに注文情報を持っていることを確認する。"], "a": [1], "e": ["注文品目を外部のzipファイルに保存してSalesforceから削除してしまうと、営業担当者がSalesforce内で前年比の収益を確認するというCEOの要件を満たすことができなくなります。", "正解です。必要なデータ（各顧客の前年比の収益）を集計してカスタムオブジェクトに保持することで、営業担当者は引き続きSalesforce内で必要なレポートや情報を確認できます。同時に、大量のデータストレージを消費する詳細な注文と注文品目レコードを削除できるため、データストレージ不足の問題とビジネス要件の両方を効果的に解決できる最適なアプローチです。", "注文データ全体をエクスポートしてSalesforceから完全に削除してしまうと、Salesforce内で前年比の収益データを表示できなくなるため、ビジネス要件を満たしません。", "別のシステムにデータを持たせるだけでは、営業担当者がSalesforce内で直接顧客ごとの収益履歴を確認するという要件を満たすことができません。Salesforce内で完結する要約データの保持が必要です。"], "note": "100万件 × 10品目 ＝ 年1,000万件。数を出すと規模感がつかめる。\n\nこの問題の型は「何が残っていれば要件を満たすか」を先に読むこと。要件は「顧客ごとの前年比の金額をSalesforceで見られること」だけで、明細そのものを見る必要はない。だから集計だけ残して明細を消してよい。\n\n外に出してzipで保管する案が3つのうち2つを占めているが、どれもSalesforce内で見られなくなる時点で要件を満たさない。要件の文言と照らすだけで消える。"}, {"n": 94, "t": "Universal Containersには、項目履歴を追跡したい多数の商談項目(100個)があります。この要件を満たすために、アーキテクトが実行すべき2つのアクションはどれですか？2つ選択してください。", "c": ["変更されたときにレコードのコピーを保存するカスタムオブジェクトを作成する。", "変更前と変更後の項目の値を保存するカスタムオブジェクトを作成する。", "変更されたときにレコードのコピーを保存するために分析スナップショットを使用する。", "商談の項目履歴管理の設定ページで100個の項目を選択する。"], "a": [0, 1], "e": ["正解です。Salesforceの標準の項目履歴管理では、1つのオブジェクトにつき最大20項目(Field Audit Trailアドオンを使用しても最大60項目)までしか追跡できません。100個の項目を追跡するには標準機能の制限を超えるため、Apexトリガなどを使用して、レコードが変更されたタイミングでその時点のレコードのコピーを保存するためのカスタムオブジェクトを作成するアプローチが有効です。", "正解です。標準機能の制限を回避するためのカスタムソリューションです。Apexトリガを使用して変更を検知し、標準の項目履歴オブジェクトのような構造(どの項目が、どの値から、どの値に変更されたか)を持つカスタムオブジェクトを作成して、変更前と変更後の値を記録することで要件を満たすことができます。", "分析スナップショット(現在のレポートスナップショット)は、日次や週次などスケジュールされたタイミングでレポート結果を抽出し、カスタムオブジェクトに保存してトレンド分析を行うための機能です。レコードが変更された瞬間にリアルタイムで変更内容を保存する用途には使用できません。", "Salesforceの標準設定画面では、項目履歴管理の追跡対象として選択できる項目数は最大20項目に制限されています。そのため、設定ページで100個の項目を選択することはシステム上不可能です。"], "note": "覚える数字は2つ。項目履歴管理で追跡できるのは1オブジェクトあたり20項目まで。Field Audit Trail を入れると60項目まで（かつ保持が最長10年に延びる）。どちらにしても100項目には届かないので、標準機能では解けない。\n\nこの上限を知らないと、設定画面で100個選ぶ案を選んでしまう。数字そのものが答えを決める問題。\n\n2つの正解は、記録の仕方が違うだけで発想は同じ。レコードまるごとのコピーを残すか、変わった項目だけを「前の値・後の値」で残すか。後者は標準の項目履歴と同じ構造になる。"}, {"n": 95, "t": "USはSalesforceを導入しており、顧客の苦情の追跡、製品に関するホワイトペーパーの提供、およびサブスクリプション（有料）ベースのサポートの提供にSalesforceを使用する予定です。USの要件を満たすために、USのユーザーはどのライセンスタイプを必要としますか？", "c": ["Lightningプラットフォームスターターライセンス", "Service Cloudライセンス", "Salesforceライセンス", "Sales Cloudライセンス"], "a": [1], "e": ["Lightningプラットフォームスターターライセンスは、カスタムアプリケーションや一部の標準オブジェクトへのアクセスを提供するものですが、ナレッジやサービス契約、エンタイトルメントといった高度なカスタマーサポート機能にはアクセスできないため、今回の要件を満たすことはできません。", "正解です。顧客の苦情の追跡（ケース）、ホワイトペーパーの提供（ナレッジ）、およびサブスクリプションベースのサポート（サービス契約およびエンタイトルメント管理）といった一連の要件は、Service Cloudのコア機能に該当します。これらの機能をフルに活用して要件を満たすためには、Service Cloudライセンスが必要となります。", "一般的なSalesforceライセンスでも基本的なケース管理にはアクセスできますが、有料サポートを管理するためのエンタイトルメントやサービス契約機能、またナレッジベースの構築など、より包括的なサポート要件を満たすためには、Service Cloudの機能セットが必要となります。", "Sales Cloudライセンスは主に商談、リード、キャンペーンなどの営業プロセスの管理に特化しています。基本的なケース管理は含まれていますが、高度なサポート管理やナレッジ管理機能に焦点を当てたものではないため、今回のカスタマーサービスの要件には最適ではありません。"], "note": "要件の3つを機能名に翻訳できるかが問われている。苦情の追跡＝ケース。ホワイトペーパーの提供＝ナレッジ。有料サポート＝エンタイトルメントとサービス契約。この3つが揃うのは Service Cloud だけ。\n\nとくに「有料サポート」＝エンタイトルメント（受けられるサポートの範囲と期限を管理する機能）という対応は、知らないと結びつかない。契約レベルによってサポートの内容が変わる、という要件が出たらこの機能を思い出す。"}, {"n": 96, "t": "Ursa Major Solarは、自社のSalesforceデータに対する新しいデータ品質計画を定義しました。この計画を組織全体で適用するために、アーキテクトが推奨すべき2つのアプローチはどれですか？（2つ選択してください。）", "c": ["すべてのデータが外部システムに保存されるようにし、Salesforceへの参照のみのアクセス用の統合を設定する。", "重複を自動的に検出し、毎週レコードをマージまたは削除するレポートをスケジュールする。", "ワークフロー、入力規則、およびApexコードを使用して、重要なビジネスプロセスを強制する。", "情報が欠落しているレコードを表示する週次ダッシュボードをスケジュールし、レビューのためにマネージャーに送信する。"], "a": [2, 3], "e": ["Salesforceを単なるデータのビューアとして使用することは、SalesforceのCRMとしてのコア機能やプロセス管理を無効にしてしまうため、データ品質計画を適用するための適切なアーキテクチャアプローチではありません。", "標準のレポート機能には、重複レコードを自動的にマージしたり削除したりするアクションを実行する機能は含まれていません。重複の防止や管理には、重複管理（重複ルールや一致ルール）を使用する必要があります。", "正解です。入力規則を利用して保存前にデータの完全性をチェックしたり、ワークフローやApexを活用してビジネスルールを自動化したりすることで、ユーザーが不正確なデータを作成するのを防ぎ、システムレベルでデータ品質をプロアクティブに維持できます。", "正解です。データの欠落や品質基準を満たしていないレコードをダッシュボードで可視化し、管理者に定期的にレポートを送信することで、ユーザーへの指導やデータのクレンジング作業を促進し、組織全体で継続的にデータ品質を監視するプロセスを確立できます。"], "note": "正解の2つは役割が違う。入力規則などは「入らせない」ための予防で、ダッシュボードは「入ってしまったものを見つける」ための監視。品質の仕組みは予防と監視の両輪になる、という形で覚えると選びやすい。\n\nレポートが自動でマージや削除をする、という選択肢は事実として誤り。レポートは表示するだけで、レコードを操作しない。同じ誤りがワークフローについても繰り返し出題されている。"}, {"n": 97, "t": "UCは、地域の支社全体に分散している複数のSalesforce組織を持っています。各支社は、ローカルの顧客データを組織内の取引先および取引先責任者オブジェクトに保存しています。これにより、UCがすべての組織にわたって顧客を表示できない状況が生じています。UCは、すべての組織の取引先と取引先責任者のデータを1か所で表示したいため、顧客の360度ビューを作成するイニシアチブを持っています。顧客のこの360度ビューを実現するために、データアーキテクトは何を提案するべきでしょうか？", "c": ["各組織のデータを一元化されたデータストアに統合する。", "Salesforce Connectのクロス組織アダプタを使用する。", "すべての組織間で双方向のインテグレーションを構築する。", "ETLツールを使用して、不足している取引先と取引先責任者を各組織に移行する。"], "a": [0], "e": ["正解です。各組織のデータを一元化されたデータストア(データウェアハウスやMDMシステムなど)に統合することで、分散したデータをクレンジングし、名寄せして単一の信頼できる情報源を構築できます。これは、複数のシステムにまたがる顧客の真の360度ビューを確立し、維持するための最も標準的かつスケーラブルなアーキテクチャのアプローチです。", "Salesforce Connectのクロス組織アダプタを使用すると、ある組織から別の組織のデータを参照することは可能ですが、複数の組織間で重複するデータをクレンジングして名寄せしたり、分析可能な一元化されたマスターレコードを構築したりする目的には適していません。", "すべての組織間で相互に双方向のインテグレーション(ポイントツーポイント統合)を構築すると、組織の数が増えるにつれて接続が複雑に絡み合うスパゲッティ状態になり、メンテナンスや拡張が極めて困難になるため推奨されません。", "ETLツールを使用して組織間でデータを相互にコピーし合うと、データの重複が大量に発生し、データストレージを無駄に消費するだけでなく、どの組織のデータが最新で正しいのかというデータ整合性の問題を引き起こすため、不適切な設計です。"], "note": "読み取り専用で他組織を見たいだけの問題では Salesforce Connect のクロス組織アダプタが正解になったが、この問題では不正解になる。違いは「360度ビュー」という語にある。\n\n360度ビューは、同じ顧客が複数の組織に別々に存在している状態を、名寄せして1人としてまとめることを含む。単に相手の組織を覗けるだけでは足りない。だから外に一元化した置き場を作る。\n\nこの2問は必ず並べて覚える。見るだけならクロス組織アダプタ、名寄せしてまとめるなら一元化したデータストア。\n\nポイントツーポイント統合（全組織を相互につなぐ）が不正解になるのも定番。つなぐ線の数が組織数の二乗で増えて破綻する。"}, {"n": 98, "t": "Universal Containersは、ユーザーがSalesforce UIを通じてシステムに手動で入力しているデータを監視するためのデータ品質プロセスを実装したいと考えています。アーキテクトはどのアプローチを推奨するべきですか？", "c": ["Salesforceインポートツールを使用してユーザーがデータをインポートできるようにする。", "データアップロードのためにAppExchangeのサードパーティ製ソリューションを利用する。", "データ品質ダッシュボードを作成するためにAppExchangeのアプリを利用する。", "Apexを使用して電話番号や郵便番号の形式を検証する。"], "a": [2], "e": ["インポートツールは一括データ読み込みのためのものであり、UIを通じて手動で入力されるデータを継続的に監視するプロセスをサポートする機能ではありません。", "サードパーティ製のアップロードツールはデータの移行や一括登録を目的としたものであり、ユーザーがUIから手動入力するデータの品質をモニタリングする要件には適合しません。", "正解です。ユーザーがSalesforce UIを通じて手動で入力するデータを継続的に監視するためには、データの正確性や不備を視覚的に追跡できるデータ品質ダッシュボードを活用するAppExchangeのアプリケーションの導入が効果的です。", "Apexによるバリデーションは特定の入力形式をチェックするのに役立ちますが、システム全体で手動入力されるデータ品質全般を継続的に監視・レポートするためのプロセスやダッシュボードの要件を満たすものではありません。"], "note": "設問の動詞が「監視する」であることを読む。入れさせない（入力規則）でも、直す（クレンジング）でもなく、状態を見続けること。だからダッシュボードが答えになる。\n\n同じ「データ品質」でも、予防・監視・是正のどれを求めているかで答えが変わる。この問題集には3種類とも出てくるので、設問の動詞で切り分ける習慣をつける。\n\nAppExchange のデータ品質ダッシュボード（Salesforce Labs が無償提供しているものが定番）は、この種の問題の決まった答え。"}, {"n": 99, "t": "DreamHouse Realtyには、Order_cカスタムオブジェクトに1500万件のレコードがあります。一括クエリを実行すると、クエリがタイムアウトします。この問題に対処するために何を検討するべきでしょうか？", "c": ["Tooling API", "PK Chunking", "Metadata API", "Streaming API"], "a": [1], "e": ["Tooling APIは、Salesforceのメタデータや開発ツールの構築に使用されるAPIであり、大規模なデータセットのクエリやデータ抽出のパフォーマンスの最適化を目的としたものではありません。", "正解です。PK Chunking (Primary Key Chunking) は、Bulk APIを使用して数百万件以上の大量のレコードを抽出する際に、クエリを主キー(レコードID)に基づいて自動的に小さなチャンクに分割する機能です。これにより、クエリのタイムアウトを防ぎ、大規模データのエクスポートパフォーマンスを大幅に向上させることができます。", "Metadata APIは、組織のカスタマイズ（カスタムオブジェクト、ページレイアウトなどのメタデータ）の管理や移行するために使用されます。レコードデータのクエリや抽出のタイムアウトを解決するための機能ではありません。", "Streaming APIは、Salesforceのデータの変更をリアルタイムで外部アプリケーションにプッシュ通知するためのAPIです。大量の既存データを一度に抽出するためのクエリのタイムアウト問題を解決するものではありません。"], "note": "PK Chunking を問う問題はこの問題集に4問あり、すべて条件が同じ。数百万件以上、抽出、タイムアウト。この3語が揃ったら即答できる。\n\n残りの選択肢は、APIの役割分担を知っていれば消える。Tooling API＝開発ツール用、Metadata API＝設定を運ぶ、Streaming API＝変更を知らせる。どれもデータの抽出が目的ではない。"}, {"n": 100, "t": "データ分類機能により、顧客はSalesforceでどの2つのデータ管理ポリシーを分類できますか？2つ選択してください。", "c": ["参照データポリシー", "データガバナンスポリシー", "データの機密性レベル", "コンプライアンスの分類ポリシー"], "a": [2, 3], "e": ["参照データ管理は一般的なデータマスター管理の概念ですが、Salesforceの標準のデータ分類機能において、メタデータ項目として指定できる具体的な分類ポリシーではありません。", "データ分類機能を利用すること自体がデータガバナンスの一環ですが、「データガバナンスポリシー」という名前のメタデータ項目がSalesforceの項目定義に直接用意されているわけではありません。", "正解です。Salesforceのデータ分類機能には、各項目に保存されるデータがどれほど機密であるか（公開、社内、極秘など）を記録するための「データの機密性レベル」という標準のメタデータ項目が用意されています。", "正解です。Salesforceのデータ分類機能には、各項目が特定の法規制やコンプライアンス要件（GDPR、HIPAA、PIIなど）にどのように該当するかを記録するための「コンプライアンスの分類」という標準のメタデータ項目が用意されています。"], "note": "データ分類で項目に付けられるものは4つ。データ所有者／項目の使用状況／データの機密性レベル／コンプライアンスの分類。この問題はそのうち2つを聞いている。名前を知っているかだけの問題なので、4つをそのまま覚える。\n\nもっともらしいが存在しない名前（参照データポリシー、データガバナンスポリシー）を混ぜる作りになっている。実在する4つを覚えていれば、知らない名前は切れる。\n\nあわせて、データ分類はラベルを貼るだけでアクセス制御はしない、という性質も押さえておく。棚卸しと説明責任のための機能である。"}];
var LABELS = ['A','B','C','D','E','F'];
var KEY = 'daQuizState_v1';
var PASS = 68;
var MODE_LABEL = {exam1:'模試1', exam2:'模試2', all:'全100問', random20:'ランダム20問', review:'復習'};
var state = null;

function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function order(n){ var r=[]; for(var i=0;i<n;i++) r.push(i); return shuffle(r); }
function mkItem(qi){ return {qi:qi, co:order(ALL_QUESTIONS[qi].c.length), sel:[], picked:null}; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function wrongIdx(){
  var s = load(); if(!s || !s.items) return [];
  var out=[]; s.items.forEach(function(it){ if(it.picked!==null && !isRight(it)) out.push(it.qi); });
  return out;
}
function buildItems(mode){
  var idx;
  if(mode==='exam1') idx = ALL_QUESTIONS.map(function(q,i){return i;}).slice(0,50);
  else if(mode==='exam2') idx = ALL_QUESTIONS.map(function(q,i){return i;}).slice(50);
  else if(mode==='random20') idx = shuffle(ALL_QUESTIONS.map(function(q,i){return i;})).slice(0,20);
  else if(mode==='review') idx = (window.__reviewIdx||[]);
  else idx = ALL_QUESTIONS.map(function(q,i){return i;});
  var ord = (mode==='random20') ? idx : shuffle(idx);
  return ord.map(mkItem);
}
function isRight(it){
  var q = ALL_QUESTIONS[it.qi];
  if(it.picked===null) return false;
  var chosen = it.picked.map(function(p){ return it.co[p]; }).sort();
  var ans = q.a.slice().sort();
  if(chosen.length!==ans.length) return false;
  for(var i=0;i<ans.length;i++) if(chosen[i]!==ans[i]) return false;
  return true;
}
function show(id){
  ['home','quiz','result'].forEach(function(x){ document.getElementById(x).hidden = (x!==id); });
  document.getElementById('bar').hidden = (id!=='quiz');
}
function startQuiz(mode){
  var items = buildItems(mode);
  if(!items.length){ return; }
  state = {mode:mode, items:items, cur:0};
  save(); show('quiz'); render(); window.scrollTo(0,0);
}
function pick(p){
  var it = state.items[state.cur];
  var q = ALL_QUESTIONS[it.qi];
  var need = q.a.length;
  if(it.picked!==null) return;
  if(need===1){ it.picked=[p]; save(); render(); return; }
  var k = it.sel.indexOf(p);
  if(k>=0) it.sel.splice(k,1); else if(it.sel.length<need) it.sel.push(p);
  save(); render();
}
function commit(){
  var it = state.items[state.cur];
  it.picked = it.sel.slice(); save(); render();
}
function render(){
  var it = state.items[state.cur];
  var q = ALL_QUESTIONS[it.qi];
  var need = q.a.length;
  document.getElementById('progBar').style.width = (state.cur/state.items.length*100)+'%';
  document.getElementById('qnum').textContent = (state.cur+1)+' / '+state.items.length+'  (Q'+q.n+')';
  document.getElementById('qmode').textContent = MODE_LABEL[state.mode]||'';
  document.getElementById('qtext').textContent = q.t;
  document.getElementById('multiTag').innerHTML = (need>1) ? '<span class="multi">'+need+'つ選択</span>' : '';

  var cc = document.getElementById('choices'); cc.innerHTML='';
  it.co.forEach(function(orig,p){
    var b = document.createElement('button');
    b.type='button'; b.className='choice';
    b.innerHTML = '<span class="lab">'+LABELS[p]+'</span><span>'+esc(q.c[orig])+'</span>';
    if(it.picked!==null){
      b.disabled = true;
      if(q.a.indexOf(orig)>=0) b.classList.add('correct');
      else if(it.picked.indexOf(p)>=0) b.classList.add('wrong');
    } else {
      if(it.sel.indexOf(p)>=0) b.classList.add('sel');
      b.onclick = function(){ pick(p); };
    }
    cc.appendChild(b);
  });

  var cw = document.getElementById('commitWrap');
  if(it.picked===null && need>1){
    var ok = it.sel.length===need;
    cw.innerHTML = '<button class="btn full" id="commitBtn"'+(ok?'':' disabled')+'>解答する（'+it.sel.length+'/'+need+'）</button>';
    if(ok) document.getElementById('commitBtn').onclick = commit;
  } else cw.innerHTML='';

  var ex = document.getElementById('expl');
  if(it.picked!==null){
    var right = isRight(it);
    var h = '<div class="expl"><div class="verdict '+(right?'ok':'ng')+'">'+(right?'正解':'不正解')+'</div><h4>選択肢ごとの解説</h4>';
    it.co.forEach(function(orig,p){
      var ok = (q.a.indexOf(orig)>=0);
      h += '<div class="row'+(ok?' ok':'')+'"><span class="lab">'+LABELS[p]+'.</span><span>'+esc(q.e[orig])+'</span></div>';
    });
    h += '</div>';
    if(q.note){
      h += '<div class="note"><span class="lab">補足（元の解説とは別の指摘）</span>'
         + q.note.split('\n').filter(function(x){return x.trim();}).map(function(x){ return '<p>'+esc(x)+'</p>'; }).join('')
         + '</div>';
    }
    ex.innerHTML = h;
  } else ex.innerHTML='';

  document.getElementById('prevBtn').disabled = (state.cur===0);
  var nb = document.getElementById('nextBtn');
  nb.textContent = (state.cur===state.items.length-1) ? '結果を見る' : '次へ';
  nb.disabled = (it.picked===null);
}
function go(d){
  if(d>0 && state.cur===state.items.length-1){ finish(); return; }
  state.cur = Math.max(0, Math.min(state.items.length-1, state.cur+d));
  save(); render(); window.scrollTo(0,0);
}
function finish(){
  var n = state.items.length;
  var c = state.items.filter(isRight).length;
  var pct = Math.round(c/n*100);
  var pass = pct>=PASS;
  document.getElementById('scoreVal').textContent = pct+'%';
  document.getElementById('scoreVal').className = 'score '+(pass?'pass':'fail');
  document.getElementById('scoreLab').textContent = n+'問中 '+c+'問正解（合格ラインの目安 '+PASS+'%）';
  var b = document.getElementById('badge');
  b.textContent = pass?'合格ライン到達':'合格ラインに届かず';
  b.className = 'badge '+(pass?'pass':'fail');
  var w = state.items.filter(function(it){ return !isRight(it); });
  var rb = document.getElementById('reviewBtn');
  rb.disabled = (w.length===0);
  rb.textContent = w.length ? ('間違えた'+w.length+'問を復習') : '全問正解';
  window.__reviewIdx = w.map(function(it){ return it.qi; });
  save(); show('result'); window.scrollTo(0,0);
}
function initHome(){
  var s = load();
  var box = document.getElementById('resumeBox');
  if(s && s.items && s.cur < s.items.length && s.items.some(function(it){return it.picked!==null;})){
    box.hidden = false;
    document.getElementById('resumeTxt').textContent =
      (MODE_LABEL[s.mode]||'') + 'の途中です（' + (s.cur+1) + ' / ' + s.items.length + '問目）。';
    document.getElementById('resumeBtn').onclick = function(){ state=s; show('quiz'); render(); window.scrollTo(0,0); };
  } else box.hidden = true;
  var w = wrongIdx();
  var rb = document.getElementById('homeReview');
  rb.disabled = (w.length===0);
  rb.querySelector('.ds').textContent = w.length ? ('前回間違えた'+w.length+'問') : '間違いの記録がありません';
  rb.onclick = function(){ window.__reviewIdx = wrongIdx(); startQuiz('review'); };
}
document.addEventListener('DOMContentLoaded', function(){
  [['m1','exam1'],['m2','exam2'],['mall','all'],['mr20','random20']].forEach(function(p){
    document.getElementById(p[0]).onclick = function(){ startQuiz(p[1]); };
  });
  document.getElementById('prevBtn').onclick = function(){ go(-1); };
  document.getElementById('nextBtn').onclick = function(){ go(1); };
  document.getElementById('quitBtn').onclick = function(){ show('home'); initHome(); window.scrollTo(0,0); };
  document.getElementById('homeBtn').onclick = function(){ show('home'); initHome(); window.scrollTo(0,0); };
  document.getElementById('reviewBtn').onclick = function(){ startQuiz('review'); };
  document.getElementById('resetBtn').onclick = function(){ clear(); state=null; show('home'); initHome(); };
  show('home'); initHome();
});
</script>
</body>
</html>
